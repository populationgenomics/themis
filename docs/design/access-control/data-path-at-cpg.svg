<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="696" viewBox="0 0 1240 696" font-family="Helvetica, Arial, sans-serif" font-size="13">
<defs><filter id="sh" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#0f172a" flood-opacity="0.10"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker></defs>
<rect width="1240" height="696" fill="#fff"/>
<text x="24" y="32" font-size="19" font-weight="bold">At CPG: a sample's files mounted into an Analysis's sandbox (dev)</text>
<text x="24" y="52" font-size="12.5" fill="#555">The sandbox account holds the site's read grant and mounts the files; the guest only ever sees read-only files. The dataset is CPG's public validation dataset, under its real names.</text><!-- screen-ignore: public, non-sensitive CPG names, kept as the worked example -->
<rect x="20" y="70" width="160" height="44" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.4" filter="url(#sh)"/>
<text x="100" y="89" text-anchor="middle" font-weight="bold">Web tier</text>
<text x="100" y="105" text-anchor="middle" font-size="11" fill="#0f766e">themis-web</text>
<line x1="100" y1="114" x2="100" y2="560" stroke="#0d9488" stroke-opacity="0.35" stroke-dasharray="4 4"/>
<rect x="210" y="70" width="160" height="44" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.4" filter="url(#sh)"/>
<text x="290" y="89" text-anchor="middle" font-weight="bold">Sandbox guest</text>
<text x="290" y="105" text-anchor="middle" font-size="11" fill="#b45309">one launch per tool call</text>
<line x1="290" y1="114" x2="290" y2="560" stroke="#d97706" stroke-opacity="0.35" stroke-dasharray="4 4"/>
<rect x="410" y="70" width="160" height="44" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.4" filter="url(#sh)"/>
<text x="490" y="89" text-anchor="middle" font-weight="bold">Sandbox worker</text>
<text x="490" y="105" text-anchor="middle" font-size="11" fill="#0f766e">sandbox account</text>
<line x1="490" y1="114" x2="490" y2="560" stroke="#0d9488" stroke-opacity="0.35" stroke-dasharray="4 4"/>
<rect x="620" y="70" width="160" height="44" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.4" filter="url(#sh)"/>
<text x="700" y="89" text-anchor="middle" font-weight="bold">Auth service</text>
<text x="700" y="105" text-anchor="middle" font-size="11" fill="#0f766e">ACL</text>
<line x1="700" y1="114" x2="700" y2="560" stroke="#0d9488" stroke-opacity="0.35" stroke-dasharray="4 4"/>
<rect x="830" y="70" width="160" height="44" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.4" filter="url(#sh)"/>
<text x="910" y="89" text-anchor="middle" font-weight="bold">Metamist</text>
<text x="910" y="105" text-anchor="middle" font-size="11" fill="#6d28d9">project validation-test</text>
<line x1="910" y1="114" x2="910" y2="560" stroke="#7c3aed" stroke-opacity="0.35" stroke-dasharray="4 4"/>
<rect x="1030" y="70" width="160" height="44" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4" filter="url(#sh)"/>
<text x="1110" y="89" text-anchor="middle" font-weight="bold">GCS</text>
<text x="1110" y="105" text-anchor="middle" font-size="11" fill="#1d4ed8">cpg-validation-test</text>
<line x1="1110" y1="114" x2="1110" y2="560" stroke="#2563eb" stroke-opacity="0.35" stroke-dasharray="4 4"/>
<rect x="12" y="133" width="1216" height="25" rx="4" fill="#f1f5f9"/><rect x="12" y="133" width="5" height="25" rx="2" fill="#0d9488"/>
<text x="22" y="150" font-weight="bold">1. A curator starts a case analysis in Project validation</text>
<text x="108" y="178" font-size="11.5" fill="#555" font-style="italic">stores sha256(token) → validation, an_…; the agent session carries the token, never the curator</text>
<rect x="12" y="198" width="1216" height="25" rx="4" fill="#f1f5f9"/><rect x="12" y="198" width="5" height="25" rx="2" fill="#0d9488"/>
<text x="22" y="215" font-weight="bold">2. The agent asks for a sample through the hatch; the worker finds its files</text>
<line x1="290" y1="247" x2="486" y2="247" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
<text x="390.0" y="241" text-anchor="middle" fill="#334155" font-size="12">MountSampleFiles(sample) → the /data/&lt;sample&gt;/ paths</text>
<line x1="490" y1="279" x2="696" y2="279" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
<text x="595.0" y="273" text-anchor="middle" fill="#334155" font-size="12">ResolveSession(token)</text>
<line x1="700" y1="307" x2="494" y2="307" stroke="#475569" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a)"/>
<text x="595.0" y="301" text-anchor="middle" fill="#334155" font-size="12">Project validation (= dataset)</text>
<line x1="490" y1="339" x2="906" y2="339" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
<text x="700.0" y="333" text-anchor="middle" fill="#334155" font-size="12">sample → sequencing group → CRAM, VCF</text>
<line x1="910" y1="367" x2="494" y2="367" stroke="#475569" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a)"/>
<text x="700.0" y="361" text-anchor="middle" fill="#334155" font-size="12">gs://cpg-validation-test/…</text>
<text x="498" y="391" font-size="11.5" fill="#555" font-style="italic">every path must sit in the Project's bucket in the deployment's namespace (dev: test)</text>
<rect x="12" y="413" width="1216" height="25" rx="4" fill="#f1f5f9"/><rect x="12" y="413" width="5" height="25" rx="2" fill="#0d9488"/>
<text x="22" y="430" font-weight="bold">3. Every later tool call: the worker binds the files read-only into the guest it launches</text>
<text x="498" y="460" font-size="11.5" fill="#555" font-style="italic">mounts cpg-validation-test read-only, as the sandbox account; re-resolves its session before each launch</text>
<text x="498" y="478" font-size="11.5" fill="#555" font-style="italic">binds /data/&lt;sample&gt;/ read-only into each guest launch: the next tool call has the files</text>
<line x1="290" y1="512" x2="1106" y2="512" stroke="#d97706" stroke-width="1.6" marker-end="url(#g)"/>
<text x="700.0" y="506" text-anchor="middle" fill="#334155" font-size="12">samtools / pysam read /data/&lt;sample&gt;/… (range reads through the mount)</text>
<rect x="24" y="576" width="1192" height="86" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.4" filter="url(#sh)"/>
<text x="40" y="602" font-size="12.5" font-weight="bold" fill="#5b21b6">What the site grants</text>
<text x="40" y="623" font-size="12.5">The sandbox account reads one CPG namespace of each dataset in the ACL: dev test (cpg-&lt;ds&gt;-test, Metamist &lt;ds&gt;-test), prod main.</text>
<text x="40" y="644" font-size="12.5">The allowlist keeps dev to open datasets, since a test namespace can hold a real participant subset.</text>
<g font-size="11.5" fill="#4b5563"><text x="24" y="680" font-style="italic">Colour shows who runs each part:</text><rect x="214" y="669" width="14" height="14" rx="3" fill="#f0fdfa" stroke="#0d9488"/><text x="234" y="680">Themis</text><rect x="290" y="669" width="14" height="14" rx="3" fill="#fffbeb" stroke="#d97706"/><text x="310" y="680">the guest (untrusted code)</text><rect x="470" y="669" width="14" height="14" rx="3" fill="#f5f3ff" stroke="#7c3aed"/><text x="490" y="680">CPG</text><rect x="532" y="669" width="14" height="14" rx="3" fill="#eff6ff" stroke="#2563eb"/><text x="552" y="680">Google Cloud</text></g>
</svg>
