# --- Alignment references ------------------------------------------------------------------------
# CRAM is reference-compressed: decoding reads needs the exact assembly they were aligned against,
# byte-identical, so these are pinned by identity rather than chosen for their naming.

# The benchmark's CRAMs are called against DRAGEN's `hg38_alt_masked_graph_v6` default, so this is
# the assembly its reads decode against and the one the annotated VCF's coordinates are in. Illumina
# ships it as a gzipped tar of a single `hg38.fa` (3.26 GB uncompressed, `>chr1 AC:CM000663.2 …`),
# alongside an `info.json` naming the package build and an `md5sum` carrying the FASTA's own digest
# — so the derived pass that extracts `genome.fa` has the publisher's checksum to verify against,
# inside the archive, even though the archive itself is published without one.
#
# The hash-table tarball that accompanies it is deliberately not here: it is needed to *run* the
# aligner on FPGA, not to decode what the aligner produced.

[[assembly]]
id = "dragen-hg38"
source = "dragen"
version = "hg38-fasta-0-1"
seqid = "ucsc-name"
licence = "illumina-dragen-resource"
consumer = "reads"
genome = { url = "https://webdata.illumina.com/downloads/software/dragen/resource-files/fasta-files/hg38-fasta-0-1.tar.gz", suffix = "tar.gz" }

# Broad's, kept because the literature lane and anything reading public GRCh38 coordinates use it,
# and because hg19 has no DRAGEN equivalent here. Both ship uncompressed with an index, so no
# derived one is needed. Already in GCS, so they copy server-side.

[[assembly]]
id = "broad-hg38"
source = "broad"
version = "hg38_v0"
seqid = "ucsc-name"
licence = "public-domain"
consumer = "reads"
genome = { url = "gs://gcp-public-data--broad-references/hg38/v0/Homo_sapiens_assembly38.fasta", suffix = "fa" }
index = { url = "gs://gcp-public-data--broad-references/hg38/v0/Homo_sapiens_assembly38.fasta.fai", extension = "fai" }

[[assembly]]
id = "broad-hg19"
source = "broad"
version = "hg19_v0"
seqid = "grc-name"
licence = "public-domain"
consumer = "reads"
genome = { url = "gs://gcp-public-data--broad-references/hg19/v0/Homo_sapiens_assembly19.fasta", suffix = "fa" }
index = { url = "gs://gcp-public-data--broad-references/hg19/v0/Homo_sapiens_assembly19.fasta.fai", extension = "fai" }

# --- Crosswalk tables ----------------------------------------------------------------------------
# Not tied to one assembly, so they stand alone.

[[table]]
id = "mane-summary"
source = "mane"
version = "1.5_GRCh38"
role = "summary"
suffix = "tsv.gz"
url = "https://ftp.ncbi.nlm.nih.gov/refseq/MANE/MANE_human/release_1.5/MANE.GRCh38.v1.5.summary.txt.gz"
licence = "public-domain"
# A label over the complete annotations, not a transcript set: which RefSeq transcript a gene's
# MANE Select is, the Ensembl transcript identical to it, and the HGNC id for both.
consumer = "crosswalk"

[[table]]
id = "hgnc-complete-set"
source = "hgnc"
version = "2026-07-07"
role = "complete-set"
suffix = "tsv"
url = "gs://public-download-files/hgnc/archive/archive/quarterly/tsv/hgnc_complete_set_2026-07-07.tsv"
licence = "cc0-1.0"
# The dated quarterly archive, not the rolling current file, so the version in the path means
# something. Symbol history and aliases: papers write withdrawn symbols (ASA for ARSA, SEPT9 for
# SEPTIN9), which is measurably why some variants resolve against no gene at all.
consumer = "crosswalk"
