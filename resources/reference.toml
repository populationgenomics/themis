# The upstream reference data Themis mirrors, pinned.
#
# Each object is mirrored byte-for-byte into the `reference/` dataset of the resources bucket at
# `<source>/<version>/<role>.<suffix>`. The destination is composed from those fields rather than
# written out, so every source lands in the same shape and a consumer reaches for `genome.fa.gz`
# whoever published it. Versioning the directory makes a bump additive: two releases coexist and
# nothing is renamed to make room for the newer one.
#
# An assembly owns its annotation, its sequence sets and its index rather than each standing alone,
# because a tool reads them together and disagreement between them is silent. `bcftools csq` against a genome
# that names sequences `chr1` and an annotation that names them `1` annotates nothing and exits
# zero; htslib given an index whose name does not extend its genome's reports the index as absent.
# Nesting removes both: `seqid` is declared once for the assembly, so an annotation has none of its
# own to contradict, and an index declares only the extension it adds, so its name is the genome's
# by construction. Nothing has to check what cannot be written.
#
# The transcript and protein sets are the publisher's records, not slices of the genome, and the
# two disagree: a RefSeq mRNA may carry a polyA tail the genome lacks, or the corrected sequence
# where the assembly is wrong, and Ensembl edits its cDNA to match. So the sequence a paper's
# accession names is only in these files, and a digest that identifies it has to be taken from them.
# Where record and genome differ by an indel, the placement of the difference is not unique; NCBI's
# transcript alignments are the published placement, the one ClinVar's names follow, so they are
# mirrored rather than recomputed. The annotation carries an alignment only for a minority of the
# affected transcripts and never the substitutions. NCBI publishes the curated (NM_/NR_) and model
# (XM_/XR_) alignments as separate BAMs; GRCh37 has only the curated one.
#
# Nothing here is transformed. A derived artifact — a bgzip recompression, an index we build, a
# subset — is a later pass writing its own prefix and citing the id it came from. Renaming a
# sequence to make two sources agree would break equivalence with the publisher permanently, so a
# consumer that needs another naming convention takes the assembly that has it. Where something
# genuinely must cross conventions, the NCBI assembly report is mirrored as the lookup: it maps
# Ensembl name to GenBank and RefSeq accession to UCSC-style name, with lengths to check them.
#
# `md5` is the publisher's own, where the publisher publishes one. NCBI does, in
# `md5checksums.txt`. Ensembl publishes `sum` output — a System V checksum, not MD5 — so its
# objects carry none, and the mirror records the digest it computed on first fetch instead. A
# `gs://` upstream carries none either: GCS supplies the checksum for a server-side copy.

dataset = "reference"

# --- NCBI RefSeq ---------------------------------------------------------------------------------
# Papers write RefSeq accessions — `NM_`, `NP_` — and essentially never Ensembl's, so the
# literature resolver needs this annotation specifically. GRCh37 is here because papers state
# build-37 coordinates, not because anything in the annotation pipeline wants it.

[[assembly]]
id = "ncbi-grch38"
source = "ncbi"
version = "GCF_000001405.40_GRCh38.p14"
seqid = "refseq-accession"
licence = "public-domain"
consumer = "variants.resolve"
genome = { url = "https://ftp.ncbi.nlm.nih.gov/genomes/all/GCF/000/001/405/GCF_000001405.40_GRCh38.p14/GCF_000001405.40_GRCh38.p14_genomic.fna.gz", suffix = "fa.gz", md5 = "c30471567037b2b2389d43c908c653e1" }
annotation = { url = "https://ftp.ncbi.nlm.nih.gov/genomes/all/GCF/000/001/405/GCF_000001405.40_GRCh38.p14/GCF_000001405.40_GRCh38.p14_genomic.gff.gz", suffix = "gff3.gz", md5 = "24b731562b9d4cae9e37b23404b5be16" }
transcripts = { url = "https://ftp.ncbi.nlm.nih.gov/genomes/all/GCF/000/001/405/GCF_000001405.40_GRCh38.p14/GCF_000001405.40_GRCh38.p14_rna.fna.gz", suffix = "fa.gz", md5 = "b4a2ce202c90c0f24f22850c6bc7d774" }
proteins = { url = "https://ftp.ncbi.nlm.nih.gov/genomes/all/GCF/000/001/405/GCF_000001405.40_GRCh38.p14/GCF_000001405.40_GRCh38.p14_protein.faa.gz", suffix = "fa.gz", md5 = "25a880236608ad046d7f9b65e895eb4b" }
alignments = { url = "https://ftp.ncbi.nlm.nih.gov/genomes/all/GCF/000/001/405/GCF_000001405.40_GRCh38.p14/RefSeq_transcripts_alignments/GCF_000001405.40_GRCh38.p14_knownrefseq_alns.bam", suffix = "bam", md5 = "42eccd19b4ce9d0b6c1808591e9223b7", index = { url = "https://ftp.ncbi.nlm.nih.gov/genomes/all/GCF/000/001/405/GCF_000001405.40_GRCh38.p14/RefSeq_transcripts_alignments/GCF_000001405.40_GRCh38.p14_knownrefseq_alns.bam.bai", extension = "bai", md5 = "e933345d2cce119dbefa158f5902b7dc" } }
model-alignments = { url = "https://ftp.ncbi.nlm.nih.gov/genomes/all/GCF/000/001/405/GCF_000001405.40_GRCh38.p14/RefSeq_transcripts_alignments/GCF_000001405.40_GRCh38.p14_modelrefseq_alns.bam", suffix = "bam", md5 = "c12dff0b42457ee125af155fedc257a0", index = { url = "https://ftp.ncbi.nlm.nih.gov/genomes/all/GCF/000/001/405/GCF_000001405.40_GRCh38.p14/RefSeq_transcripts_alignments/GCF_000001405.40_GRCh38.p14_modelrefseq_alns.bam.bai", extension = "bai", md5 = "93df11dc2c94b81ccec1e6150d24c5ea" } }
report = { url = "https://ftp.ncbi.nlm.nih.gov/genomes/all/GCF/000/001/405/GCF_000001405.40_GRCh38.p14/GCF_000001405.40_GRCh38.p14_assembly_report.txt", suffix = "tsv", md5 = "21f3ac4aa8245a99eb874082051b9dde" }

