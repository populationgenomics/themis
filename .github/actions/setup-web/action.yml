name: setup-web
description: Install Bun and apps/web's dependencies from the committed lockfile.
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        # At least 1.4.1: 1.3.14's streaming extractor intermittently fails on tarballs over 2 MB
        # (oven-sh/bun#34861), and only 1.4.1 retries a download cut short mid-body (oven-sh/bun#40063).
        # Keep in step with apps/web/Dockerfile's base image and apps/web's @types/bun.
        bun-version: "1.4.2"
    # --frozen-lockfile fails if package.json and bun.lock have drifted.
    - run: bun install --frozen-lockfile
      shell: bash
      working-directory: apps/web
