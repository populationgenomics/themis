name: web

# Production build and test suite of the Next.js web app on PRs and pushes to main. The image
# build + deploy is owned by deploy.yml; images.yml build-checks it on merge. Bun toolchain; see
# apps/web/README.md.
on:
  pull_request:
    types: [opened, ready_for_review, synchronize]
  push:
    branches: [main]

jobs:
  web:
    # Skip on the public mirror (themis), and skip draft PRs.
    if: |
      github.repository == 'populationgenomics/themis-internal'
      && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      # --frozen-lockfile fails if package.json and bun.lock have drifted.
      - run: bun install --frozen-lockfile
      - run: bun run build
      # The transcription checks that need no capture. The verbatim ones read the calculator page and
      # the two supplements, which are not committed, and skip here (see `workflows/fidelity.test.ts`).
      - run: bun test
      # Both are generated and committed, and a Python test joins each to the library: the cell
      # inventory to what the framework prices, the DAFT tables to the library's own reading of SM3.
      # A stale export checks the wrong thing against the right library.
      - run: bun run cells && git diff --exit-code -- curation-cells.json
      - run: bun run daft && git diff --exit-code -- daft-tables.json
