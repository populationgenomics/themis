name: preview

# Read-only `pulumi preview` of each stack on PRs, each posted as a comment to inform PR review
# before merge; for prod it is the plan the merge will apply. Authenticates as each project's
# preview SA via WIF, whose binding admits this workflow file; write access needs a deployable
# ref (deploy.yml). PRs never deploy. See docs/design/deployment.md, "Previews against both stacks".
on:
  pull_request:
    types: [opened, ready_for_review, synchronize, reopened]

concurrency:
  group: themis-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    # Skip on the public mirror (themis), and skip draft PRs.
    if: |
      github.repository == 'populationgenomics/themis-internal'
      && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - stack: dev
            project: cpg-themis-dev
            project_number: '698160839187'
          - stack: prod
            project: cpg-themis-prod
            project_number: '186726836905'
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
      - run: uv sync --locked --group infra --python 3.13
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ matrix.project }}
          workload_identity_provider: projects/${{ matrix.project_number }}/locations/global/workloadIdentityPools/github/providers/github
          service_account: themis-preview@${{ matrix.project }}.iam.gserviceaccount.com
      # Images are pinned in-program: each Cloud Run image falls back to the live
      # deployment when its THEMIS_*_IMAGE override is unset (infra/__main__.py).
      - uses: pulumi/actions@v7
        with:
          command: preview
          stack-name: ${{ matrix.stack }}
          work-dir: infra
          cloud-url: gs://${{ matrix.project }}-pulumi-state
          comment-on-pr: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
