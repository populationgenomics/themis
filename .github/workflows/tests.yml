name: tests

on:
  pull_request:
    types: [opened, ready_for_review, synchronize]
  push:
    branches: [main]

jobs:
  pytest:
    # Skip on the public mirror (themis), and skip draft PRs.
    if: |
      github.repository == 'populationgenomics/themis-internal'
      && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      # The schema tests compile the proto module to a descriptor set; without buf they skip,
      # which reads as a pass. Pinned to the version schema-freshness.yml resolves against.
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: "1.66.1"
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
      - run: uv sync --locked --group test --python 3.13
      # No path arg: collect the testpaths configured in pyproject.toml. `-m 'not sandbox'` leaves the
      # bwrap-backed tests to pytest-sandbox, so no apt install stands between a push and this suite.
      - run: uv run pytest -m 'not sandbox'

  pytest-sandbox:
    # Skip on the public mirror (themis), and skip draft PRs.
    if: |
      github.repository == 'populationgenomics/themis-internal'
      && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
      # ubuntu-latest (24.04) restricts unprivileged user namespaces via AppArmor — lift it so bwrap
      # can launch (Cloud Run gen2, the deploy target, has no such restriction); the key is absent on
      # kernels without that patch, hence `|| true`. The timeout bounds an apt hang to this job, in
      # minutes rather than the six-hour default.
      # The runner image ships populated apt lists, so the install alone resolves; `update` is the
      # step that reaches the network, and its default mirror (azure.archive.ubuntu.com) is retried
      # for minutes when it is down. Refreshing only after a miss keeps that off the happy path.
      - timeout-minutes: 6
        run: |
          sudo apt-get install -y bubblewrap \
            || { sudo apt-get update && sudo apt-get install -y bubblewrap; }
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      # The guest world is stdlib-only (the hatch runs in the test process), so it needs nothing installed.
      - run: uv sync --locked --group test --python 3.13
      # `CI` is set, so the bubblewrap fixture errors rather than skips if the step above left no bwrap
      # on PATH; a selection that matches nothing exits 5. Either way this job goes red.
      - run: uv run pytest -m sandbox
