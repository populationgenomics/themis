name: tests

on:
  pull_request:
    types: [opened, ready_for_review, synchronize]
  push:
    branches: [main]

jobs:
  pytest:
    # Skip on the public mirror (themis), and skip draft PRs.
    if: |
      github.repository == 'populationgenomics/themis-internal'
      && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      # The schema tests compile the proto module to a descriptor set; without buf they skip,
      # which reads as a pass. Pinned to the version schema-freshness.yml resolves against.
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: "1.66.1"
          # No default token: the release lookup that resolves the download URL would go out
          # anonymous, against a per-IP rate limit shared across the hosted runner pool.
          github_token: ${{ github.token }}
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
      - run: uv sync --locked --group test --python 3.13
      # No path arg: collect the testpaths configured in pyproject.toml. `-m 'not sandbox'` leaves the
      # bwrap-backed tests to pytest-sandbox, so no apt install stands between a push and this suite.
      - run: uv run pytest -m 'not sandbox'

  pytest-sandbox:
    # Skip on the public mirror (themis), and skip draft PRs.
    if: |
      github.repository == 'populationgenomics/themis-internal'
      && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
      # `update` is the call that reaches the network; the runner image ships lists the install
      # resolves against, so it runs only after a miss. The AppArmor key gates unprivileged user
      # namespaces and is absent on kernels without that patch, hence `|| true`.
      - timeout-minutes: 6
        run: |
          sudo apt-get install -y bubblewrap \
            || { sudo apt-get update && sudo apt-get install -y bubblewrap; }
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - run: uv sync --locked --group test --python 3.13
      # `-m sandbox` is the complement of the `pytest` job's expression: a test outside both is
      # collected by neither and reports green. `CI` is set, so the bubblewrap fixture errors rather
      # than skips when the step above left no bwrap on PATH.
      - run: uv run pytest -m sandbox
