name: deploy
# tools/bring_up.py finds the run it dispatched by this title. The environment expression is the
# `environment` job's below, and the concurrency group's: the three must agree.
run-name: deploy ${{ inputs.environment || (github.ref == 'refs/heads/main' && 'prod' || 'dev') }}${{ inputs.images_only && ' (images only)' || '' }}

# Deploys an environment: check the migration ledger against this tree, build the service images,
# push to the environment's Artifact Registry, then `pulumi up`, apply migrations, and apply the agent's
# declaration on the Anthropic side (docs/design/deployment.md, "Deploy triggers").
# - dev: push `deployed/dev`, or dispatch on `main`; merging to `main` is neither.
# - prod: every push to `main` (a merge), or a dispatch on `main` to redeploy, and only once lint,
#   tests, web and both schema checks pass on the commit it deploys (`main`'s required checks are not
#   strict, so two green PRs can merge into a red `main`). With `images_only` a dispatched run builds
#   and pushes the images and stops, the registry-first step of a first bring-up (tools/bring_up.py);
#   it is gated too, since the bring-up puts those images live.
#   The check jobs hold no `id-token` permission: this workflow's `workflow_ref` would admit them.
# Authenticates as the environment's deploy SA via WIF, whose binding admits this workflow read from the
# refs the environment deploys from; a GitHub ruleset over `deployed/*` bypasses only for the
# repository-admin role, which is what limits who can deploy unreviewed code to dev. PRs never reach
# this — they get a read-only preview (preview.yml).
on:
  push:
    branches: ['deployed/dev', 'main']
  workflow_dispatch:
    inputs:
      environment:
        description: The environment to deploy
        type: choice
        options: [dev, prod]
        default: dev
      images_only:
        description: Build and push the images, then stop (a first bring-up's registry-first step)
        type: boolean
        default: false

concurrency:
  group: themis-deploy-${{ inputs.environment || (github.ref == 'refs/heads/main' && 'prod' || 'dev') }}
  cancel-in-progress: false

jobs:
  # The run's environment: the dispatch's choice, else the pushed branch's (`main` deploys prod,
  # `deployed/dev` dev), and its project. Never on the public mirror (themis); the deploy SA's WIF is
  # scoped to themis-internal regardless, but this keeps the gate intrinsic to the workflow.
  environment:
    if: github.repository == 'populationgenomics/themis-internal'
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      name: ${{ steps.pick.outputs.name }}
      project: ${{ steps.pick.outputs.project }}
      project_number: ${{ steps.pick.outputs.project_number }}
    steps:
      # The dispatch UI offers every ref, but each deploy SA's WIF binding admits this workflow from
      # only the refs its environment deploys from: refuse here, before the checks, so a wrong pick
      # fails legibly instead of as an impersonation error in the deploy.
      - id: pick
        env:
          NAME: ${{ inputs.environment || (github.ref == 'refs/heads/main' && 'prod' || 'dev') }}
        run: |
          case "${NAME}" in
            dev) PROJECT=cpg-themis-dev; PROJECT_NUMBER=698160839187; REFS='refs/heads/main refs/heads/deployed/dev' ;;
            prod) PROJECT=cpg-themis-prod; PROJECT_NUMBER=186726836905; REFS='refs/heads/main' ;;
            *) echo "::error::no environment ${NAME}"; exit 1 ;;
          esac
          if [[ " ${REFS} " != *" ${GITHUB_REF} "* ]]; then
            echo "::error::deploy to ${NAME} runs only on ${REFS}; got ${GITHUB_REF}"
            exit 1
          fi
          {
            echo "name=${NAME}"
            echo "project=${PROJECT}"
            echo "project_number=${PROJECT_NUMBER}"
          } >> "$GITHUB_OUTPUT"

  lint:
    needs: environment
    if: needs.environment.outputs.name == 'prod'
    uses: ./.github/workflows/lint.yml
    permissions:
      contents: read
  tests:
    needs: environment
    if: needs.environment.outputs.name == 'prod'
    uses: ./.github/workflows/tests.yml
    permissions:
      contents: read
  web:
    needs: environment
    if: needs.environment.outputs.name == 'prod'
    uses: ./.github/workflows/web.yml
    permissions:
      contents: read
  schema-compat:
    needs: environment
    if: needs.environment.outputs.name == 'prod'
    uses: ./.github/workflows/schema-compat.yml
    permissions:
      contents: read
  schema-freshness:
    needs: environment
    if: needs.environment.outputs.name == 'prod'
    uses: ./.github/workflows/schema-freshness.yml
    permissions:
      contents: read

  deploy:
    needs: [environment, lint, tests, web, schema-compat, schema-freshness]
    # The `environment` job refuses the public mirror and a ref its environment does not deploy from.
    # The checks run only for prod; dev's are skipped, which must not skip the deploy.
    if: |
      !cancelled()
      && github.repository == 'populationgenomics/themis-internal'
      && needs.environment.result == 'success'
      && (needs.environment.outputs.name != 'prod' || (
        needs.lint.result == 'success' && needs.tests.result == 'success' && needs.web.result == 'success'
        && needs.schema-compat.result == 'success' && needs.schema-freshness.result == 'success'))
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      ENVIRONMENT: ${{ needs.environment.outputs.name }}
      PROJECT: ${{ needs.environment.outputs.project }}
      PROJECT_NUMBER: ${{ needs.environment.outputs.project_number }}
      IMAGES_ONLY: ${{ inputs.images_only || false }}
    steps:
      - name: Resolve the environment
        run: |
          {
            echo "WIF_PROVIDER=projects/${PROJECT_NUMBER}/locations/global/workloadIdentityPools/github/providers/github"
            echo "DEPLOY_SA=themis-deploy@${PROJECT}.iam.gserviceaccount.com"
            echo "IMAGE_PREFIX=australia-southeast1-docker.pkg.dev/${PROJECT}/themis"
            echo "PULUMI_BACKEND_URL=gs://${PROJECT}-pulumi-state"
            echo "PULUMI_STACK_NAME=${ENVIRONMENT}"
          } >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
      - run: uv sync --locked --group infra --python 3.13
      - id: gcp
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v3
      # Installs the CLI only (no command), for the ledger preflight below.
      - uses: pulumi/actions@v7
      # Stop a ledger mismatch before `pulumi up` puts new revisions live, reading the
      # connection settings from the stack's previous outputs. A stack with no outputs has
      # never been deployed, so it has no database to check yet. Read-only; the migrate
      # step's own check, under its advisory lock, stays authoritative. So only a finding
      # (exit 1) stops the deploy; a ledger the check could not read (exit 3) is a warning,
      # since the deploy may be the one that repairs the login.
      - name: Check the migration ledger against the tree
        if: env.IMAGES_ONLY != 'true'
        run: |
          OUTPUTS="$(pulumi stack output --stack "${PULUMI_STACK_NAME}" --json --cwd infra)"
          if [[ "$(jq 'length' <<< "${OUTPUTS}")" == 0 ]]; then
            echo "::notice::stack ${PULUMI_STACK_NAME} has no outputs, so it has never been deployed; skipping the ledger preflight"
            exit 0
          fi
          output() {
            jq -er --arg name "$1" --arg stack "${PULUMI_STACK_NAME}" \
              '.[$name] // error("stack \($stack) has no output \($name)")' <<< "${OUTPUTS}"
          }
          THEMIS_SQL_CONNECTION_NAME="$(output sql_connection_name)"
          THEMIS_SQL_DATABASE="$(output sql_database)"
          THEMIS_DB_USER="$(output migrator_db_user)"
          export THEMIS_SQL_CONNECTION_NAME THEMIS_SQL_DATABASE THEMIS_DB_USER
          ERRORS="$(mktemp)"
          STATUS=0
          uv run --locked --group migrate python -m themis.migrate --check 2> "${ERRORS}" || STATUS=$?
          cat "${ERRORS}" >&2
          if [[ "${STATUS}" == 3 ]]; then
            echo "::warning::the ledger preflight could not read the ledger, so it did not check it; the migrate step after pulumi up checks it again: $(tail -n 1 "${ERRORS}")"
            exit 0
          fi
          exit "${STATUS}"
      - name: Build and push the service images
        run: |
          gcloud auth configure-docker australia-southeast1-docker.pkg.dev --quiet
          IMAGES="$(jq -r '.[] | [.name, .context, .file, .env] | @tsv' .github/images.json)"
          if [[ -z "${IMAGES}" ]]; then
            echo "::error::.github/images.json declares no images"
            exit 1
          fi
          while IFS=$'\t' read -r name context file env; do
            echo "::group::$name"
            IMAGE="${IMAGE_PREFIX}/${name}:${GITHUB_SHA}"
            docker build -f "$file" -t "$IMAGE" "$context"
            docker push "$IMAGE"
            echo "${env}=${IMAGE}" >> "$GITHUB_ENV"
            echo "::endgroup::"
          done <<< "${IMAGES}"
      - uses: pulumi/actions@v7
        id: pulumi
        if: env.IMAGES_ONLY != 'true'
        with:
          command: up
          stack-name: ${{ env.PULUMI_STACK_NAME }}
          work-dir: infra
          cloud-url: ${{ env.PULUMI_BACKEND_URL }}
      # Apply pending DB migrations as the deploy SA (the schema-owning migrator),
      # after the stack has attached the auth SA as a DB user (the SELECT grant's
      # target). Connects through the connector with the job's WIF credentials.
      - name: Apply database migrations
        if: env.IMAGES_ONLY != 'true'
        env:
          THEMIS_SQL_CONNECTION_NAME: ${{ steps.pulumi.outputs.sql_connection_name }}
          THEMIS_SQL_DATABASE: ${{ steps.pulumi.outputs.sql_database }}
          THEMIS_DB_USER: ${{ steps.pulumi.outputs.migrator_db_user }}
          THEMIS_MIGRATE_SUBSTITUTIONS: '{"AUTH_DB_USER": "${{ steps.pulumi.outputs.auth_db_user }}", "WEB_DB_USER": "${{ steps.pulumi.outputs.web_db_user }}", "INGEST_DB_USER": "${{ steps.pulumi.outputs.ingest_db_user }}", "EVIDENCE_DB_USER": "${{ steps.pulumi.outputs.evidence_db_user }}"}'
        run: uv run --locked --group migrate python -m themis.migrate
      # The agent is a control-plane resource on the Anthropic side, declared in
      # agents/svcv4-classifier.agent.yaml and applied whole after the stack: the skill it carries
      # names what the guest image and the services serve. The deploy SA's identity carries over —
      # an ID token minted for it here is exchanged under the federation rule that pins the account
      # (docs/runbooks/claude-api-wif.md, the deploy workflow) — so the same ref binding gates the
      # stack and the agent.
      - uses: google-github-actions/auth@v3
        id: anthropic_identity
        if: env.IMAGES_ONLY != 'true'
        with:
          project_id: ${{ env.PROJECT }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}
          token_format: id_token
          id_token_audience: https://api.anthropic.com
          id_token_include_email: true
          create_credentials_file: false
      - name: Apply the agent declaration
        if: env.IMAGES_ONLY != 'true'
        env:
          ANTHROPIC_IDENTITY_TOKEN: ${{ steps.anthropic_identity.outputs.id_token }}
          ANTHROPIC_FEDERATION_RULE_ID: ${{ steps.pulumi.outputs.anthropic_deploy_federation_rule_id }}
          ANTHROPIC_ORGANIZATION_ID: ${{ steps.pulumi.outputs.anthropic_organization_id }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ steps.pulumi.outputs.anthropic_deploy_service_account_id }}
          ANTHROPIC_WORKSPACE_ID: ${{ steps.pulumi.outputs.anthropic_workspace_id }}
          THEMIS_ANTHROPIC_AGENT_ID: ${{ steps.pulumi.outputs.anthropic_agent_id }}
          # An object output; the action writes it as JSON.
          THEMIS_AGENT_SKILL_IDS: ${{ steps.pulumi.outputs.anthropic_skill_ids }}
          # A secret output; the action masks it in the log.
          THEMIS_AGENT_MODEL_ID: ${{ steps.pulumi.outputs.anthropic_agent_model_id }}
        run: |-
          uv run --locked --group agents python -m tools.agents apply \
            agents/svcv4-classifier.agent.yaml --agent-id "$THEMIS_ANTHROPIC_AGENT_ID" \
            --skill-ids "$THEMIS_AGENT_SKILL_IDS"
      # Every run that signed in records how it ended, as the deploy account, on the series the deploy-failure
      # alert reads (infra/themis_infra/alerts.py): a failure or cancellation opens it, and a later successful
      # deploy closes it. An images-only run puts nothing live, so its success records nothing; a failure before
      # the sign-in shows in the run list only. Last, so a success is recorded only after every deploy step.
      - name: Record the outcome
        if: always() && steps.gcp.outcome == 'success' && (job.status != 'success' || env.IMAGES_ONLY != 'true')
        env:
          RESULT: ${{ job.status == 'success' && 'succeeded' || 'failed' }}
        run: |-
          uv run --locked --group telemetry python -m themis.telemetry.deploy_outcome \
            --region australia-southeast1 --run "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" --result "${RESULT}"
