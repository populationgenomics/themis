name: deploy

# Deploys to dev: build the service images, push to Artifact Registry, then `pulumi up`,
# apply migrations, and apply the agent's declaration on the Anthropic side. Two ways
# in — push `deployed/dev`, or dispatch on `main` — and merging to `main` is neither, so
# it deploys nothing (docs/design/deployment.md, "Deploy trigger"). Authenticates as
# the deploy SA via WIF, whose binding accepts exactly these two refs; a GitHub ruleset
# over `deployed/*` bypasses only for the repository-admin role, which is what limits
# who can deploy unreviewed code. PRs never reach this — they get a read-only preview
# (preview.yml).
on:
  push:
    branches: ['deployed/dev']
  workflow_dispatch:

concurrency:
  group: themis-deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    # Never run on the public mirror (themis); the deploy SA's WIF is scoped to
    # themis-internal regardless, but this keeps the gate intrinsic to the
    # workflow rather than relying on Actions being disabled on the mirror.
    if: github.repository == 'populationgenomics/themis-internal'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      IMAGE_PREFIX: australia-southeast1-docker.pkg.dev/cpg-themis-dev/themis
    steps:
      # The dispatch UI offers every ref, but the deploy SA's WIF binding accepts
      # only these two — refuse here so a wrong pick fails legibly instead of as
      # an impersonation error six steps in.
      - name: Refuse an undeployable ref
        if: github.ref != 'refs/heads/main' && github.ref != 'refs/heads/deployed/dev'
        run: |
          echo "::error::deploy runs only on main or deployed/dev; got ${GITHUB_REF}"
          exit 1
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
      - run: uv sync --locked --group infra --python 3.13
      - uses: google-github-actions/auth@v3
        with:
          project_id: cpg-themis-dev
          workload_identity_provider: projects/698160839187/locations/global/workloadIdentityPools/github/providers/github
          service_account: themis-deploy@cpg-themis-dev.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      - name: Build and push the service images
        run: |
          gcloud auth configure-docker australia-southeast1-docker.pkg.dev --quiet
          IMAGES="$(jq -r '.[] | [.name, .context, .file, .env] | @tsv' .github/images.json)"
          if [[ -z "${IMAGES}" ]]; then
            echo "::error::.github/images.json declares no images"
            exit 1
          fi
          while IFS=$'\t' read -r name context file env; do
            echo "::group::$name"
            IMAGE="${IMAGE_PREFIX}/${name}:${GITHUB_SHA}"
            docker build -f "$file" -t "$IMAGE" "$context"
            docker push "$IMAGE"
            echo "${env}=${IMAGE}" >> "$GITHUB_ENV"
            echo "::endgroup::"
          done <<< "${IMAGES}"
      - uses: pulumi/actions@v7
        id: pulumi
        with:
          command: up
          stack-name: dev
          work-dir: infra
          cloud-url: gs://cpg-themis-dev-pulumi-state
      # Apply pending DB migrations as the deploy SA (the schema-owning migrator),
      # after the stack has attached the auth SA as a DB user (the SELECT grant's
      # target). Connects through the connector with the job's WIF credentials.
      - name: Apply database migrations
        env:
          THEMIS_SQL_CONNECTION_NAME: ${{ steps.pulumi.outputs.sql_connection_name }}
          THEMIS_SQL_DATABASE: ${{ steps.pulumi.outputs.sql_database }}
          THEMIS_DB_USER: ${{ steps.pulumi.outputs.migrator_db_user }}
          THEMIS_MIGRATE_SUBSTITUTIONS: '{"AUTH_DB_USER": "${{ steps.pulumi.outputs.auth_db_user }}", "WEB_DB_USER": "${{ steps.pulumi.outputs.web_db_user }}", "INGEST_DB_USER": "${{ steps.pulumi.outputs.ingest_db_user }}", "EVIDENCE_DB_USER": "${{ steps.pulumi.outputs.evidence_db_user }}"}'
        run: uv run --locked --group migrate python -m themis.migrate
      # The agent is a control-plane resource on the Anthropic side, declared in
      # agents/svcv4-classifier.agent.yaml and applied whole after the stack: the skill it carries
      # names what the guest image and the services serve. The deploy SA's identity carries over —
      # an ID token minted for it here is exchanged under the federation rule that pins the account
      # (docs/runbooks/claude-api-wif.md, the deploy workflow) — so the same ref binding gates the
      # stack and the agent.
      - uses: google-github-actions/auth@v3
        id: anthropic_identity
        with:
          project_id: cpg-themis-dev
          workload_identity_provider: projects/698160839187/locations/global/workloadIdentityPools/github/providers/github
          service_account: themis-deploy@cpg-themis-dev.iam.gserviceaccount.com
          token_format: id_token
          id_token_audience: https://api.anthropic.com
          id_token_include_email: true
          create_credentials_file: false
      - name: Apply the agent declaration
        env:
          ANTHROPIC_IDENTITY_TOKEN: ${{ steps.anthropic_identity.outputs.id_token }}
          ANTHROPIC_FEDERATION_RULE_ID: ${{ steps.pulumi.outputs.anthropic_deploy_federation_rule_id }}
          ANTHROPIC_ORGANIZATION_ID: ${{ steps.pulumi.outputs.anthropic_organization_id }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ steps.pulumi.outputs.anthropic_deploy_service_account_id }}
          ANTHROPIC_WORKSPACE_ID: ${{ steps.pulumi.outputs.anthropic_workspace_id }}
          THEMIS_ANTHROPIC_AGENT_ID: ${{ steps.pulumi.outputs.anthropic_agent_id }}
          # A secret output; the action masks it in the log.
          THEMIS_AGENT_MODEL_ID: ${{ steps.pulumi.outputs.anthropic_agent_model_id }}
        run: |-
          uv run --locked --group agents python -m tools.agents apply \
            agents/svcv4-classifier.agent.yaml --agent-id "$THEMIS_ANTHROPIC_AGENT_ID"
