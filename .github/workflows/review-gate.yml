name: review gate

# Encodes the review requirement of docs/design/review-policy.md as a commit status.
on:
  # pull_request_target, not pull_request: the workflow runs from the default
  # branch, so a PR cannot edit the gate that judges it. No step checks out or
  # executes PR content.
  pull_request_target:
    types:
      - opened
      - reopened
      - ready_for_review
      - converted_to_draft
      - synchronize
      - review_requested
      - review_request_removed
  pull_request_review:
    types: [submitted, dismissed]

# Runs race: each queries live PR state, so a stale run finishing last would
# overwrite a fresher status on the same context.
concurrency:
  group: review-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  evaluate:
    # The job must not share a name with the posted context: a required check
    # matches check runs and statuses by name alike, and this job succeeds even
    # when the status it posts is a failure.
    name: evaluate
    if: github.repository == 'populationgenomics/themis-internal'
    runs-on: ubuntu-latest
    permissions:
      statuses: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Evaluate and post status
        run: |-
          set -euo pipefail

          pr="$(gh api graphql \
            -f owner="${GITHUB_REPOSITORY%/*}" -f name="${GITHUB_REPOSITORY#*/}" -F number="$PR_NUMBER" \
            -f query='
              query($owner: String!, $name: String!, $number: Int!) {
                repository(owner: $owner, name: $name) {
                  pullRequest(number: $number) {
                    isDraft
                    headRefOid
                    author { login }
                    timelineItems(last: 250, itemTypes: [REVIEW_REQUESTED_EVENT, REVIEW_REQUEST_REMOVED_EVENT]) {
                      pageInfo { hasPreviousPage }
                      nodes {
                        __typename
                        ... on ReviewRequestedEvent {
                          createdAt
                          requestedReviewer {
                            ... on User { login }
                            ... on Team { slug }
                            ... on Bot { login }
                            ... on Mannequin { login }
                          }
                        }
                        ... on ReviewRequestRemovedEvent {
                          createdAt
                          requestedReviewer {
                            ... on User { login }
                            ... on Team { slug }
                            ... on Bot { login }
                            ... on Mannequin { login }
                          }
                        }
                      }
                    }
                    latestOpinionatedReviews(last: 100) {
                      nodes { state submittedAt author { login } }
                    }
                  }
                }
              }' \
            -q '.data.repository.pullRequest')"

          head_sha="$(jq -r '.headRefOid' <<<"$pr")"
          is_draft="$(jq -r '.isDraft' <<<"$pr")"
          author="$(jq -r '.author.login' <<<"$pr")"
          # The reconstruction below is trusted only when the event window is
          # complete and every requested reviewer resolves to a login or slug;
          # fail rather than guess otherwise.
          guard="$(jq -r '
            if .timelineItems.pageInfo.hasPreviousPage
            then "request history exceeds the event window"
            elif [.timelineItems.nodes[] | select((.requestedReviewer | .login // .slug) == null)] != []
            then "a requested reviewer of unrecognised type"
            else "" end' <<<"$pr")"
          # GitHub consumes a review request when the reviewer submits *any*
          # review — a comment-only one included — with no timeline event;
          # only an explicit withdrawal emits REVIEW_REQUEST_REMOVED_EVENT. So
          # the live request set cannot carry the requirement; reconstruct it:
          # a reviewer is owed while their newest request has no later removal
          # and no later approval (ISO-8601 UTC, string order is time order;
          # a removal in the same second as the request does not clear it).
          owed="$(jq -r '
            [.timelineItems.nodes[]
             | {type: .__typename, at: .createdAt,
                who: (.requestedReviewer | .login // .slug)}] as $events
            | [.latestOpinionatedReviews.nodes[] | select(.state == "APPROVED")
               | {who: .author.login, at: .submittedAt}] as $approvals
            | $events | group_by(.who)
            | map({who: .[0].who,
                   requested: ([.[] | select(.type == "ReviewRequestedEvent") | .at] | max),
                   removed: ([.[] | select(.type == "ReviewRequestRemovedEvent") | .at] | max)})
            | map(select(.requested != null and (.removed == null or .removed <= .requested)))
            | map(select(.who as $who | .requested as $since
                         | ($approvals | map(select(.who == $who and .at > $since)) | length) == 0))
            | map(.who) | join(", ")' <<<"$pr")"
          # latestOpinionatedReviews: one review per reviewer, APPROVED or
          # CHANGES_REQUESTED only — a dismissed review drops out on its own.
          changes_requested_by="$(jq -r \
            '[.latestOpinionatedReviews.nodes[] | select(.state == "CHANGES_REQUESTED") | .author.login] | join(", ")' \
            <<<"$pr")"
          approved_by="$(jq -r \
            '[.latestOpinionatedReviews.nodes[] | select(.state == "APPROVED") | .author.login] | join(", ")' \
            <<<"$pr")"

          # Maintainers = direct admin collaborators; org owners inherit admin
          # but are not direct, so they don't self-merge through this gate.
          maintainers="$(gh api \
            "repos/${GITHUB_REPOSITORY}/collaborators?affiliation=direct&permission=admin" \
            --paginate -q '.[].login')"

          # An unfulfilled request outranks an existing approval: re-requesting
          # a review after one was given means "look again".
          if [[ "$is_draft" == 'true' ]]; then
            state='pending'
            description='draft — evaluated when the PR goes ready for review'
          elif [[ -n "$guard" ]]; then
            state='failure'
            description="cannot evaluate: ${guard}"
          elif [[ -n "$changes_requested_by" ]]; then
            state='failure'
            description="changes requested by ${changes_requested_by}"
          elif [[ -n "$owed" ]]; then
            state='failure'
            description="waiting on approval from requested reviewer: ${owed}"
          elif grep -Fxq "$author" <<<"$maintainers"; then
            state='success'
            description="maintainer-authored (${author}); no review owed"
          elif [[ -n "$approved_by" ]]; then
            state='success'
            description="approved by ${approved_by}"
          else
            state='failure'
            description="approval required: ${author} is not a maintainer"
          fi

          echo "review gate → ${state}: ${description}"
          # The statuses API rejects a description over 140 characters.
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${head_sha}" \
            -f state="$state" \
            -f context='review gate' \
            -f description="${description:0:140}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
