# buf module and gates for the hand-authored protos (proto.md). The .proto files under
# schema/proto/ are the source of truth; `tools/schema/regen.py` runs `buf generate` to
# emit the committed Python stubs, and apps/web emits protobuf-es from the same protos.
version: v2
modules:
  - path: schema/proto
deps:
  - buf.build/bufbuild/protovalidate
lint:
  # BASIC (structural) + the two enum-canonical rules (UPPER_SNAKE prefixed values, a
  # *_UNSPECIFIED zero member) + PROTOVALIDATE. The package/directory rules are excepted:
  # the internal RPC services co-locate distinct-package protos (themis.rpc.auth, .store,
  # .hello) in themis/rpc/ because each package names a distinct gRPC service wire path that
  # deployed clients bind — consolidating to one package, or splitting to one directory each,
  # would break those wire paths or churn every import. themis/workbench/models/ likewise
  # carries a package the compat gate now pins in place.
  use:
    - BASIC
    - ENUM_VALUE_PREFIX
    - ENUM_ZERO_VALUE_SUFFIX
    - PROTOVALIDATE
  except:
    - PACKAGE_DIRECTORY_MATCH
    - DIRECTORY_SAME_PACKAGE
breaking:
  # FILE minus FIELD_NO_DELETE: a field may be deleted only with both its number and its name
  # reserved. The two UNLESS_* rules are not in FILE, hence listed. See proto.md, "Schema evolution".
  use:
    - FILE
    - FIELD_NO_DELETE_UNLESS_NAME_RESERVED
    - FIELD_NO_DELETE_UNLESS_NUMBER_RESERVED
  except:
    - FIELD_NO_DELETE
