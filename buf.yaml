# buf module and gates for the hand-authored protos (proto.md). The .proto files under
# schema/proto/ are the source of truth; `tools/schema/regen.py` runs `buf generate` to
# emit the committed Python stubs, and apps/web emits protobuf-es from the same protos.
version: v2
modules:
  - path: schema/proto
deps:
  - buf.build/bufbuild/protovalidate
lint:
  # BASIC (structural) + the two enum-canonical rules (UPPER_SNAKE prefixed values, a
  # *_UNSPECIFIED zero member) + PROTOVALIDATE. The package/directory rules are excepted:
  # the internal RPC services co-locate distinct-package protos (themis.rpc.auth, .store,
  # .hello) in themis/rpc/ because each package names a distinct gRPC service wire path that
  # deployed clients bind — consolidating to one package, or splitting to one directory each,
  # would break those wire paths or churn every import. themis/workbench/models/ likewise
  # carries a package the compat gate now pins in place. The copied upstream schema (clinvar_proto/)
  # is neither ours to rename nor free to move: its package is the upstream's, and its directory is
  # the path the publishing wheel registers its descriptor under.
  use:
    - BASIC
    - ENUM_VALUE_PREFIX
    - ENUM_ZERO_VALUE_SUFFIX
    - PROTOVALIDATE
  except:
    - PACKAGE_DIRECTORY_MATCH
    - DIRECTORY_SAME_PACKAGE
breaking:
  # FILE minus FIELD_NO_DELETE: a field may be deleted only with both its number and its name
  # reserved. The two UNLESS_* rules are not in FILE, hence listed. See proto.md, "Schema evolution".
  # RPC_NO_DELETE and MESSAGE_NO_DELETE gate on nothing: proto has no `reserved` for either name, so
  # they refuse every deletion rather than the unsafe ones. proto.md, "Retiring an RPC or a message",
  # names what carries the rpc side instead. Both are ignored under the service trees, where a
  # message is an rpc's request or reply and dies with it. The models trees keep MESSAGE_NO_DELETE:
  # litcache is at-rest, and themis/workbench/models holds AnalysisInputs, which `analyses.inputs`
  # stores as bytes — a message deleted there is one no reader can parse back.
  # RPC_SAME_IDEMPOTENCY_LEVEL is ignored for the browser service alone: its only consumer is the
  # BFF's own generated client, shipped in the same deploy, so a level change reaches no caller that
  # predates it. The gRPC contracts keep the rule, where a level carries retry semantics a deployed
  # client reads.
  use:
    - FILE
    - FIELD_NO_DELETE_UNLESS_NAME_RESERVED
    - FIELD_NO_DELETE_UNLESS_NUMBER_RESERVED
  except:
    - FIELD_NO_DELETE
  ignore_only:
    RPC_SAME_IDEMPOTENCY_LEVEL:
      - schema/proto/themis/workbench/rpc/workbench.proto
    RPC_NO_DELETE:
      - schema/proto/themis/rpc
      - schema/proto/themis/workbench/rpc
    MESSAGE_NO_DELETE:
      - schema/proto/themis/rpc
      - schema/proto/themis/workbench/rpc
