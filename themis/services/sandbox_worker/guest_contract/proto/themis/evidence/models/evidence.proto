// Where a fact came from, so every claim is reproducible without a mirror (PRODUCT §6). For a live
// query, `retrieved_at` stamps the as-of time; for a reference table, `dataset_versions` carries its
// refresh date.
message Provenance {
  string source = 1;           // e.g. "gnomAD GraphQL", "Ensembl VEP REST", "ClinGen dosage"
  // One element per release the fact rests on — never a subset. A transcript-annotation release
  // ("VEP 116", "GRCh38") and an expression one ("gtex_v10", "GENCODE v39") name different
  // transcript sets, so a caller comparing facts across two of these rpcs is comparing across
  // annotation releases; unstated, a version disagreement reads as a disagreement about the gene.
  repeated string dataset_versions = 2;
  // the exact request issued (URL / GraphQL / id), for replay; credentials (an API key, a token)
  // are stripped — this field is returned to callers and read by the model
  string query = 3;
  google.protobuf.Timestamp retrieved_at = 4;
}

// A genomic interval, ascending on both strands (1-based, both ends inclusive).
message GenomicSpan {
  int64 start = 1;
  int64 end = 2;
}
