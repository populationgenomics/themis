package themis.rpc.gnomad;

import "google/protobuf/struct.proto";
import "themis/evidence/models/evidence.proto";

// Doc maps fields to codes:
//   joint.faf95.popmax -> the POP_FRQ input: the JOINT (exome + genome) Grpmax FAF, which ClinGen's
//                         VCEP Review Committee gnomAD guidance (v3.0, 23 June 2025) names as the
//                         frequency BA1/BS1 are applied on. Read per dataset instead and a variant
//                         called only in genomes scores an exome FAF of 0, which reads as absence.
//   exome.filters / genome.filters -> the variant-QC gate that FAF has to pass, and it is per
//                         dataset: gnomAD computes the joint FAF over calls that FAILED QC (only
//                         chrM, AS_lowqual and AC_raw==0 are dropped), and `joint.filters` here is
//                         an alias for the joint FLAGS (discrepant_frequencies and the like), which
//                         structurally never carry AS_VQSR — gating on it admits everything. A FAF
//                         resting on a filter-failing dataset counts against the variant's rarity,
//                         never toward its benignity; themis.svcv4.frequency holds that asymmetry.
//   homozygote_count / hemizygote_count -> POP_HMZ (from the 2nd eligible observation)
//   variant_cooccurrence (dataset gnomad_r2_1 ONLY) -> biallelic in-trans/cis assessment
//   pext / gnomad_constraint (LOEUF) / regional_missense_constraint -> Transcript.AssessExonRelevance signals
//   short_tandem_repeat -> the in-frame-indel repeat branch
// Rate limit ~10 req/IP/min and the schema is "subject to change" — fine at single-variant scale.
message DescribeVariantRequest {
  // From NormalizeResponse, as chrom-pos-ref-alt; its build must match `dataset`. Held to that shape
  // here because gnomAD answers an id it cannot parse with the SAME 200-and-null-variant it answers
  // "not held" with — so an unchecked typo would come back NOT_FOUND, which for this rpc is the
  // POP_FRQ rarity finding rather than an error. An id gnomAD itself rejects is INVALID_ARGUMENT.
  // A large indel spells a long id and that is not a malformed one: the shape check carries no
  // sequence-length limit, and the only bound is the transport one `Splice` states. But the SIZE of
  // such an allele bears on how its absence reads. These datasets are gnomAD's SHORT-VARIANT
  // callsets, and "Variant not found" is the same answer for an allele they surveyed and did not see
  // as for one they could never have called — a kilobase deletion is in gnomAD's structural-variant
  // release, which this rpc does not serve. NOT_FOUND is the POP_FRQ rarity finding only for an
  // allele the callset could have held; for a large indel it is a statement about the callset, and
  // scoring rarity off it asserts a frequency nothing measured.
  string gnomad_id = 1;
  string dataset = 2;           // "gnomad_r4" (GRCh38) | "gnomad_r2_1" (GRCh37, co-occurrence); any
                                // other value is INVALID_ARGUMENT (gnomAD answers one with a 500)
  string cooccurrence_with = 3; // optional 2nd variant id for biallelic assessment; same shape
}
// gnomAD's answer for the requested id — untyped, since every field a caller reads lives in raw.
message DescribeVariantResponse {
  // `variant` — exome/genome {ac,an,af,filters,flags,faf95,populations} plus the exome age
  // distribution, and joint {ac,an,filters,faf95,populations} — with `variant_cooccurrence` when the
  // request asked for one. Gene-level signals
  // (pext, LOEUF, regional missense constraint) are Transcript.AssessExonRelevance's; this rpc does not
  // query them.
  google.protobuf.Struct raw = 15;
  repeated themis.evidence.models.Provenance provenance = 16;
}

service Gnomad {
  // gnomAD: joint faf95 + the per-dataset filters -> POP_FRQ, homozygote_count and
  // hemizygote_count -> POP_HMZ, co-occurrence, pext/LOEUF/constraint ->
  // Transcript.AssessExonRelevance, STR.
  // See DescribeVariantResponse.
  rpc DescribeVariant(DescribeVariantRequest) returns (DescribeVariantResponse);
}
