syntax = "proto3";
import "google/protobuf/timestamp.proto";
package clinvar;
// Aggregate germline review status across every submission on the record. The gold-star count is derived from this value; it is NOT this enum's ordinal. 0 stars: 'no classification provided', 'no assertion criteria provided', 'no classifications from unflagged records', 'no classification for the single variant'; 1 star: 'criteria provided, single submitter' or 'criteria provided, conflicting classifications'; 2 stars: 'criteria provided, multiple submitters, no conflicts'; 3 stars: 'reviewed by expert panel'; 4 stars: 'practice guideline'.
enum AggregateGermlineReviewStatusValue {
  AGGREGATE_GERMLINE_REVIEW_STATUS_VALUE_UNSPECIFIED = 0;
  AGGREGATE_GERMLINE_REVIEW_STATUS_VALUE_NO_CLASSIFICATION_PROVIDED = 1;
  AGGREGATE_GERMLINE_REVIEW_STATUS_VALUE_NO_ASSERTION_CRITERIA_PROVIDED = 2;
  AGGREGATE_GERMLINE_REVIEW_STATUS_VALUE_CRITERIA_PROVIDED_SINGLE_SUBMITTER = 3;
  AGGREGATE_GERMLINE_REVIEW_STATUS_VALUE_CRITERIA_PROVIDED_MULTIPLE_SUBMITTERS_NO_CONFLICTS = 4;
  AGGREGATE_GERMLINE_REVIEW_STATUS_VALUE_CRITERIA_PROVIDED_CONFLICTING_CLASSIFICATIONS = 5;
  AGGREGATE_GERMLINE_REVIEW_STATUS_VALUE_REVIEWED_BY_EXPERT_PANEL = 6;
  AGGREGATE_GERMLINE_REVIEW_STATUS_VALUE_PRACTICE_GUIDELINE = 7;
  AGGREGATE_GERMLINE_REVIEW_STATUS_VALUE_NO_CLASSIFICATIONS_FROM_UNFLAGGED_RECORDS = 8;
  AGGREGATE_GERMLINE_REVIEW_STATUS_VALUE_NO_CLASSIFICATION_FOR_THE_SINGLE_VARIANT = 9;
}
enum AggregateNoClassificationReviewStatusValue {
  AGGREGATE_NO_CLASSIFICATION_REVIEW_STATUS_VALUE_UNSPECIFIED = 0;
  AGGREGATE_NO_CLASSIFICATION_REVIEW_STATUS_VALUE_NO_CLASSIFICATION_PROVIDED = 1;
}
// Aggregate review status (star rating) across all oncogenicity submissions. Uses the same 0-4 star scale as AggregateGermlineReviewStatusValue.
enum AggregateOncogenicityReviewStatusValue {
  AGGREGATE_ONCOGENICITY_REVIEW_STATUS_VALUE_UNSPECIFIED = 0;
  AGGREGATE_ONCOGENICITY_REVIEW_STATUS_VALUE_NO_CLASSIFICATION_PROVIDED = 1;
  AGGREGATE_ONCOGENICITY_REVIEW_STATUS_VALUE_NO_ASSERTION_CRITERIA_PROVIDED = 2;
  AGGREGATE_ONCOGENICITY_REVIEW_STATUS_VALUE_CRITERIA_PROVIDED_SINGLE_SUBMITTER = 3;
  AGGREGATE_ONCOGENICITY_REVIEW_STATUS_VALUE_CRITERIA_PROVIDED_MULTIPLE_SUBMITTERS_NO_CONFLICTS = 4;
  AGGREGATE_ONCOGENICITY_REVIEW_STATUS_VALUE_CRITERIA_PROVIDED_CONFLICTING_CLASSIFICATIONS = 5;
  AGGREGATE_ONCOGENICITY_REVIEW_STATUS_VALUE_REVIEWED_BY_EXPERT_PANEL = 6;
  AGGREGATE_ONCOGENICITY_REVIEW_STATUS_VALUE_PRACTICE_GUIDELINE = 7;
  AGGREGATE_ONCOGENICITY_REVIEW_STATUS_VALUE_NO_CLASSIFICATIONS_FROM_UNFLAGGED_RECORDS = 8;
  AGGREGATE_ONCOGENICITY_REVIEW_STATUS_VALUE_NO_CLASSIFICATION_FOR_THE_SINGLE_VARIANT = 9;
}
// Aggregate review status across every somatic clinical impact submission. ClinVar does not assess somatic submissions for conflicts, so this enumeration has no 'conflicting classifications' member and its 2-star value is 'criteria provided, multiple submitters', without the germline scale's 'no conflicts' suffix.
enum AggregateSomaticClinicalImpactReviewStatusValue {
  AGGREGATE_SOMATIC_CLINICAL_IMPACT_REVIEW_STATUS_VALUE_UNSPECIFIED = 0;
  AGGREGATE_SOMATIC_CLINICAL_IMPACT_REVIEW_STATUS_VALUE_NO_CLASSIFICATION_PROVIDED = 1;
  AGGREGATE_SOMATIC_CLINICAL_IMPACT_REVIEW_STATUS_VALUE_NO_ASSERTION_CRITERIA_PROVIDED = 2;
  AGGREGATE_SOMATIC_CLINICAL_IMPACT_REVIEW_STATUS_VALUE_CRITERIA_PROVIDED_SINGLE_SUBMITTER = 3;
  AGGREGATE_SOMATIC_CLINICAL_IMPACT_REVIEW_STATUS_VALUE_CRITERIA_PROVIDED_MULTIPLE_SUBMITTERS = 4;
  AGGREGATE_SOMATIC_CLINICAL_IMPACT_REVIEW_STATUS_VALUE_REVIEWED_BY_EXPERT_PANEL = 5;
  AGGREGATE_SOMATIC_CLINICAL_IMPACT_REVIEW_STATUS_VALUE_PRACTICE_GUIDELINE = 6;
  AGGREGATE_SOMATIC_CLINICAL_IMPACT_REVIEW_STATUS_VALUE_NO_CLASSIFICATIONS_FROM_UNFLAGGED_RECORDS = 7;
  AGGREGATE_SOMATIC_CLINICAL_IMPACT_REVIEW_STATUS_VALUE_NO_CLASSIFICATION_FOR_THE_SINGLE_VARIANT = 8;
}
enum AssertionTypeAttr {
  ASSERTION_TYPE_ATTR_UNSPECIFIED = 0;
  ASSERTION_TYPE_ATTR_VARIATION_TO_DISEASE = 1;
  ASSERTION_TYPE_ATTR_VARIATION_TO_INCLUDED_DISEASE = 2;
  ASSERTION_TYPE_ATTR_VARIATION_IN_MODIFIER_GENE_TO_DISEASE = 3;
  ASSERTION_TYPE_ATTR_CONFERS_SENSITIVITY = 4;
  ASSERTION_TYPE_ATTR_CONFERS_RESISTANCE = 5;
  ASSERTION_TYPE_ATTR_VARIANT_TO_NAMED_PROTEIN = 6;
  ASSERTION_TYPE_ATTR_NO_CLASSIFICATION = 7;
}
// The attribute is a general element to represent a defined set of data qualified by an enumerated set of types. For each attribute element, the value will be a character string and is optional. Source shall be used to store identifiers for supplied data from source other than the submitter (e.g. SequenceOntology). The data submitted where Type="variation" shall be validated against sequence_alternation in Sequence Ontology http://www.sequenceontology.org/. This is to be a generic version of AttributeType and should be used with extension when it is used to specify Type and its enumerations.
message Attribute {
  optional int32 integer_value = 1;
  google.protobuf.Timestamp date_value = 2;
  // The attribute is a general element to represent a defined set of data qualified by an enumerated set of types. For each attribute element, the value will be a character string and is optional. Source shall be used to store identifiers for supplied data from source other than the submitter (e.g. SequenceOntology). The data submitted where Type="variation" shall be validated against sequence_alternation in Sequence Ontology http://www.sequenceontology.org/. This is to be a generic version of AttributeType and should be used with extension when it is used to specify Type and its enumerations.
  optional string value = 3;
}
// Non-numeric chromosome names: X, Y, MT, PAR, Un. Numeric chromosomes 1-22 come from ChromosomeNr; the Chr attribute is the union of both.
enum ChromosomeStr {
  CHROMOSOME_STR_UNSPECIFIED = 0;
  CHROMOSOME_STR_X = 1;
  CHROMOSOME_STR_Y = 2;
  CHROMOSOME_STR_MT = 3;
  CHROMOSOME_STR_PAR = 4;
  CHROMOSOME_STR_UN = 5;
}
// Allowed values are 'present', 'absent', and 'not tested'.
enum ClinicalFeaturesAffectedStatusType {
  CLINICAL_FEATURES_AFFECTED_STATUS_TYPE_UNSPECIFIED = 0;
  CLINICAL_FEATURES_AFFECTED_STATUS_TYPE_PRESENT = 1;
  CLINICAL_FEATURES_AFFECTED_STATUS_TYPE_ABSENT = 2;
  CLINICAL_FEATURES_AFFECTED_STATUS_TYPE_NOT_TESTED = 3;
}
enum CommentType {
  COMMENT_TYPE_UNSPECIFIED = 0;
  COMMENT_TYPE_PUBLIC = 1;
  COMMENT_TYPE_CONVERTED_BY_NCBI = 2;
  COMMENT_TYPE_MISSING_FROM_ASSEMBLY = 3;
  COMMENT_TYPE_GENOMIC_LOCATION_NOT_ESTABLISHED = 4;
  COMMENT_TYPE_LOCATION_ON_GENOME_AND_PRODUCT_NOT_ALIGNED = 5;
  COMMENT_TYPE_DELETION_COMMENT = 6;
  COMMENT_TYPE_MERGE_COMMENT = 7;
  COMMENT_TYPE_ASSEMBLY_SPECIFIC_ALLELE_DEFINITION = 8;
  COMMENT_TYPE_ALIGNMENT_GAP_MAKES_APPEAR_INCONSISTENT = 9;
  COMMENT_TYPE_EXPLANATION_OF_CLASSIFICATION = 10;
  COMMENT_TYPE_FLAGGED_COMMENT = 11;
}
message DescriptionHistory {
  google.protobuf.Timestamp dated = 1;
  string description = 2;
}
enum Evidencetype {
  EVIDENCETYPE_UNSPECIFIED = 0;
  EVIDENCETYPE_GENETIC = 1;
  EVIDENCETYPE_EXPERIMENTAL = 2;
  EVIDENCETYPE_POPULATION = 3;
  EVIDENCETYPE_COMPUTATIONAL = 4;
}
// Structure to describe attributes of any family data in an observation. If the details of the number of families and the de-identified pedigree id are not available, use FamilyHistory to describe what type of family data is available. Can also be used to report 'Yes' or 'No' if there are no more details.
message FamilyInfo {
  // Total families tested; denominator for 'Number of families with variant'.
  optional int32 num_families = 1;
  // Families in which the variant was observed.
  optional int32 num_families_with_variant = 2;
  // Families where the variant co-segregates with the condition in two or more family members.
  optional int32 num_families_with_segregation_observed = 3;
  // Anonymous identifier linking individual observations from the same family across multiple records.
  optional string pedigree_id = 4;
  optional string segregation_observed = 5;
  // Free text describing what kind of family data is available; the submitter may give only 'Yes' or 'No' when there are no further details.
  optional string family_history = 6;
}
enum GeneVariant {
  GENE_VARIANT_UNSPECIFIED = 0;
  GENE_VARIANT_VARIANT_WITHIN_GENE = 1;
  GENE_VARIANT_GENE_OVERLAPPED_BY_VARIANT = 2;
  GENE_VARIANT_VARIANT_NEAR_GENE_UPSTREAM = 3;
  GENE_VARIANT_VARIANT_NEAR_GENE_DOWNSTREAM = 4;
  GENE_VARIANT_ASSERTED_BUT_NOT_COMPUTED = 5;
  GENE_VARIANT_WITHIN_MULTIPLE_GENES_BY_OVERLAP = 6;
  GENE_VARIANT_WITHIN_SINGLE_GENE = 7;
  GENE_VARIANT_GENES_OVERLAPPED_BY_VARIANT = 8;
  GENE_VARIANT_NEAR_GENE_DOWNSTREAM = 9;
  GENE_VARIANT_NEAR_GENE_UPSTREAM = 10;
}
enum HaplotypeVariationType {
  HAPLOTYPE_VARIATION_TYPE_UNSPECIFIED = 0;
  HAPLOTYPE_VARIATION_TYPE_HAPLOTYPE = 1;
  HAPLOTYPE_VARIATION_TYPE_HAPLOTYPE_SINGLE_VARIANT = 2;
  HAPLOTYPE_VARIATION_TYPE_VARIATION = 3;
  HAPLOTYPE_VARIATION_TYPE_PHASE_UNKNOWN = 4;
  HAPLOTYPE_VARIATION_TYPE_HAPLOTYPE_DEFINED_BY_A_SINGLE_VARIANT = 5;
}
enum Hgvs {
  HGVS_UNSPECIFIED = 0;
  HGVS_CODING = 1;
  HGVS_GENOMIC = 2;
  HGVS_GENOMIC_TOP_LEVEL = 3;
  HGVS_NON_CODING = 4;
  HGVS_PROTEIN = 5;
}
// The method used to collect data for a submission.
enum Methodlist {
  METHODLIST_UNSPECIFIED = 0;
  METHODLIST_LITERATURE_ONLY = 1;
  METHODLIST_REFERENCE_POPULATION = 2;
  METHODLIST_CASE_CONTROL = 3;
  METHODLIST_CLINICAL_TESTING = 4;
  METHODLIST_IN_VITRO = 5;
  METHODLIST_IN_VIVO = 6;
  METHODLIST_RESEARCH = 7;
  METHODLIST_CURATION = 8;
  METHODLIST_NOT_PROVIDED = 9;
  METHODLIST_PROVIDER_INTERPRETATION = 10;
  METHODLIST_PHENOTYPING_ONLY = 11;
}
enum NucleotideSequence {
  NUCLEOTIDE_SEQUENCE_UNSPECIFIED = 0;
  NUCLEOTIDE_SEQUENCE_GENOMIC_TOP_LEVEL = 1;
  NUCLEOTIDE_SEQUENCE_GENOMIC_REF_SEQ_GENE = 2;
  NUCLEOTIDE_SEQUENCE_GENOMIC = 3;
  NUCLEOTIDE_SEQUENCE_CODING = 4;
  NUCLEOTIDE_SEQUENCE_NON_CODING = 5;
  NUCLEOTIDE_SEQUENCE_PROTEIN = 6;
}
enum Origin {
  ORIGIN_UNSPECIFIED = 0;
  ORIGIN_GERMLINE = 1;
  ORIGIN_SOMATIC = 2;
  ORIGIN_DE_NOVO = 3;
  ORIGIN_NOT_PROVIDED = 4;
  ORIGIN_INHERITED = 5;
  ORIGIN_MATERNAL = 6;
  ORIGIN_PATERNAL = 7;
  ORIGIN_UNIPARENTAL = 8;
  ORIGIN_BIPARENTAL = 9;
  ORIGIN_NOT_REPORTED = 10;
  ORIGIN_TESTED_INCONCLUSIVE = 11;
  ORIGIN_UNKNOWN = 12;
  ORIGIN_NOT_APPLICABLE = 13;
  ORIGIN_EXPERIMENTALLY_GENERATED = 14;
}
// Category of the condition grouping: Disease, DrugResponse, Finding, PhenotypeInstruction, TraitChoice.
enum PhenotypeSet {
  PHENOTYPE_SET_UNSPECIFIED = 0;
  PHENOTYPE_SET_DISEASE = 1;
  PHENOTYPE_SET_DRUG_RESPONSE = 2;
  PHENOTYPE_SET_FINDING = 3;
  PHENOTYPE_SET_PHENOTYPE_INSTRUCTION = 4;
  PHENOTYPE_SET_TRAIT_CHOICE = 5;
}
enum ProteinSequence {
  PROTEIN_SEQUENCE_UNSPECIFIED = 0;
  PROTEIN_SEQUENCE_PROTEIN = 1;
}
message ProteinSequenceExpression {
  optional string sequence_accession_version = 1;
  optional string sequence_accession = 2;
  optional string sequence_version = 3;
  optional string change = 4;
  // Protein change in single-letter amino acid code, e.g. p.Arg123His → p.R123H.
  optional string single_letter_protein_change = 5;
  string expression = 6;
}
// The classified condition (disease or phenotype) associated with this RCV. The value 'not provided' is used for submissions where no condition was named.
message RcvinterpretedCondition {
  // Database for the condition identifier; NOT enumerated in the XSD. In the VCV release this is the MedGen concept for the condition (ClinVar maps every submitted trait to MedGen, including 'not provided'); other vocabularies (OMIM, Orphanet, MeSH, MONDO, Human Phenotype Ontology) appear on the trait's xref, not here.
  optional string db = 1;
  optional string id = 2;
  optional string value = 3;
}
message Scv {
  optional string title = 1;
  string accession = 2;
  int64 version = 3;
}
enum Severity {
  SEVERITY_UNSPECIFIED = 0;
  SEVERITY_MILD = 1;
  SEVERITY_MODERATE = 2;
  SEVERITY_SEVERE = 3;
}
// Description of software used in variant analysis, including version and purpose.
message SoftwareSet {
  string name = 1;
  optional string version = 2;
  // Purpose of the software, e.g. 'alignment', 'variant calling', 'annotation'.
  optional string purpose = 3;
}
enum Status {
  STATUS_UNSPECIFIED = 0;
  STATUS_CURRENT = 1;
  STATUS_COMPLETED_AND_RETIRED = 2;
  STATUS_DELETE = 3;
  STATUS_IN_DEVELOPMENT = 4;
  STATUS_RECLASSIFIED = 5;
  STATUS_REJECT = 6;
  STATUS_SECONDARY = 7;
  STATUS_SUPPRESSED = 8;
  STATUS_UNDER_REVIEW = 9;
}
// Review status of ONE submitted record (SCV). Stars per SCV: 4 'practice guideline'; 3 'reviewed by expert panel'; 1 'criteria provided, single submitter'; 0 'no assertion criteria provided' and 'no classification provided'. There is no 2-star SCV value — 'criteria provided, multiple submitters, no conflicts' is computed only across SCVs (see AggregateGermlineReviewStatusValue). 'flagged submission' marks a record ClinVar has flagged; it does not contribute to the aggregate, which then reports 'no classifications from unflagged records'. The remaining values are retained for backward compatibility with clinvar_public.xsd.
enum SubmitterReviewStatusValue {
  SUBMITTER_REVIEW_STATUS_VALUE_UNSPECIFIED = 0;
  SUBMITTER_REVIEW_STATUS_VALUE_NO_CLASSIFICATION_PROVIDED = 1;
  SUBMITTER_REVIEW_STATUS_VALUE_NO_ASSERTION_CRITERIA_PROVIDED = 2;
  SUBMITTER_REVIEW_STATUS_VALUE_CRITERIA_PROVIDED_SINGLE_SUBMITTER = 3;
  SUBMITTER_REVIEW_STATUS_VALUE_REVIEWED_BY_EXPERT_PANEL = 4;
  SUBMITTER_REVIEW_STATUS_VALUE_PRACTICE_GUIDELINE = 5;
  SUBMITTER_REVIEW_STATUS_VALUE_FLAGGED_SUBMISSION = 6;
  SUBMITTER_REVIEW_STATUS_VALUE_CRITERIA_PROVIDED_MULTIPLE_SUBMITTERS_NO_CONFLICTS = 7;
  SUBMITTER_REVIEW_STATUS_VALUE_CRITERIA_PROVIDED_CONFLICTING_CLASSIFICATIONS = 8;
  SUBMITTER_REVIEW_STATUS_VALUE_CLASSIFIED_BY_SINGLE_SUBMITTER = 9;
  SUBMITTER_REVIEW_STATUS_VALUE_REVIEWED_BY_PROFESSIONAL_SOCIETY = 10;
  SUBMITTER_REVIEW_STATUS_VALUE_NOT_CLASSIFIED_BY_SUBMITTER = 11;
  SUBMITTER_REVIEW_STATUS_VALUE_CLASSIFIED_BY_MULTIPLE_SUBMITTERS = 12;
}
enum VariationType {
  VARIATION_TYPE_UNSPECIFIED = 0;
  VARIATION_TYPE_DIPLOTYPE = 1;
  VARIATION_TYPE_COMPOUND_HETEROZYGOTE = 2;
  VARIATION_TYPE_DISTINCT_CHROMOSOMES = 3;
}
// Zygosity: Homozygote, SingleHeterozygote, CompoundHeterozygote, Hemizygote, not provided. Used both for the asserted variant (CoOccurrenceType) and for a co-occurring allele (AlleleDescr).
enum Zygosity {
  ZYGOSITY_UNSPECIFIED = 0;
  ZYGOSITY_HOMOZYGOTE = 1;
  ZYGOSITY_SINGLE_HETEROZYGOTE = 2;
  ZYGOSITY_COMPOUND_HETEROZYGOTE = 3;
  ZYGOSITY_HEMIZYGOTE = 4;
  ZYGOSITY_NOT_PROVIDED = 5;
}
message Citation {
  message Id {
    // Database providing the citation identifier. E.g. PubMed, PubMedCentral, DOI, NCBI bookshelf.
    string source = 1;
    // Identifier from the source database for this citation.
    optional string value = 2;
  }
  // NCBI-assigned citation type, not expected from submitters. Values include: general, review, practice guideline, Position Statement, Translational/Evidence-based, Suggested Reading, Recommendation.
  optional string type = 1;
  // Corresponds to the abbreviation reported by GTR.
  optional string abbrev = 2;
  repeated Id id = 3;
  // Complete URL of the citation.
  optional string url = 4;
  // Use only when there is no database ID for the publication and no URL.
  optional string citation_text = 5;
}
// A structure to support reporting unformatted content, with type and source specified.
message Comment {
  optional string data_source = 1;
  // Comment category. 'public' is a plain public comment; the remaining values are specific NCBI-applied kinds — ConvertedByNCBI, MissingFromAssembly, GenomicLocationNotEstablished, LocationOnGenomeAndProductNotAligned, DeletionComment, MergeComment, AssemblySpecificAlleleDefinition, AlignmentGapMakesAppearInconsistent, ExplanationOfClassification, FlaggedComment.
  optional CommentType type = 2;
  // Free text comment. Line breaks are retained, but no other formatting.
  optional string value = 3;
}
// A structure to support reporting of an accession, its version, the date it was deleted and a free-text summary of why it was deleted.
message DeletedScv {
  message Accession {
    // The version of the deleted SCV.
    uint64 version = 1;
    // The date the SCV was deleted.
    google.protobuf.Timestamp date_deleted = 2;
    // The accession of the deleted SCV.
    optional string value = 3;
  }
  Accession accession = 1;
  optional string description = 2;
}
message FunctionalDataType {
  message FunctionalEffect {
    optional string source = 1;
    optional string id = 2;
    optional string value = 3;
  }
  message FunctionalConsequence {
    optional string source = 1;
    optional string id = 2;
    // Functional consequence reported by the submitter; may be an ontology term (with source and id giving the ontology) or free text.
    optional string value = 3;
  }
  message LinkToExternalDatabase {
    string link_name = 1;
    optional string value = 2;
  }
  FunctionalEffect functional_effect = 1;
  repeated FunctionalConsequence functional_consequence = 2;
  optional string functional_consequence_comment = 3;
  string result = 4;
  LinkToExternalDatabase link_to_external_database = 5;
}
message Names {
  message Name {
    // Classification of the name, e.g. 'Preferred' or 'Alternate'.
    optional string type = 1;
    optional string value = 2;
  }
  repeated Name name = 1;
}
message NucleotideSequenceExpression {
  optional NucleotideSequence sequence_type = 1;
  optional string sequence_accession_version = 2;
  optional string sequence_accession = 3;
  optional string sequence_version = 4;
  optional string change = 5;
  optional string assembly = 6;
  optional string submitted = 7;
  optional bool maneselect = 8;
  optional bool maneplus_clinical = 9;
  string expression = 10;
}
// A structure to support reporting the name of a submitter, its organization id, and its abbreviation and type
message SubmitterType {
  enum Type {
    TYPE_UNSPECIFIED = 0;
    TYPE_PRIMARY = 1;
    TYPE_SECONDARY = 2;
    TYPE_BEHALF = 3;
  }
  // Name of the person or organization submitting this batch of records.
  string submitter_name = 1;
  uint64 org_id = 2;
  string organization_category = 3;
  optional string org_abbreviation = 4;
  Type type = 5;
}
// Database cross-reference (XRef) linking a concept to an identifier in an external database. Used throughout to point to MedGen, OMIM, Orphanet, dbSNP, dbVar, and others.
message Xref {
  // Name of the external database. E.g. MedGen, OMIM, Orphanet, Gene, Ensembl, HGNC, dbSNP.
  string db = 1;
  // The identifier used by the database. Being exported as a string even though internally the database has rules for defining which datases use integer identifers.
  string id = 2;
  // Used to differentiate between different types of identifiers that a database may provide.
  optional string type = 3;
  optional string url = 4;
  optional Status status = 5;
}
message AttributeSet {
  message Attribute {
    optional int32 integer_value = 1;
    google.protobuf.Timestamp date_value = 2;
    // Type key for the attribute value. Examples include 'GARD id', 'keyword'.
    string type = 3;
    optional string value = 4;
  }
  Attribute attribute = 1;
  repeated Citation citation = 2;
  repeated Xref xref = 3;
  repeated Comment comment = 4;
}
// The classification from a single submitted clinical variant record (SCV). This is one submitter's verdict, before aggregation across all SCVs into the VCV.
message ClassificationTypeScv {
  message SomaticClinicalImpact {
    optional string clinical_impact_assertion_type = 1;
    optional string clinical_impact_clinical_significance = 2;
    optional string drug_for_therapeutic_assertion = 3;
    optional string value = 4;
  }
  message ClassificationScore {
    optional string type = 1;
    optional double value = 2;
  }
  // Date the classification was last evaluated by the submitter.
  google.protobuf.Timestamp date_last_evaluated = 1;
  // Single-submitter review status; see SubmitterReviewStatusValue for allowed values.
  SubmitterReviewStatusValue review_status = 2;
  oneof oneof_name {
    // This submitter's own germline classification, as submitted — the per-submission counterpart to AggregatedGermlineClassification.description. The submission value space additionally admits the VUS sub-tiers 'VUS-high', 'VUS-mid' and 'VUS-low'; whether a sub-tier survives into the aggregate description is not documented upstream. See https://github.com/ncbi/clinvar/blob/master/somatic_classifications/ClassificationOnClinVar.md.
    string germline_classification = 3;
    SomaticClinicalImpact somatic_clinical_impact = 4;
    string oncogenicity_classification = 5;
    string no_classification = 6;
  }
  optional string explanation_of_classification = 7;
  repeated ClassificationScore classification_score = 8;
  repeated Xref xref = 9;
  repeated Citation citation = 10;
  // Explanation of the classification, providing the submitter's rationale.
  repeated Comment comment = 11;
}
// Record of changes to a submitted clinical variant record (SCV).
message ClinicalAssertionRecordHistory {
  string accession = 1;
  optional uint64 version = 2;
  google.protobuf.Timestamp date_changed = 3;
  Comment comment = 4;
}
message ClinicalSignificanceType {
  google.protobuf.Timestamp date_last_evaluated = 1;
  // Review status of the submission.
  optional SubmitterReviewStatusValue review_status = 2;
  // Carries old-style (pre-2023) clinical significance data from AlleleDescriptionSet within Co-occurrenceSet, before the current three-category classification model was adopted.
  optional string description = 3;
  // Legacy Co-occurrenceSet structure: populated when the old-style description was 'conflicting data from submitters', a value ClinVar has retired.
  Comment explanation = 4;
  repeated Xref xref = 5;
  repeated Citation citation = 6;
  repeated Comment comment = 7;
}
// A structure to represent an HGVS expression for a nucleotide sequence variant, along with the predicted protein change and the predicted molecular consequence. Also used to represent only the protein change if that is all that has been reported.
message Hgvsexpression {
  Hgvs type = 1;
  optional string assembly = 2;
  NucleotideSequenceExpression nucleotide_expression = 3;
  ProteinSequenceExpression protein_expression = 4;
  repeated Xref molecular_consequence = 5;
}
// There can be multiple types of location, and the locations may have identifiers in other databases
message Location {
  message SequenceLocation {
    enum AssemblyStatus {
      ASSEMBLY_STATUS_UNSPECIFIED = 0;
      ASSEMBLY_STATUS_CURRENT = 1;
      ASSEMBLY_STATUS_PREVIOUS = 2;
    }
    optional bool for_display = 1;
    string assembly = 2;
    string chr = 3;
    optional string accession = 4;
    optional uint64 outer_start = 5;
    optional uint64 inner_start = 6;
    optional uint64 start = 7;
    optional uint64 stop = 8;
    optional uint64 inner_stop = 9;
    optional uint64 outer_stop = 10;
    optional uint64 display_start = 11;
    optional uint64 display_stop = 12;
    optional string strand = 13;
    optional uint64 variant_length = 14;
    optional string reference_allele = 15;
    optional string alternate_allele = 16;
    optional string assembly_accession_version = 17;
    optional AssemblyStatus assembly_status = 18;
    optional uint64 position_vcf = 19;
    optional string reference_allele_vcf = 20;
    optional string alternate_allele_vcf = 21;
    optional bool for_display_length = 22;
  }
  // Cytogenetic band location (e.g. 17q21.31), maintained independently of sequence coordinates and can be computed from them.
  repeated string cytogenetic_location = 1;
  // Sequence-based location using 1-based offset coordinates, right-justified to be consistent with HGVS. Includes reference and alternate allele, and start/stop values.
