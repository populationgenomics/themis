  // Germline classification. Usually an ACMG/AMP term (Pathogenic, Likely pathogenic, Uncertain significance, Likely benign, Benign), or a composite formed by joining terms with '/' — 'Pathogenic/Likely pathogenic', 'Benign/Likely benign', and across categories 'Pathogenic/Established risk allele'; also 'Conflicting classifications of pathogenicity', the ClinGen low-penetrance and risk-allele terms (Pathogenic/Likely pathogenic, low penetrance; Established risk allele; Likely risk allele; Uncertain risk allele), and non-standard terms (drug response, risk factor, association, protective, Affects, other, not provided). The value space is open — do not treat it as an enumeration. See https://github.com/ncbi/clinvar/blob/master/somatic_classifications/ClassificationOnClinVar.md.
  optional string description = 7;
  // Populated when the description is 'Conflicting classifications of pathogenicity'; the value enumerates the conflicting classifications with submission counts, e.g. 'Uncertain significance (1); Benign (1)'. The XSD's own annotation instead names 'conflicting data from submitters' — a germline classification term retained from early submissions by a single consortium, not the aggregate conflict description.
  Comment explanation = 8;
  repeated Xref xref = 9;
  repeated Citation citation = 10;
  repeated Comment comment = 11;
  repeated DescriptionHistory description_history = 12;
  repeated ClinAsserTraitSetType condition_list = 13;
}
message AggregatedNoClassification {
  google.protobuf.Timestamp date_created = 1;
  google.protobuf.Timestamp most_recent_submission = 2;
  uint64 number_of_submitters = 3;
  uint64 number_of_submissions = 4;
  optional string type = 5;
  // The aggregate review status based on all no-classification submissions for this record.
  AggregateNoClassificationReviewStatusValue review_status = 6;
  // Why the record carries no classification, aggregated over its submissions. The value space is not enumerated in the XSD; see https://github.com/ncbi/clinvar/blob/master/somatic_classifications/ClassificationOnClinVar.md.
  optional string description = 7;
  repeated Xref xref = 8;
  repeated Citation citation = 9;
  repeated Comment comment = 10;
  repeated DescriptionHistory description_history = 11;
  repeated ClinAsserTraitSetType condition_list = 12;
}
message AggregatedOncogenicityClassification {
  google.protobuf.Timestamp date_last_evaluated = 1;
  google.protobuf.Timestamp date_created = 2;
  google.protobuf.Timestamp most_recent_submission = 3;
  uint64 number_of_submitters = 4;
  uint64 number_of_submissions = 5;
  // Aggregate review status (star rating) from all oncogenicity submissions for this variant.
  AggregateOncogenicityReviewStatusValue review_status = 6;
  // Oncogenicity classification on the ClinGen/CGC/VICC terms (PMID 36063163): Oncogenic, Likely oncogenic, Uncertain significance, Likely benign, Benign; also the composites 'Oncogenic/Likely oncogenic' and 'Benign/Likely benign', and 'Conflicting classifications of oncogenicity'. See https://github.com/ncbi/clinvar/blob/master/somatic_classifications/ClassificationOnClinVar.md.
  optional string description = 7;
  // Populated when the description is 'Conflicting classifications of oncogenicity'; the value enumerates the conflicting classifications with submission counts. The XSD's own annotation instead names 'conflicting data from submitters' — a germline classification term retained from early submissions by a single consortium, not the aggregate conflict description.
  Comment explanation = 8;
  repeated Xref xref = 9;
  repeated Citation citation = 10;
  repeated Comment comment = 11;
  repeated DescriptionHistory description_history = 12;
  repeated ClinAsserTraitSetType condition_list = 13;
}
message AggregatedSomaticClinicalImpact {
  google.protobuf.Timestamp date_last_evaluated = 1;
  google.protobuf.Timestamp date_created = 2;
  google.protobuf.Timestamp most_recent_submission = 3;
  uint64 number_of_submitters = 4;
  uint64 number_of_submissions = 5;
  // Aggregate review status (star rating) from all somatic clinical impact submissions for this variant.
  AggregateSomaticClinicalImpactReviewStatusValue review_status = 6;
  // Somatic clinical impact on the AMP/ASCO/CAP tiers (PMID 27993330), reported verbatim as 'Tier I - Strong', 'Tier II - Potential', 'Tier III - Unknown', 'Tier IV - Benign/Likely benign'. The aggregate is the HIGHEST tier reported by the submissions at the record's review-status tier — not a consensus; conflicts are not calculated, and different tiers for different tumour types are expected. Conditions reported at a lower tier are marked in condition_list. See https://github.com/ncbi/clinvar/blob/master/somatic_classifications/ClassificationOnClinVar.md.
  optional string description = 7;
  repeated Xref xref = 8;
  repeated Citation citation = 9;
  repeated Comment comment = 10;
  repeated DescriptionHistory description_history = 11;
  repeated ClinAsserTraitSetType condition_list = 12;
}
// Documents in what populations or samples an allele or genotype has been observed relative to the described trait. Summary observations can be registered per submitted assertion, grouped by common citation, study type, origin, ethnicity, tissue, cell line, and species data. Not all options are valid per study type, but these will not be validated in the xsd.
message ObservationSet {
  message Method {
    enum Type {
      TYPE_UNSPECIFIED = 0;
      TYPE_LITERATURE_ONLY = 1;
      TYPE_REFERENCE_POPULATION = 2;
      TYPE_CASE_CONTROL = 3;
      TYPE_CLINICAL_TESTING = 4;
      TYPE_IN_VITRO = 5;
      TYPE_IN_VIVO = 6;
      TYPE_INFERRED_FROM_SOURCE = 7;
      TYPE_RESEARCH = 8;
    }
    optional string name_platform = 1;
    optional string type_platform = 2;
    optional string purpose = 3;
    optional MethodType.ResultType result_type = 4;
    optional string min_reported = 5;
    optional string max_reported = 6;
    optional string reference_standard = 7;
    repeated Citation citation = 8;
    repeated Xref xref = 9;
    // Free text supplementing the structured method fields with details not captured elsewhere.
    optional string description = 10;
    repeated SoftwareSet software = 11;
    // The source type of the method.
    optional MethodType.SourceType source_type = 12;
    Methodlist method_type = 13;
    repeated MethodType.MethodAttribute method_attribute = 14;
    // Attribute specific to a particular method in conjunction with a particular observation.
    repeated MethodType.ObsMethodAttribute obs_method_attribute = 15;
    MethodType.AssayType assay_type = 16;
    optional string molecular_phenotype_measured = 17;
    optional uint64 number_of_replicates = 18;
    optional uint64 number_of_controls = 19;
    ScoringRangesType scoring_ranges = 20;
    optional Type type = 21;
  }
  optional string type = 1;
  Sample sample = 2;
  repeated Method method = 3;
  // AttributeSet with exactly one attribute, optionally supported by citations, xrefs, and comments. At least one ObservedData is required; decimal values are stored as strings.
  repeated ObservedDataType observed_data = 4;
  FunctionalDataType functional_data = 5;
  // Co-occurring variants observed in the same individuals, used for cis/trans analysis.
  repeated CoOccurrenceType co_occurrence_set = 6;
  ClinAsserTraitSetType trait_set = 7;
  repeated Citation citation = 8;
  repeated Xref xref = 9;
  repeated Comment comment = 10;
}
// Used to bundle different types of Classifications (germline, oncogenic, somatic clinical impact, no-classification) ; Supports summary as well as submission details
message AggregateClassificationSet {
  AggregatedGermlineClassification germline_classification = 1;
  AggregatedSomaticClinicalImpact somatic_clinical_impact = 2;
  AggregatedOncogenicityClassification oncogenicity_classification = 3;
  AggregatedNoClassification no_classification = 4;
}
// A single sequence change (simple allele) relative to a reference. Contrast with Haplotype (multiple changes on one chromosome) and Genotype (changes on both chromosomes of a homologous pair).
message Allele {
  message GeneList {
    message Gene {
      // ClinGen haploinsufficiency score for this gene — evidence that losing one copy causes disease.
      message Haploinsufficiency {
        google.protobuf.Timestamp last_evaluated = 1;
        // URL to the ClinGen dosage sensitivity page for this gene's haploinsufficiency score.
        optional string clin_gen = 2;
        // Haploinsufficiency score description. E.g. 'Little evidence for dosage pathogenicity', 'Sufficient evidence for dosage pathogenicity'.
        optional string value = 3;
      }
      // ClinGen triplosensitivity score for this gene — evidence that gaining an extra copy causes disease.
      message Triplosensitivity {
        google.protobuf.Timestamp last_evaluated = 1;
        // URL to the ClinGen dosage sensitivity page for this gene's triplosensitivity score.
        optional string clin_gen = 2;
        // Triplosensitivity score description. E.g. 'No evidence available', 'Sufficient evidence for dosage pathogenicity'.
        optional string value = 3;
      }
      optional string symbol = 1;
      string full_name = 2;
      uint64 gene_id = 3;
      optional string hgnc_id = 4;
      // Whether the gene association was 'calculated' by NCBI or 'submitted' by the submitter.
      string source = 5;
      optional GeneVariant relationship_type = 6;
      Location location = 7;
      repeated uint64 omim = 8;
      // ClinGen haploinsufficiency score and supporting evidence for this gene.
      Haploinsufficiency haploinsufficiency = 9;
      Triplosensitivity triplosensitivity = 10;
      // Keywords for retrieval or display (e.g. genes listed by the ACMG guidelines for secondary findings).
      repeated string property = 11;
    }
    optional int32 gene_count = 1;
    repeated Gene gene = 2;
  }
  message AlleleFrequencyList {
    message AlleleFrequency {
      optional double value = 1;
      optional string source = 2;
      optional string url = 3;
    }
    repeated AlleleFrequency allele_frequency = 1;
  }
  message GlobalMinorAlleleFrequency {
    optional double value = 1;
    optional string source = 2;
    optional string minor_allele = 3;
    optional string url = 4;
  }
  // ClinVar's identifier for this individual variant. The AlleleID and VariationID numbering spaces OVERLAP, so a bare integer is ambiguous without its context; one AlleleID can belong to several VariationIDs (haplotypes, genotypes).
  int32 allele_id = 1;
  uint64 variation_id = 2;
  // 0 to many genes (and related data) related to the allele being reported.
  GeneList gene_list = 3;
  string name = 4;
  optional string common_name = 5;
  // Canonical SPDI (Sequence:Position:Deleted:Inserted) — a fully justified, transcript-independent representation anchored to a genomic RefSeq accession, so it is specific to THAT assembly, not build-independent.
  optional string canonical_spdi = 6;
  optional string variant_type = 7;
  Location location = 8;
  Names other_name_list = 9;
  // Single-letter representations of the protein change (e.g. R123H).
  repeated string protein_change = 10;
  repeated Hgvsexpression hgvslist = 11;
  AggregateClassificationSet classifications = 12;
  repeated Xref xref_list = 13;
  repeated Comment comment = 14;
  AlleleFrequencyList allele_frequency_list = 15;
  GlobalMinorAlleleFrequency global_minor_allele_frequency = 16;
}
message HaplotypeScv {
  optional int32 variation_id = 1;
  // Number of copies of this haplotype.
  optional int32 number_of_copies = 2;
  // Number of chromosomes carrying this haplotype.
  optional uint64 number_of_chromosomes = 3;
  repeated AlleleScv simple_allele = 4;
  optional string name = 5;
  // Other names used for the haplotype
  Names other_name_list = 6;
  AggregateClassificationSet classifications = 7;
  repeated AttributeSet attribute_set = 8;
  repeated Citation citation_list = 9;
  repeated Xref xref_list = 10;
  repeated Comment comment = 11;
}
// Used to report genotypes, be they simple or complex diplotypes.
message GenotypeScv {
  optional int32 variation_id = 1;
  repeated AlleleScv simple_allele = 2;
  // Allows more than 2 haplotypes per genotype to support representation of ploidy.
  repeated HaplotypeScv haplotype = 3;
  optional string name = 4;
  // Other names used for the Genotype
  Names other_name_list = 5;
  VariationType variation_type = 6;
  repeated AttributeSet attribute_set = 7;
  repeated Citation citation_list = 8;
  repeated Xref xref_list = 9;
  repeated Comment comment = 10;
}
// Multiple sequence changes on one chromosome of a homologous pair (or the mitochondrion). Contrast with SimpleAllele (a single change) and Genotype (changes on both chromosomes).
message Haplotype {
  int32 variation_id = 1;
  // Number of copies of this haplotype.
  optional int32 number_of_copies = 2;
  // Number of chromosomes carrying this haplotype.
  optional uint64 number_of_chromosomes = 3;
  repeated Allele simple_allele = 4;
  // The preferred representation of the haplotype.
  string name = 5;
  optional string common_name = 6;
  HaplotypeVariationType variation_type = 7;
  // Names other than 'preferred' used for the haplotype.
  Names other_name_list = 8;
  // All HGVS expressions valid for, or used to submit, this haplotype.
  repeated Hgvsexpression hgvslist = 9;
  AggregateClassificationSet classifications = 10;
  repeated Xref xref_list = 11;
  repeated Comment comment = 12;
}
// Sequence changes on both chromosomes of a homologous pair. Contrast with Haplotype (changes on one chromosome) and SimpleAllele (a single change).
message Genotype {
  int32 variation_id = 1;
  // A single sequence change contributing to this genotype.
  repeated Allele simple_allele = 2;
  // Allows more than 2 haplotypes per genotype to support representation of ploidy.
  repeated Haplotype haplotype = 3;
  string name = 4;
  optional string common_name = 5;
  VariationType variation_type = 6;
  // Names other than 'preferred' used for the Genotype.
  Names other_name_list = 7;
  repeated Hgvsexpression hgvslist = 8;
  repeated AggregateClassificationSet classifications = 9;
  repeated Xref xref_list = 10;
  repeated Citation citation_list = 11;
  repeated Comment comment = 12;
  repeated AttributeSet attribute_set = 13;
}
// A simple allele or haplotype referenced by ClassifiedRecords but submitted without an independent classification. Its Classifications block is PRESENT but reports, for each classification type, a review status and the description 'no classification for the single variant' (zero stars).
message IncludedRecord {
  message ClassifiedVariationList {
    message ClassifiedVariation {
      uint64 variation_id = 1;
      optional string accession = 2;
      int64 version = 3;
    }
    repeated ClassifiedVariation classified_variation = 1;
  }
  message GeneralCitations {
    repeated Citation citation = 1;
    repeated Xref xref = 2;
  }
  oneof oneof_name {
    Allele simple_allele = 1;
    // A haplotype (multiple sequence changes on one chromosome) included in this record but submitted without an independent classification.
    Haplotype haplotype = 2;
  }
  AggregateClassificationSet classifications = 3;
  repeated Scv submitted_classification_list = 4;
  // Classified variants (with their own VCV) that incorporate this included variant, maintaining referential integrity for indexing and retrieval.
  ClassifiedVariationList classified_variation_list = 5;
  repeated GeneralCitations general_citations = 6;
}
// A single submitted clinical variant record (SCV): one submitter's classification of a variant against a condition SET (see multiple_condition_explanation), identified by a unique SCV accession. The variant-condition PAIR is the RCV.
message MeasureTraitType {
  message ClinVarSubmissionId {
    // Identifier provided by the submitter to match their internal records. If not provided by the submitter, NCBI generates one. Whether submitter-provided is indicated by local_key_is_submitted.
    string local_key = 1;
    optional string title = 2;
    // True if the local_key was provided by the submitter (vs NCBI-generated).
    optional string local_key_is_submitted = 3;
    optional string submitted_assembly = 4;
  }
  // The SCV (submitted record in ClinVar) accession for one submitter's record. SCV accessions have the format SCV + 9 digits + version suffix (e.g. SCV000000001.1).
  message ClinVarAccession {
    string accession = 1;
    int64 version = 2;
    // Always 'SCV'. Maintained for consistency with ClinVarFullRelease.
    optional string type = 3;
    string submitter_name = 4;
    uint64 org_id = 5;
    string organization_category = 6;
    optional string org_abbreviation = 7;
    // Date when the latest update to this SCV became public in ClinVar.
    google.protobuf.Timestamp date_updated = 8;
    // Date when this SCV first became public in ClinVar.
    google.protobuf.Timestamp date_created = 9;
  }
  enum RecordStatus {
    RECORD_STATUS_UNSPECIFIED = 0;
    RECORD_STATUS_CURRENT = 1;
    RECORD_STATUS_REPLACED = 2;
    RECORD_STATUS_REMOVED = 3;
  }
  message AttributeSet {
    message Attribute {
      enum Type {
        TYPE_UNSPECIFIED = 0;
        TYPE_MODE_OF_INHERITANCE = 1;
        TYPE_PENETRANCE = 2;
        TYPE_AGE_OF_ONSET = 3;
        TYPE_SEVERITY = 4;
        TYPE_CLASSIFICATION_HISTORY = 5;
        TYPE_SEVERITY_DESCRIPTION = 6;
        TYPE_ASSERTION_METHOD = 7;
      }
      optional int32 integer_value = 1;
      google.protobuf.Timestamp date_value = 2;
      // Type key for the attribute value. Examples include 'GARD id', 'keyword'.
      Type type = 3;
      optional string value = 4;
    }
    Attribute attribute = 1;
    repeated Citation citation = 2;
    repeated Xref xref = 3;
    repeated Comment comment = 4;
  }
  // Date when this SCV first became public in ClinVar.
  google.protobuf.Timestamp date_created = 1;
  // Date when the latest update to this SCV became public in ClinVar.
  google.protobuf.Timestamp date_last_updated = 2;
  // Date ClinVar received this submission (distinct from the public release date in date_created).
  google.protobuf.Timestamp submission_date = 3;
  optional uint64 id = 4;
  // Whether this submission comes from an FDA-recognized public human genetic variant database (e.g. a ClinGen expert panel). Germline submissions carry it too.
  optional bool fdarecognized_database = 5;
  // False when this SCV is outranked — ClinVar aggregates only the highest review-status tier present (practice guideline > reviewed by expert panel > criteria provided, single submitter > no assertion criteria provided). Also false for flagged records and for SCVs submitted without a classification. A 0-star SCV DOES contribute when no higher tier exists.
  bool contributes_to_aggregate_classification = 6;
  ClinVarSubmissionId clin_var_submission_id = 7;
  // The SCV accession for this record; only SCV (not VCV or RCV) accessions are stored here.
  ClinVarAccession clin_var_accession = 8;
  // Additional submitters beyond the primary, used only when a batch has multiple submitters.
  repeated SubmitterType additional_submitters = 9;
  RecordStatus record_status = 10;
  // SCV accessions that this record supersedes.
  repeated string replaces = 11;
  // SCV accessions that were replaced by (merged into) this SCV.
  repeated ClinicalAssertionRecordHistory replaced_list = 12;
  ClassificationTypeScv classification = 13;
  AssertionTypeAttr assertion = 14;
  // Package representing a unit of information with its source(s), identifiers, and comments.
  repeated AttributeSet attribute_set = 15;
  repeated ObservationSet observed_in_list = 16;
  oneof oneof_name {
    AlleleScv simple_allele = 17;
    HaplotypeScv haplotype = 18;
    GenotypeScv genotype = 19;
  }
  ClinAsserTraitSetType trait_set = 20;
  repeated Citation citation = 21;
  optional string study_name = 22;
  optional string study_description = 23;
  repeated Comment comment = 24;
  repeated string submission_name_list = 25;
}
message ClassifiedRecord {
  message Rcvlist {
    // The number of submissions (SCV accessions) referencing the VariationID
    optional uint64 submission_count = 1;
    // Total independent observations supporting the RCV classification.
    optional uint64 independent_observations = 2;
    // RCV accessions referencing this VariationID, supporting indexing and retrieval. Does not describe RCV-to-SCV relationships; see clinical_assertion_list for those.
    repeated Rcv rcvaccession = 3;
  }
  message TraitMappingList {
    message TraitMapping {
      enum MappingType {
        MAPPING_TYPE_UNSPECIFIED = 0;
        MAPPING_TYPE_NAME = 1;
        MAPPING_TYPE_XREF = 2;
      }
      message MedGen {
        string name = 1;
        string cui = 2;
      }
      // References clinical_assertion_list[i].id, linking this trait mapping to a specific SCV.
      optional uint64 clinical_assertion_id = 1;
      optional string trait_type = 2;
      // How the submitted trait was matched to a MedGen concept. MAPPING_TYPE_NAME: matched by name (mapping_ref is 'Alternate' or 'Preferred', mapping_value is the submitted trait name). MAPPING_TYPE_XREF: matched by database ID (mapping_ref is the database name, mapping_value is the identifier).
      optional MappingType mapping_type = 3;
      optional string mapping_value = 4;
      optional string mapping_ref = 5;
      MedGen med_gen = 6;
    }
    repeated TraitMapping trait_mapping = 1;
  }
  message FunctionalEvidenceStrengthAnnotationList {
    message FunctionalEvidenceStrengthAnnotation {
      message Source {
        optional string name = 1;
        optional uint64 org_id = 2;
      }
      Source source = 1;
      repeated string accession_list = 2;
      string functional_evidence_strength = 3;
      optional string comment_on_functional_evidence_strength = 4;
      ClinAsserTraitSetType trait_set = 5;
      Citation citation = 6;
    }
    repeated FunctionalEvidenceStrengthAnnotation functional_evidence_strength_annotation = 1;
  }
  message GeneralCitations {
    repeated Citation citation = 1;
    repeated Xref xref = 2;
  }
  oneof oneof_name {
    // Describes a single sequence change relative to a contiguous region of a chromosome or the mitochondrion.
    Allele simple_allele = 1;
    // Describes multiple sequence changes on one of the chromosomes of a homologous pair or on the mitochondrion.
    Haplotype haplotype = 2;
    // Describes the combination of sequence changes on each chromosome of a homologous pair
    Genotype genotype = 3;
  }
  Rcvlist rcvlist = 4;
  AggregateClassificationSet classifications = 5;
  repeated MeasureTraitType clinical_assertion_list = 6;
  // This element is used to report how each user-submitted trait name was mapped to a MedGen CUI identifier and a preferred name. The structure may be used in the future to report, when a trait is identified by a source's identifier (e.g. MIM number), the preferred name used by that source at the time of submission. For MappingType XRef, MappingRef is the database name and MappingValue is the database's identifier. For MappingType Name, MappingRef is Alternate or Preferred, and MappingValue is the submitted name of the trait. ClinicalAssertionID is an integer identifier that corresponds 1:1 to the SCV assigned to the submission.
  TraitMappingList trait_mapping_list = 7;
  FunctionalEvidenceStrengthAnnotationList functional_evidence_strength_annotation_list = 8;
  repeated DeletedScv deleted_scvlist = 9;
  repeated GeneralCitations general_citations = 10;
}
// Top-level record for a classified variant in ClinVar. Each VCV (Variation Archive) aggregates all submissions for a single variation (SimpleAllele, Haplotype, or Genotype). VCV accessions have the format VCV + 9 digits + version suffix (e.g. VCV000000351.1).
message VariationArchiveType {
  enum RecordType {
    RECORD_TYPE_UNSPECIFIED = 0;
    RECORD_TYPE_INCLUDED = 1;
    RECORD_TYPE_CLASSIFIED = 2;
  }
  enum RecordStatus {
    RECORD_STATUS_UNSPECIFIED = 0;
    RECORD_STATUS_CURRENT = 1;
    RECORD_STATUS_PREVIOUS = 2;
    RECORD_STATUS_REPLACED = 3;
    RECORD_STATUS_DELETED = 4;
  }
  message Species {
    optional int32 taxonomy_id = 1;
    optional string value = 2;
  }
  uint64 variation_id = 1;
  // ClinVar's preferred display name for this variant, as shown on the website.
  string variation_name = 2;
  string variation_type = 3;
  // Date when this VCV first became public in ClinVar.
  google.protobuf.Timestamp date_created = 4;
  // Date of the most recent change to this VCV, including SCV updates and NCBI-added annotations. May change without incrementing the version number.
  google.protobuf.Timestamp date_last_updated = 5;
  // Date of the most recently updated or newly added SCV for this VCV.
  google.protobuf.Timestamp most_recent_submission = 6;
  // VCV accession assigned to this variant record (e.g. VCV000000351). Paired with version for the full versioned accession. Distinct from AlleleID (on the Allele element), which identifies the underlying sequence change.
  string accession = 7;
  int32 version = 8;
  uint64 number_of_submitters = 9;
  uint64 number_of_submissions = 10;
  // Whether this VCV was submitted with its own classification ('classified') or only as part of a larger submitted set ('included'). The variation type is variation_type.
  RecordType record_type = 11;
  // Status of this VCV record: current, previous, replaced, deleted.
  RecordStatus record_status = 12;
  // The VCV accession that superseded this record (populated when record_status is 'replaced').
  RecordHistory replaced_by = 13;
  // VCV accessions that have been merged into this record.
  repeated RecordHistory replaced_list = 14;
  Comment comment = 15;
  Species species = 16;
  oneof oneof_name {
    // Classification data for a variant that was independently submitted with its own classification. Contrast with included_record, which tracks variants referenced in submissions but without their own independent classification.
    ClassifiedRecord classified_record = 17;
    // A simple allele or haplotype incorporated into submissions for this VCV, but submitted without an independent classification of its own. See IncludedRecord.
    IncludedRecord included_record = 18;
  }
}
// A full release of the ClinVar database, containing one VariationArchive per variation — classified records and included records alike.
message ReleaseType {
  google.protobuf.Timestamp release_date = 1;
  repeated VariationArchiveType variation_archive = 2;
}
