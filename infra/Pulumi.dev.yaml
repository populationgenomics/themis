  themis:anthropicEnvironmentId: env_0151RnzYTzVpqjunmookpAwr
  # The Managed Agents agent the BFF opens sessions against.
  themis:anthropicAgentId: agent_01DcGE4w5BTrxL4Ay9pgu1H7
  # Anthropic Managed-Agents WIF (Path B) identifiers — plaintext, not credentials
  # (docs/runbooks/claude-api-wif.md).
  themis:anthropicFederationRuleId: fdrl_019dmRVVbye6txjip13uQTaj
  themis:anthropicOrganizationId: e10fa9c3-34d4-42e7-a1ac-1d13dc023d88
  themis:anthropicServiceAccountId: svac_01XmjrcCbPooxthkbWn5JcKg
  themis:anthropicWorkspaceId: wrkspc_01LQBHT9sifFeFz3DQiuJKB7
  # The convert worker's own Path B identifiers — its own svac + rule, pinned to the worker SA
  # (docs/runbooks/claude-api-wif.md); the org and workspace above are shared.
  themis:anthropicWorkerFederationRuleId: fdrl_01Xjz2ApMWww5fKrB3H83AGY
  themis:anthropicWorkerServiceAccountId: svac_016CYiKBMujVhnR8WYnRuWDU
  # The cost exporter's own Path B identifiers — its own svac + rule, pinned to the exporter SA
  # (docs/runbooks/claude-api-wif.md); the org and workspace above are shared.
