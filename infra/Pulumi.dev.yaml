  themis:anthropicCostExporterServiceAccountId: svac_011Bznb6VLqXPL3gZWjebp5e
  # The deploy workflow's own Path B identifiers — its own svac + rule, pinned to the deploy SA
  # (docs/runbooks/claude-api-wif.md, the deploy workflow); the org and workspace above are shared.
  themis:anthropicDeployFederationRuleId: fdrl_01JczBHeE62jFpt24KzD3oiQ
  themis:anthropicDeployServiceAccountId: svac_01AhdNfFYgH3QoMjZWqe1YsR
  # The spend monitor's Slack channel (docs/design/cost-monitoring.md), by name for the alerts and by id for the
  # morning report's file uploads, and the alert tuning: a spike is this many cents of workspace spend, every
  # producer summed, within the window; freshness is how long the exporter's heartbeat may go unwritten before it
  # pages, and so how long every read of its gauges takes the last sample as current — the spike window must exceed
  # it. The bot token of the Slack app that posts to the channel is `themis:slackBotToken`, encrypted.
  themis:slackChannel: "#themis-dev-cost"
  themis:slackChannelId: C0BVCG38L14
  themis:slackBotToken:
    secure: v1:92S9qybuELcCA6Iw:qXhCmv75AtauZWSvwaX1j4BGF1dypezI+QM6qn5iaXOQ1oKZKeZ3ZjxHIBMhi2S3TJSAo19vwPWR4rTeGORSzKokH13b5zxq7og=
  themis:costSpikeAlertCents: "10000"
  themis:costSpikeWindowMinutes: "30"
  themis:costFreshnessMinutes: "25"
