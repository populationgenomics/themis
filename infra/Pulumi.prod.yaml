# Prod environment, in cpg-themis-prod; docs/design/infrastructure.md says what it sets
# differently from dev. Every value reading `placeholder` is one prod does not have yet
# (the OAuth client, the prod Anthropic workspace with its identities and agent, the
# literature API keys); docs/runbooks/fresh-environment.md says which must be real before
# which `up`. Never copy an Anthropic id or a secret from Pulumi.dev.yaml.
secretsprovider: gcpkms://projects/cpg-themis-prod/locations/australia-southeast1/keyRings/themis/cryptoKeys/pulumi
encryptedkey: CiQA5bDmk3dOwfxEI7KtGiasAU9K+RslRPC1a3u+MZsrbToPcf4SSQAE9QQEMhwhvla42enjcgB/zmTbONTPnhXxy5TPYIKgL/e1R2v0Vmod+ypzfcznsYyKMJKorFuCZSuPgzlYRjhPzXpucQ7072Q=
config:
  gcp:project: cpg-themis-prod
  gcp:region: australia-southeast1
  themis:domain: themis.populationgenomics.org.au
  themis:aclWriter: pulumi@cpg-common.iam.gserviceaccount.com
  themis:aclStalenessLimitSeconds: "1800"
  # Shared with dev: the same operators administer both projects (docs/design/access-control.md).
  themis:cluGroup: themis-clu@populationgenomics.org.au
  themis:cluDerivesSessionTokens: "false"
  themis:traceSampleRatio: "1.0"
  themis:workSweepScheduled: "false"
  themis:enablePrScreenshotBucket: "false"
  themis:enableCiTelemetry: "false"
  # Dev's shared-core, single-zone tier. It admits 25 connections, which the instance caps below share, so they
  # match dev's.
  themis:sqlTier: db-f1-micro
  themis:sqlAvailabilityType: ZONAL
  # Monday 03:00 Sydney summer time (02:00 in winter).
  themis:sqlMaintenanceWindow: Sun 16:00 UTC
  themis:authMinInstances: "0"
  themis:authMaxInstances: "3"
  themis:webMinInstances: "0"
  themis:webMaxInstances: "2"
  themis:evidenceMaxInstances: "2"
  # Starting at dev's tuning until prod's own spend has a baseline.
  themis:costSpikeAlertCents: "10000"
  themis:costSpikeWindowMinutes: "30"
  themis:costFreshnessMinutes: "25"
  themis:anthropicOrganizationId: e10fa9c3-34d4-42e7-a1ac-1d13dc023d88
