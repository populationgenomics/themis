# Not (yet) an installable package: no [build-system] / [tool.hatch.*]
# sections. The [project] table is here only to give dependency groups
# (PEP 735) somewhere to live. Add a build backend when application
# code lands and we want a real distribution.

[project]
name = "themis"
version = "0.0.0"
requires-python = ">=3.13"

# Supply-chain age gate: never resolve a release younger than 7 days. Declared
# in-repo (not only in global uv config) so CI and contributors inherit the same
# resolution — a global-only gate makes the lock unreproducible: uv detects
# "removal of global exclude newer" off-machine and `--locked` fails. Relative,
# not a fixed date: the intent is an ongoing "nothing younger than 7 days", not
# a frozen cutoff. Consequence (per repo policy): a local re-lock rolls back any
# committed version younger than the window; it self-heals as the version ages
# past 7 days and Dependabot re-bumps it.
[tool.uv]
exclude-newer = "7 days"
# litfetch, litdown, pubmed-proto, clinvar-proto, postern, and anchorite are CPG-owned and first-party: we cut the
# releases, so the supply-chain window the global gate guards against (a compromised
# third-party upload) doesn't apply. `0 days` (relative, prior-to-now) exempts them
# so a just-cut release is resolvable. Removing the age cushion is paired with an
# exact pin on each (dependency-groups below): with no cushion, the pin is what
# stops a re-lock from silently adopting a new — possibly account-compromised —
# release; a bump is then an explicit, reviewed pyproject edit. Keep this list and
# those pins in lock-step: anything exempted here must be exact-pinned.
exclude-newer-package = { litfetch = "0 days", litdown = "0 days", pubmed-proto = "0 days", clinvar-proto = "0 days", postern = "0 days", anchorite = "0 days" }

[dependency-groups]
screen = ["pyyaml"]
# PR review screenshot upload (tools/screenshot/upload.py): the GCS client, driven by the
# developer's own gcloud ADC.
screenshot = ["google-cloud-storage"]
# litcache runtime (litcache/), one clause per dep: google-cloud-storage — GCS
# Storage backend; the cloudsql group (connector + pg8000, IAM auth) — the crosswalk
# mint's Cloud SQL access, shared with auth/migrate; docling-core —
# non-OA Docling-json→markdown; pypdfium2 — pdf char-addressability probe;
# litfetch — OA fetch + raw licence; litdown — JATS/Elsevier XML→markdown from
# bytes (the OA branch calls it directly on the fetched bytes, added in 0.4);
# pubmed_proto — bibliographic metadata.pb; httpx — async HTTP client for the efetch
# and Crossref metadata-resolution calls; anthropic — the PDF LLM-OCR converter
# (produce.py's pdf-without-xml branch); pillow — pdf.py encodes its page rasters
# through it; google-cloud-tasks — enqueue.py creates the convert worker's
# task. litfetch/litdown/pubmed_proto are exact-pinned
# because they're age-gate-exempt ([tool.uv] above) — the pin makes a new release an
# explicit choice, not a re-lock side effect. Runtime group, not a CLI.
litcache = ["google-cloud-storage", "google-cloud-tasks", "httpx", "docling-core", "pypdfium2", "pillow", "protovalidate", "anthropic", "litfetch==0.2.0", "litdown==0.5.0", "pubmed_proto==0.1.0", { include-group = "cloudsql" }]
# Schema codegen (tools/schema/regen.py): grpcio-tools' protoc emits the committed Python stubs
# from the buf-exported protos. Its bundled protoc pins the generated-code version to the
# protobuf 6.x runtime (buf's own protoc is too new); TypeScript uses a local protoc-gen-es.
protoc = ["grpcio-tools"]
# mypy-protobuf supplies protoc-gen-mypy_grpc for the _pb2_grpc.pyi protoc does not emit; it is
# resolved off PATH, never imported. Its types-protobuf dep installs as `google-stubs`, which pyright
# resolves ahead of the pinned protobuf wheel's own .pyi — so `lint` takes `protoc` alone. clinvar_proto
# is imported: regen copies the ClinVar record's .proto out of the wheel into the buf module, so the
# same pin that fixes the runtime stubs fixes the schema they are generated against.
codegen = ["mypy-protobuf", "clinvar_proto==0.1.0", { include-group = "protoc" }]
# Seed-ingestion runtime (litcache/ingest_beam.py): the per-paper core wrapped in
# Beam/Dataflow. apache-beam[gcp] pins google-cloud-storage to the 2.x line its
# gcsio requires (co-resolves with litcache in the worker).
dataflow = ["apache-beam[gcp]", { include-group = "litcache" }]
# Cloud SQL client: the connector + pg8000 (IAM auth, no stored password, mirroring
# infra/sql.py), shared by the auth service's cloudsql backend and the migrate runner.
cloudsql = ["cloud-sql-python-connector", "pg8000"]
# auth service (themis/services/auth): the grpc.aio server + generated stubs + the Cloud
# SQL backend. grpcio is the runtime; grpcio-health-checking serves grpc.health.v1;
# protobuf backs the generated messages (json_format seeds the fixture backend).
auth = ["grpcio", "grpcio-health-checking", "protobuf", { include-group = "cloudsql" }]
# migration runner (themis/migrate): applies the committed SQL migrations at deploy.
migrate = [{ include-group = "cloudsql" }]
# service-to-service client (themis/clients): grpcio is the channel + generated stub;
# google-auth mints the caller SA's ID token from the metadata server and requests is its
# HTTP transport; protobuf backs the generated messages.
session = ["grpcio", "google-auth", "requests", "protobuf"]
# store service (themis/services/store): the grpc.aio server + generated stubs + the GCS
# backend (google-cloud-storage) for the working document and workspace archive. Includes the
# session client — every request is authorized through auth before it touches storage.
store = ["grpcio", "grpcio-health-checking", "protobuf", "google-cloud-storage", { include-group = "session" }]
# hello service (themis/services/hello): the sandbox forward leg's session-token-authed test
# consumer. grpc.aio server + generated stubs; includes the session client — every request is
# authorized through auth. No storage backend of its own.
hello = ["grpcio", "grpcio-health-checking", "protobuf", { include-group = "session" }]
# evidence service (themis/services/evidence): one image serving every data-plane evidence interface —
# literature (litcache resolution + quote location) and the database-backed interfaces SVCv4 classification reaches.
# grpc.aio server + generated stubs. Includes the session client: every interface authorizes through
# auth — literature only where it enqueues a conversion, the shared corpus it reads being unscoped.
# httpx is the shared async transport for every live upstream call, Europe PMC + LitVar2 among them;
# defusedxml parses ClinVar's VCV XML (stdlib ElementTree stays exposed to entity expansion, and the
# payload comes off an unauthenticated public endpoint). google-cloud-storage reaches the litcache
# fulltext bucket and the gene-disease reference dumps; pubmed_proto reads the metadata.pb title. The
# litcache_pb2 stubs pull the vendored buf/validate stubs (shipped in the image), which need only
# protobuf at runtime; no protovalidate, no conversion/fetch deps — the read path never validates or
# converts. anchorite locates a verbatim quote to markdown offsets. The cloudsql group (connector +
# pg8000, IAM auth) reads the litcache crosswalk, which is how a PMID reaches a doc_id. pubmed_proto
# and anchorite are exact-pinned because they are age-gate-exempt ([tool.uv] above). clinvar_proto, exempt
# and pinned likewise, owns ClinVar's VCV record type and the converter that builds one from efetch's
# XML: the clinvar contract's stubs import the wheel's message and the adapter calls its converter, so
# the record the DescribeVariant reply carries whole is the wheel's rather than this tree's reading.
# google-cloud-tasks is the one write: MaybeIngestPapers enqueues a `/convert` task for each PENDING
# paper it resolved, through litcache/enqueue.py behind the literature backend port.
evidence = ["grpcio", "grpcio-health-checking", "protobuf", "httpx", "defusedxml", "google-cloud-storage", "google-cloud-tasks", "pubmed_proto==0.1.0", "clinvar_proto==0.1.0", "anchorite==0.5.1", { include-group = "session" }, { include-group = "cloudsql" }]
# full-text convert worker (themis/services/convert_worker): the pushed Cloud Task /convert handler that
# calls litcache.produce.produce_full_text off the read request path. aiohttp is the HTTP server (as in
# the dispatcher); the rest is produce's own closure — litfetch fetches the OA source, litdown converts
# XML, anthropic transcribes a PDF, and the storage/protobuf pair reads and commits the manifest.
# pypdfium2 rasterizes the pages the model transcribes from, and pillow encodes them (pypdfium2
# renders into a Pillow image). google-auth mints the Google identity token the Anthropic SDK
# exchanges for a federation token, and requests is its transport. Deliberately not the `litcache`
# group: docling-core and the cloudsql connector belong to paths this worker never takes, and carry
# pandas and numpy behind them.
convert_worker = [
    "aiohttp",
    "google-auth",
    "google-cloud-storage",
    "protobuf",
    "requests",
    "litfetch==0.2.0",
    "litdown==0.5.0",
    "pubmed_proto==0.1.0",
    "anthropic",
    "pypdfium2",
    "pillow",
]
# dispatcher service (themis/services/dispatcher): the webhook receiver that drains the work queue
# and spawns sandboxes. aiohttp is the HMAC-webhook server + the Cloud Run Admin API client; anthropic
# is the SDK the work queue is driven through; google-cloud-kms derives the per-session token
# (google-crc32c verifies its response integrity); google-auth mints the Cloud Run Admin API token for
# the jobs.run spawn. Also covers the shared themis/clients/work_queue and themis/clients/auth.
dispatcher = ["aiohttp", "anthropic", "google-cloud-kms", "google-crc32c", "google-auth", "standardwebhooks"]
# sandbox worker (themis/services/sandbox_worker): the trusted EnvironmentWorker loop over postern.
# postern[grpc] is the bubblewrap sandbox + the gRPC hatch; anthropic is the managed-agents SDK the
# worker loop runs; anyio off-loads the synchronous Sandbox.run_python. Includes the session client for
# id_token + the store stubs (the worker's own checkpoint client).
sandbox_worker = ["postern[grpc]==0.4.0", "anthropic", "anyio", { include-group = "session" }]
# sandbox guest rootfs (themis/services/sandbox_worker/guest, bound as /opt/guest-root): the isolated
# interpreter world untrusted model code runs in. grpcio is the channel the guest dials the hatch over;
# protobuf backs the shipped hello stubs. Locked rather than a floating pip install so the guest inherits the
# age gate and stays version-aligned with the worker's own grpcio/protobuf.
guest = ["grpcio", "protobuf"]
# classifier evaluation CLI (themis/classifier_eval): anthropic reads the session event logs and the
# resolved agent each case ran; google-cloud-storage reads the store's working-document and workspace
# buckets; google-auth is the ADC preflight resolves; pyyaml reads the checked-out agent config
# preflight compares the deployed agent against. requests carries each round's call to the deployed
# web app: analyses are created through it, so the rows are the app's to write.
# protobuf + pubmed_proto + cloudsql: the supplied-papers check reads litcache manifests and the
# crosswalk (themis/classifier_eval/literature.py).
classifier_eval = ["anthropic", "google-cloud-storage", "google-auth", "requests", "pyyaml", "protobuf", "pubmed_proto==0.1.0", { include-group = "cloudsql" }]
# testcontainers: the crosswalk tests mint against a throwaway Postgres (never a
# mock — the UNIQUE-in-one-txn semantics are the thing under test), gated on a
# reachable Docker daemon.
test = ["pytest", "pyyaml", "testcontainers[postgres]", { include-group = "litcache" }, { include-group = "dataflow" }, { include-group = "auth" }, { include-group = "session" }, { include-group = "store" }, { include-group = "hello" }, { include-group = "dispatcher" }, { include-group = "sandbox_worker" }, { include-group = "evidence" }, { include-group = "screenshot" }, { include-group = "convert_worker" }, { include-group = "classifier_eval" }]
# Pulumi program deps (infra/). Also the venv Pulumi runs the program in
# (infra/Pulumi.yaml -> virtualenv ../.venv): `uv sync --group infra`.
infra = ["pulumi", "pulumi-gcp"]
# pre-commit: the lint CI job runs `pre-commit run --all-files`, so the hook
# config is the single source of truth for static checks — CI can't drift from
# what runs locally. lxml-stubs: litcache/metadata.py parses efetch XML via lxml (a
# pubmed_proto dep, unstubbed); pyright needs the stubs to resolve `lxml.etree`.
lint = ["pre-commit", "ruff", "pyright", "pytest", "pyyaml", "types-PyYAML", "lxml-stubs", "testcontainers[postgres]", { include-group = "protoc" }, { include-group = "infra" }, { include-group = "litcache" }, { include-group = "dataflow" }, { include-group = "auth" }, { include-group = "migrate" }, { include-group = "session" }, { include-group = "store" }, { include-group = "hello" }, { include-group = "dispatcher" }, { include-group = "sandbox_worker" }, { include-group = "evidence" }, { include-group = "screenshot" }, { include-group = "convert_worker" }, { include-group = "classifier_eval" }]

[tool.pytest.ini_options]
# schema/tests holds the proto compat-gate tests (buf breaking, baseline helpers).
testpaths = ["tests", "schema/tests", "themis/common/tests", "themis/services/auth/tests", "themis/migrate/tests", "themis/clients/auth/tests", "themis/clients/work_queue/tests", "themis/services/store/tests", "themis/services/hello/tests", "themis/services/dispatcher/tests", "themis/services/sandbox_worker/tests", "themis/services/evidence/tests", "themis/services/evidence/literature/tests", "themis/services/convert_worker/tests", "themis/document_linter/tests", "themis/testing/tests", "themis/svcv4/tests", "tools/svcv4-oracle", "themis/services/evidence/upstreams/tests", "themis/services/evidence/variant/tests", "themis/services/evidence/vep/tests", "themis/services/evidence/gnomad/tests", "themis/services/evidence/clinvar/tests", "themis/services/evidence/gene_disease/tests", "themis/services/evidence/transcript/tests", "themis/services/evidence/splice/tests", "themis/services/evidence/mavedb/tests", "themis/services/evidence/cspec/tests"]
markers = ["sandbox: needs a real bubblewrap launch (Linux only)"]
# An unregistered marker is a collection error, not a warning: a misspelled `sandbox` would
# otherwise deselect the test from both CI jobs, which reports as a pass. Has to be the ini option —
# `--strict-markers` only rewrites ini values, and `addopts` is parsed after those are read.
strict_markers = true
# An unrecognised key in this table is an error, not a warning: a misspelled option would
# otherwise leave the guard it was meant to set switched off, silently.
strict_config = true
# "." for repo-root packages (themis, tools).
pythonpath = ["."]
consider_namespace_packages = true

[tool.ruff]
line-length = 120
target-version = "py313"

# Generated code (buf generate; tools/schema/regen.py): committed, never hand-edited,
# so linting it is noise (buf plugin output is not lint-clean) and a reformat would
# fight the freshness gate. `themis/rpc`, `themis/evidence/models`, `themis/litcache/models`,
# `themis/workbench/models` and `themis/workbench/rpc` are the generated proto/gRPC stubs; `buf` is the vendored buf.validate stub (protovalidate options). The pre-commit
# ruff hooks pass --force-exclude, so this holds even when pre-commit hands ruff explicit paths.
extend-exclude = ["themis/evidence/models", "themis/litcache/models", "themis/workbench/models", "themis/workbench/rpc", "themis/rpc", "themis/services/sandbox_worker/_generated.py", "buf"]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = [
    "A", "B", "C", "D", "E", "F", "G", "I", "N", "Q", "S", "W",
    "ANN", "ARG", "BLE", "COM", "DTZ", "ERA", "EXE", "ICN", "ISC",
    "PGH", "PIE", "PL", "PT", "PYI", "RET", "RSE", "RUF",
    "SIM", "SLF", "T10", "TID", "UP", "YTT",
]

fixable = ["ALL"]

ignore = [
    "COM812",  # Trailing comma prohibited
    # D1xx — docstring *presence*. We enforce docstring format (D2/D3/D4)
    # if a docstring exists, but don't require one on every public symbol.
    # The general-review prompt nudges authors toward docstrings on
    # public APIs as a soft policy.
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D105",
    "D106",
    "D107",
    "PLR0913", # Too many arguments in function definition
    "PLR2004", # Magic value used in comparison
    "Q000",    # Single quotes found but double quotes preferred
    "Q003",    # Change outer quotes (conflicts with single-quote formatter)
]

[tool.ruff.lint.per-file-ignores]
# One block for every tests tree under `themis/`, rather than one per directory: `*` crosses `/` in
# ruff's patterns, and a per-directory list meant a new interface's tests failed lint until someone
# remembered to add it. The rules are the same everywhere — pytest's bare `assert`, reaching into
# module privates, and fixture tokens/keys that are not secrets.
"themis/**/tests/**" = [
    "S101",   # asserts are the standard pytest idiom
    "SLF001", # tests legitimately reach into module privates
    "S105",   # fixture env keys / session tokens are not secrets
    "S106",   # fixture credentials passed as kwargs are not secrets
]
# Where a test stands in for something the production code calls, it keeps that thing's signature and
# reads only part of it. Scoped to the evidence tests, which stand in for a port and for the session
# resolver every interface authorizes through: everywhere else an unused argument is still one.
"themis/services/evidence/**/tests/**" = [
    "ARG001", # a stand-in session resolver takes the token whether or not the case turns on it
    "ARG002", # a fake backend keeps the port's signature even where a param is unused
]
"tests/**" = [
    "S101",   # asserts are the standard pytest idiom
    "SLF001", # tests legitimately reach into module privates
    "S106",   # throwaway test-container credentials are not secrets
]
"schema/tests/**" = [
    "S101",   # asserts are the standard pytest idiom
    "SLF001", # tests legitimately reach into module privates
]
"tools/svcv4-oracle/test_*.py" = [
    "S101",   # asserts are the standard pytest idiom
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["themis_infra", "themis"]

# Complexity thresholds: roughly double the ruff defaults so the checks
# fire on genuinely sprawling code but not on everyday parsers and
# dispatcher functions.
[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.ruff.lint.pylint]
max-args = 10
max-branches = 20
max-returns = 10
max-statements = 80
max-locals = 25

[tool.pyright]
pythonVersion = "3.13"
include = ["tools", "tests", "schema/tests", "infra", "themis"]
# Re-list pyright's auto-excludes, which specifying `exclude` would otherwise drop. The committed
# buf output stays *in*: `exclude` drops a file from analysis entirely, so a servicer's generated
# base becomes invisible and `reportImplicitOverride` silently passes on the case it exists for.
exclude = ["**/node_modules", "**/__pycache__", "**/.*"]
extraPaths = ["infra"]
typeCheckingMode = "standard"
# An override that does not say so is one a base-method rename or removal leaves behind silently,
# implementing nothing. Repo-wide rather than scoped: every port, fixture backend and servicer here
# overrides an abc the same way, and a rule that holds in one directory is one a new implementation
# elsewhere quietly escapes.
reportImplicitOverride = "error"

# Three upstream codegen defects. `ignore` suppresses their reporting while leaving the files
# analysed, which `exclude` would not: the servicer bases have to stay visible for the rule above.
# The committed `.pyi` beside each generated `.py` stays checked — those are the files importers,
# and the override rule, actually read.
# `_pb2.py` — assigns `FileDescriptor._loaded_options`, which protobuf's own bundled stubs do not
# declare. `types-protobuf` declares it, but installs as `google-stubs` and would shadow the pinned
# protobuf wheel's types repo-wide, so `lint` deliberately does not carry it.
# `_pb2_grpc.py` — the plugin emits a channel-less "simple stubs" class calling
# `grpc.experimental.unary_unary` without importing it. Nothing here calls that class, and grpc holds
# the AttributeError to be the intended opt-in gate, so it will not be fixed
# (https://github.com/grpc/grpc/issues/39555). The `.pyi` beside it stays checked — that is the file
# the servicer base and stub types come from.
# `sandbox_options_pb2.pyi` — protoc's --pyi_out annotates a top-level extension's field-number
# constant `ClassVar[int]` at module scope, where `ClassVar` is not valid
# (https://github.com/protocolbuffers/protobuf/issues/29221).
ignore = ["**/*_pb2.py", "**/*_pb2_grpc.py", "themis/rpc/sandbox_options_pb2.pyi"]
