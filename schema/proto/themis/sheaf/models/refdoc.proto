// The sheaf ref document: one repository's whole mutable state (design: docs/design/sheaf.md).
// A durable, authored contract: binary proto at rest, gated additively. This proto is the source of
// truth; the committed themis/sheaf/models/refdoc_pb2 stubs are generated from it.
//
// Every accepted transition replaces this document under a compare-and-swap, so a publish is a
// read-modify-write and must go through the parsed message rather than a projection of it: a field
// this build does not model has to survive being read and written back (proto.md, "Read-modify-write
// and integrity"). That is why the encoding is binary proto and why the document carries no version.
//
// Reconstructing a repository requires this document and the packs it names, and nothing else.
// `RefDoc` is sealed — every field number above HEAD's is reserved, so it cannot gain a field —
// and anything a later need turns up goes in a separate object no build is required to read.
// Unknown-field preservation and the collector's refusal on unmodelled state remain, so that a
// document from a build that broke the seal is handled safely rather than silently.

syntax = "proto3";

package themis.sheaf.models.refdoc;

// What a ref points at.
//
// Git lets any ref be symbolic, not only HEAD, so the two arms are the whole domain and neither can
// be added later without reshaping a frozen field. A message rather than a bare string as a map
// value for the same reason: the value may gain fields additively, while the map's key keeps a
// duplicate ref name unrepresentable.
message RefTarget {
  oneof target {
    // The object named. Validated in code against git's own rules rather than here: an id this
    // accepts and git rejects wedges the repository, and the rule set is git's.
    string oid = 1;

    // The ref named, for a symbolic ref. It need not currently resolve: a HEAD on a branch with no
    // commits is git's state after `init`, and protocol v2 carries it so a clone of an empty
    // repository checks out the intended branch name rather than the server's default.
    string ref = 2;
  }
}

// Refs, the pack manifest, and where a clone starts.
message RefDoc {
  // Ref name to target, fully qualified under `refs/`.
  map<string, RefTarget> refs = 1;

  // Every packfile the object database is made of, by content hash. A set: order carries nothing
  // and duplicates mean nothing, because a hash determines its bytes and no pack depends on
  // another. Written sorted so identical state serialises identically.
  //
  // It must name every pack needed to reach the refs and HEAD. Composability rules out conflicts
  // between packs, so coverage is the only thing left that can be violated, and violating it is
  // what destroys a repository.
  repeated string packs = 2;

  // Where a clone should start. Always set on a stored document.
  //
  // Not an entry in `refs`, though it shares their type: HEAD is outside the `refs/` namespace that
  // every ref enumeration assumes, and git's ordinary ref update dereferences a symref — so writing
  // it through the map would silently overwrite whichever branch it points at.
  //
  // The highest field number deliberately. Proto emits fields in number order, so a truncated
  // document loses this before it loses the manifest, and a message field carries presence — which
  // makes "no HEAD" the mark of a document this code did not write, and stops an empty encoding
  // parsing as a repository whose history needs no packs.
  RefTarget head = 3;

  // Sealed: no field may be added above HEAD, or the truncation argument above stops holding. New
  // state goes in a separate object; a per-ref attribute goes on `RefTarget`.
  reserved 4 to max;
}
