// The vocabularies an SVCv4 answer about a variant is stated in: the mode of inheritance of the
// entity it is classified against, the class it lands in, each evidence code's status, and how open
// a call is. One vocabulary per concept, whether the answer was reached by a point tally, stated by a
// curator, or imposed by the gene-disease-validity gate: two sides that answer in different
// vocabularies cannot be compared, and a run's answer is read against a curator's
// (docs/design/curation-surface.md).
//
// The mode of inheritance is modelled from:
//   ClinGen's svcv4-model `MOI` (github.com/clingen-data-model/svcv4-model, src/svcv4_model/case.py
//     at ef66faff), which names the same five modes.
//
// The class is modelled from:
//   SVCv4 SM1's ordered classes, which `themis.svcv4.reference` loads as `Reference.class_order`.
//   SVCv4 SM18's gate, whose two terminal levels end in a result string rather than a class —
//     `Reference.gate[…].result`, returned as `scoring.GateOutcome.final_class`.
//
// EVALUATION ONLY, AGAINST A DRAFT STANDARD. SVCv4 is a July 2026 pilot: its point values,
// thresholds and code names may change before publication. Nothing here is validated for clinical or
// diagnostic use, and a classification composed under it is not a clinical variant classification.

syntax = "proto3";

package themis.svcv4.models;

// The mode of inheritance of the Monogenic disease entity a variant is classified against, in the
// framework's own terms. The mode is part of the entity: a gene and disease curated under two modes
// are two entities, classified separately. The framework's rules route on it, and X-linked dominant
// and recessive route apart (SM3's DAFT tables for female and combined-sex frequencies, SM4's tables
// for an affected XX proband), so there is no unqualified X-linked member.
//
// A curated source's own mode term is not this vocabulary and is never mapped onto it by code: which
// source record describes the entity being classified is the analyst's judgement
// (docs/design/evidence-interfaces.md).
enum ModeOfInheritance {
  // No mode stated; refused wherever a mode is required.
  MODE_OF_INHERITANCE_UNSPECIFIED = 0;
  MODE_OF_INHERITANCE_AUTOSOMAL_DOMINANT = 1;
  MODE_OF_INHERITANCE_AUTOSOMAL_RECESSIVE = 2;
  MODE_OF_INHERITANCE_SEMIDOMINANT = 3;
  MODE_OF_INHERITANCE_X_LINKED_DOMINANT = 4;
  MODE_OF_INHERITANCE_X_LINKED_RECESSIVE = 5;
}

// Everything a classification can come out as: the five ordered classes, the two outcomes the
// gene-disease-validity gate substitutes for a class, and "none established".
enum Classification {
  CLASSIFICATION_UNSPECIFIED = 0;
  CLASSIFICATION_PATHOGENIC = 1;
  CLASSIFICATION_LIKELY_PATHOGENIC = 2;
  CLASSIFICATION_VUS = 3;
  CLASSIFICATION_LIKELY_BENIGN = 4;
  CLASSIFICATION_BENIGN = 5;
  // No class established: a curator's own finding, or a run's where the values an open judgement
  // input leaves standing yield different classes. Not an unanswered field, which reads as
  // UNSPECIFIED, and not a gate outcome.
  CLASSIFICATION_NOT_ESTABLISHED = 6;
  // The gate's result for a gene-disease relationship below Limited validity ("Variant in Gene of
  // Uncertain Significance"). Terminal: it overrides the computed class in either direction.
  CLASSIFICATION_VARIANT_IN_GENE_OF_UNCERTAIN_SIGNIFICANCE = 7;
  // The gate's result for a Disputed or Refuted relationship ("Do not report"). Terminal likewise.
  CLASSIFICATION_DO_NOT_REPORT = 8;
}

// Whether an evidence code was scored, and if not, which kind of not: a curator's answer to a
// workflow and a run's to a code state it alike, and a run is judged on matching it. The three are
// different findings. `NOT_APPLICABLE` is the framework's own precondition barring the code;
// `NO_DATA` is a code that applies with nothing to determine it on. A code reading zero is SCORED:
// the calculator carries a zero option, and assessing to it is a judgement rather than an absence.
enum AssessmentStatus {
  ASSESSMENT_STATUS_UNSPECIFIED = 0;
  ASSESSMENT_STATUS_SCORED = 1;
  ASSESSMENT_STATUS_NOT_APPLICABLE = 2;
  ASSESSMENT_STATUS_NO_DATA = 3;
}

// How open whoever made a call considers it, a curator or a run. A reader treats a divergence inside
// the stated envelope as that side's own uncertainty rather than as a defect.
enum Confidence {
  CONFIDENCE_UNSPECIFIED = 0;
  CONFIDENCE_SETTLED = 1;
  CONFIDENCE_LEANING = 2;
  CONFIDENCE_OPEN = 3;
}
