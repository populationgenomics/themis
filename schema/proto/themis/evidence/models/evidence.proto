// The value types the evidence interfaces share, and the vocabulary anything speaking about a variant
// routes on: where a fact came from, the molecular consequence, and the genomic interval a fact is
// placed on. They live here rather than in one contract because several exchange them — the window a
// ClinVar search ran on and one exon of a transcript are the same kind of interval, every rpc stamps
// its own provenance, and a retrieved routing and a curator's stated one are comparable only if they
// are the same vocabulary. The framework's mode of inheritance is not here but in
// themis/svcv4/models/svcv4.proto.
//
// Modelled from:
//   SVCv4 variant-type workflows (docs/design/evidence-interfaces.md § "place the variant, and route
//     it to a decision tree"): `Consequence` is the partition its decision trees select on; VEP's
//     term is re-encoded onto it.
//   This interface's own design: `Provenance`, `GenomicSpan`.
//
// EVALUATION ONLY, AGAINST A DRAFT STANDARD. SVCv4 is a July 2026 pilot: its point values,
// thresholds and code names may change before publication, so the SVCv4 codes named throughout
// these comments are provisional. Nothing here is validated for clinical or diagnostic use, and a
// classification composed from these facts is not a clinical variant classification.

syntax = "proto3";

package themis.evidence.models;

import "google/protobuf/timestamp.proto";

// The SVCv4 routing key: molecular consequence selects the variant-type decision tree. Absent =
// nothing has stated it yet, whether by resolving the variant (that is what Variant.Normalize is
// for) or by an analyst saying which class they take it to be.
enum Consequence {
  CONSEQUENCE_UNSPECIFIED = 0;
  CONSEQUENCE_MISSENSE = 1;
  CONSEQUENCE_NONSENSE = 2;
  CONSEQUENCE_FRAMESHIFT = 3;
  CONSEQUENCE_CANONICAL_SPLICE = 4;
  CONSEQUENCE_INTRONIC = 5;
  CONSEQUENCE_SYNONYMOUS = 6;
  CONSEQUENCE_INFRAME_INDEL = 7;
  CONSEQUENCE_START_LOST = 8;
  CONSEQUENCE_STOP_LOST = 9;
  CONSEQUENCE_EXON_DELETION = 10;
  CONSEQUENCE_EXON_DUPLICATION = 11;
  CONSEQUENCE_NON_CODING = 12;
}

// Where a fact came from, so every claim is reproducible without a mirror (PRODUCT §6). For a live
// query, `retrieved_at` stamps the as-of time; for a reference table, `dataset_versions` carries its
// refresh date.
message Provenance {
  string source = 1;           // e.g. "gnomAD GraphQL", "Ensembl VEP REST", "ClinGen dosage"
  // One element per release the fact rests on — never a subset. A transcript-annotation release
  // ("VEP 116", "GRCh38") and an expression one ("gtex_v10", "GENCODE v39") name different
  // transcript sets, so a caller comparing facts across two of these rpcs is comparing across
  // annotation releases; unstated, a version disagreement reads as a disagreement about the gene.
  repeated string dataset_versions = 2;
  // the exact request issued (URL / GraphQL / id), for replay; credentials (an API key, a token)
  // are stripped — this field is returned to callers and read by the model
  string query = 3;
  google.protobuf.Timestamp retrieved_at = 4;
}

// A genomic interval, ascending on both strands (1-based, both ends inclusive).
message GenomicSpan {
  int64 start = 1;
  int64 end = 2;
}
