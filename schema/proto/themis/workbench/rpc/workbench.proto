// The `workbench` service: the browser↔BFF contract (proto.md, serialization posture bucket 2).
// The BFF's Connect handler serves it and the browser's generated client calls it, both over the
// Connect protocol as proto3-JSON. Unlike the themis/rpc/ services this one has no Python
// implementation — it is served by the web tier, in TypeScript.
//
// Most message shapes live in the workbench models proto and are referenced fully-qualified from
// here. The split is the models file's history, not a rule: its request/reply envelopes predate this
// service and the compat gate forbids moving them. The workspace-repository requests are declared
// here instead, because this file's messages may be deleted when their rpcs retire and the models
// file's may not. The paper read methods reuse the literature proto's messages directly, and the
// workspace-repository methods reuse the sheaf proto's replies: each of those surfaces is itself the
// BFF↔frontend view model, so there is no second envelope to define.
syntax = "proto3";

package themis.workbench.rpc;

import "buf/validate/validate.proto";
import "themis/rpc/literature.proto";
import "themis/rpc/sheaf.proto";
import "themis/workbench/models/workbench.proto";

// The Analysis whose workspace repository's ref document to read, for the browser's own copy of the
// repository. The reply is the sheaf service's snapshot as it stands.
message ReadWorkspaceRefDocRequest {
  string analysis_id = 1 [(buf.validate.field).string.min_len = 1];
}

// The packs of the Analysis's workspace repository the browser's copy lacks, by the ids the current
// ref document lists; refused as themis.rpc.sheaf.SignPackUrlsRequest states. A copy lacking more
// packs than one call may name asks in batches.
message SignWorkspacePackUrlsRequest {
  string analysis_id = 1 [(buf.validate.field).string.min_len = 1];
  repeated string pack_ids = 2 [
    (buf.validate.field).repeated.min_items = 1,
    (buf.validate.field).repeated.max_items = 256,
    (buf.validate.field).repeated.unique = true,
    (buf.validate.field).repeated.items.string.pattern = "^[0-9a-f]{64}$"
  ];
}

// A commit the browser built, published as one message: the BFF streams it into the sheaf service's
// Publish, since a browser cannot stream a request. A curator's commit always writes new objects, so
// it carries exactly one pack, and the bytes must be the pack the intent declares.
message PublishWorkspaceRequest {
  option (buf.validate.message).cel = {
    id: "publish_workspace.pack_bytes_match_intent"
    message: "pack_bytes must carry exactly the packs the intent declares"
    expression: "size(this.pack_bytes) == size(this.intent.packs)"
  };
  string analysis_id = 1 [(buf.validate.field).string.min_len = 1];
  // The intent exactly as themis.rpc.sheaf.Publish takes it, built against the snapshot the browser
  // read.
  themis.rpc.sheaf.PublishIntent intent = 2 [(buf.validate.field).required = true];
  // The bytes of the pack `intent.packs` declares, whole. The service refuses bytes that do not match
  // the declared size and hash.
  repeated bytes pack_bytes = 3 [
    (buf.validate.field).repeated.min_items = 1,
    (buf.validate.field).repeated.max_items = 1
  ];
}

// The workbench surface a curator reaches. Every method is scoped to the caller the BFF verified
// from the request's IAP assertion, so no method takes a user identity: it is never the client's to
// name. A Project or Analysis outside the caller's membership answers NOT_FOUND, never a
// distinguishable PERMISSION_DENIED — a caller must not learn it exists.
//
// Every method is a POST carrying the request message as its body: no method declares an
// idempotency level, so none answers a GET.
service Workbench {
  // The Projects the caller belongs to — the app-bar's Project selector and the scope for
  // create/list.
  rpc ListProjects(themis.workbench.models.workbench.ListProjectsRequest) returns (themis.workbench.models.workbench.ListProjectsResponse);

  // Create an Analysis in the named Project and kick off its run. Mints an id and a backend
  // session, so it is not idempotent and must not be auto-retried by a caller.
  rpc CreateAnalysis(themis.workbench.models.workbench.CreateAnalysisRequest) returns (themis.workbench.models.workbench.CreateAnalysisResponse);

  // The Project's prior Analyses, newest first — what the session switcher browses.
  rpc ListAnalyses(themis.workbench.models.workbench.ListAnalysesRequest) returns (themis.workbench.models.workbench.ListAnalysesResponse);

  // One liveness tick: the whole projected event stream and the workspace branch's tip.
  rpc Poll(themis.workbench.models.workbench.PollRequest) returns (themis.workbench.models.workbench.PollResponse);

  // One spawned thread's own conversation — its instruction, narration and tool calls, in the same
  // projection the coordinator's stream is in. A read: it advances nothing.
  rpc GetThread(themis.workbench.models.workbench.ThreadRequest) returns (themis.workbench.models.workbench.ThreadResponse);

  // Append a curator turn to a running Analysis's session — the same `user.message` send that seeds
  // a new one.
  rpc Steer(themis.workbench.models.workbench.SteerRequest) returns (themis.workbench.models.workbench.SteerResponse);

  // Halt a running Analysis's current step: the in-flight tool call is closed with an error result
  // and the session goes idle, ready for the curator's next turn.
  rpc Interrupt(themis.workbench.models.workbench.InterruptRequest) returns (themis.workbench.models.workbench.InterruptResponse);

  // The Analysis's workspace repository's ref document and generation, which the browser's copy of
  // the repository hydrates from (docs/design/workbench-workspace.md). Relays the sheaf service's
  // ReadRefDoc; an unset document is a repository that does not exist yet. The service's DATA_LOSS, a
  // stored document it cannot parse, reaches the caller as DATA_LOSS, which it must not retry; every
  // other upstream failure is masked as INTERNAL.
  rpc ReadWorkspaceRefDoc(ReadWorkspaceRefDocRequest) returns (themis.rpc.sheaf.RefDocSnapshot);

  // Signed download URLs and sizes for packs the Analysis's ref document lists. Relays the sheaf
  // service's SignPackUrls; each URL is a bearer capability until it expires. A pack the current
  // document no longer lists, the service's NOT_FOUND, reaches the caller as FAILED_PRECONDITION,
  // because NOT_FOUND on this surface means an Analysis outside the caller's membership: read the ref
  // document again and ask for what it lists. The service's DATA_LOSS, a listed pack the store does
  // not hold or a stored document it cannot parse, reaches the caller as DATA_LOSS, which it must not
  // retry. Every other upstream failure is masked as INTERNAL.
  rpc SignWorkspacePackUrls(SignWorkspacePackUrlsRequest) returns (themis.rpc.sheaf.SignPackUrlsResponse);

  // Publish a commit the browser built on a revision of the Analysis's workspace. Relays the sheaf
  // service's Publish. Five of its answers reach the caller as the same codes with the same meaning,
  // and every other upstream failure is masked as INTERNAL:
  //   ABORTED: an unrelated publish landed first; rebuild the reflog entry and the pack against the
  //     new document and publish again.
  //   FAILED_PRECONDITION: the branch moved; if the pending commit is reachable from the new tip it
  //     landed and only the response was lost, else apply the edit on the new tip and publish again.
  //   RESOURCE_EXHAUSTED: the publish is over one of the service's ceilings; not retried, and the
  //     curator is told the edit was not saved.
  //   INVALID_ARGUMENT: the intent or the pack is malformed; not retried, and reported the same way.
  //     It is relayed because the intent and the pack are the browser's own bytes, forwarded as sent;
  //     the BFF always names a session, so the service's refusal of a call naming none cannot arise.
  //   DATA_LOSS: the stored document does not parse; the repository is damaged. Not retried, and the
  //     curator is told the workspace is damaged and the edit was not saved.
  // A retry of a publish whose response was lost succeeds while the branch still holds the publish's
  // commit as its tip.
  rpc PublishWorkspace(PublishWorkspaceRequest) returns (themis.rpc.sheaf.PublishResponse);

  // A corpus paper's representations, default, and files. IAP-only: a paper is a shared-corpus
  // resource, so this is not Project-scoped. NOT_FOUND for an unknown doc_id.
  rpc DescribePaper(themis.rpc.literature.DescribePaperRequest) returns (themis.rpc.literature.PaperInfo);

  // Locate a citation's quote within a representation: markdown offsets, a PDF region, or
  // not-located (a first-class outcome, distinct from a NOT_FOUND doc_id).
  rpc Locate(themis.rpc.literature.LocateRequest) returns (themis.rpc.literature.LocateResponse);
}
