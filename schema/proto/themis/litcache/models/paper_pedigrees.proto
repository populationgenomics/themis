// A paper's pedigrees, one grus set per figure read (docs/design/pedigree-extraction.md). Apart from pedigrees.proto
// so that only a reader of the record's bytes imports grus's schema (docs/design/proto.md).

syntax = "proto3";

package themis.litcache.models.pedigrees;

import "buf/validate/validate.proto";
import "grus/models/pedigree.proto";

// The grus set read from each figure whose answer was accepted, keyed by the figure's index in the figure set among the
// record's deps; an empty set when the figure held no pedigree. A figure that failed, or that was never read, has no
// entry. A record holds at least one: a reading where no figure's answer was accepted records nothing.
message PaperPedigrees {
  // Each accepted figure's set, by the figure's index.
  map<int32, grus.models.pedigree.PedigreeSet> figures = 1 [(buf.validate.field).map = {
    min_pairs: 1
    keys: {
      int32: {gte: 0}
    }
  }];
}
