// The litcache at-rest records: the manifest and its parts, and the bibliographic record beside it
// (structural model: docs/design/litcache-manifest.md).
// A durable, authored contract: binary proto at rest, gated additively. This proto is the source of
// truth; the committed themis/litcache/models/litcache_pb2 stubs are generated from it.

syntax = "proto3";

package themis.litcache.models.litcache;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "pubmed_proto/pubmed.proto";
import "themis/litcache/models/crossref.proto";
import "themis/litcache/models/openalex.proto";

enum SourceKind {
  SOURCE_KIND_UNSPECIFIED = 0;
  SOURCE_KIND_PMC_OA_S3 = 1;
  SOURCE_KIND_EUROPE_PMC = 2;
  SOURCE_KIND_ELSEVIER_OA = 3;
  SOURCE_KIND_BIORXIV = 4;
  SOURCE_KIND_UPLOAD = 5;
  SOURCE_KIND_SEED = 6;
  SOURCE_KIND_EUROPE_PMC_BOOKSHELF = 7;  // a Bookshelf chapter's BITS XML: Europe PMC's bookXML endpoint, by accession
  SOURCE_KIND_UNPAYWALL = 8;  // an open-access PDF at the best OA location Unpaywall lists for the DOI
}

// Scraped html is converted to xml upstream and enters as media_type xml under a distinct
// handle — html is not a media type here.
enum SourceFormat {
  SOURCE_FORMAT_UNSPECIFIED = 0;
  SOURCE_FORMAT_XML = 1;
  SOURCE_FORMAT_PDF = 2;
}

enum LicenceBasis {
  LICENCE_BASIS_UNSPECIFIED = 0;
  LICENCE_BASIS_ARTIFACT = 1;  // read from the fetched bytes (JATS <license>, Elsevier metadata)
  LICENCE_BASIS_ASSERTED = 2;  // bytes carry no licence: an access authority supplies it
}

enum Converter {
  CONVERTER_UNSPECIFIED = 0;
  CONVERTER_LITDOWN = 1;
  CONVERTER_DOCLING = 2;
  CONVERTER_LLM_OCR = 3;  // vision-model OCR of the pdf — preferred pdf route; docling is the fallback
}

message FreeToRead {}

message Licensed {
  string publisher = 1 [(buf.validate.field).string.min_len = 1];
}

message InstitutionCaptured {}

message UnknownAccess {}

// Access disposition of a lineage. A oneof so a publisher exists iff the variant is
// `licensed`: the access-iff-publisher invariant holds structurally, and protovalidate
// requires exactly one variant set.
message Access {
  oneof kind {
    option (buf.validate.oneof).required = true;

    FreeToRead free_to_read = 1;
    Licensed licensed = 2;
    InstitutionCaptured institution_captured = 3;
    UnknownAccess unknown = 4;
  }
}

// One fetched byte-set of a lineage. Content-addressed at sources/{handle}/{hex}.{ext};
// current = latest captured_at, never array order.
message Revision {
  string hash = 1;  // sha256 hex digest of the raw source bytes
  optional string origin_url = 2;  // external provenance (the OA fetch URL); omitted for seed/upload
  SourceKind kind = 3;
  google.protobuf.Timestamp captured_at = 4;
  optional bool has_text_layer = 5;  // pdf only: a recoverable text layer (enables quote->bbox)
}

// A primary-artifact lineage. `handle` is stable identity across updates; `revisions` is
// append-only, ordered by captured_at (current = latest). Licence and access are stable
// across a lineage's revisions; the converter is not part of the lineage (a rendering's Record
// records it).
message Source {
  string handle = 1;  // lineage identity, stable across updates: "pdf" | "xml"
  SourceFormat media_type = 2;
  string licence = 3;  // raw, as litfetch returned it (not an SPDX id)
  LicenceBasis licence_basis = 4;
  Access access = 5 [(buf.validate.field).required = true];
  repeated Revision revisions = 6 [(buf.validate.field).repeated.min_items = 1];
}

// The entry of the retired Manifest.renderings map. Retained because an at-rest message is never
// deleted; a rendering is a Record whose construction is a RenderingConstruction.
message Rendering {
  option (buf.validate.message).cel = {
    id: "rendering.model_iff_llm_ocr"
    message: "model must be set iff converter is CONVERTER_LLM_OCR (=3)"
    expression: "(this.converter == 3) == (this.model != '')"
  };

  string from_source = 1;  // Source.handle (an open id namespace, not an enum)
  string from_revision = 2;  // the Revision.hash this markdown was produced from
  Converter converter = 3;
  string converter_version = 4;  // the converter tool/harness version
  optional string model = 5;  // free-text LLM id (e.g. "claude-opus-4-8"); set iff converter is llm_ocr
  google.protobuf.Timestamp created_at = 6;
}

// How a rendering was made: markdown converted from the one source revision its Record names as a dep.
message RenderingConstruction {
  option (buf.validate.message).cel = {
    id: "rendering_construction.model_iff_llm_ocr"
    message: "model must be set iff converter is CONVERTER_LLM_OCR (=3)"
    expression: "(this.converter == 3) == (this.model != '')"
  };

  Converter converter = 1;
  string converter_version = 2;  // the converter tool/harness version
  optional string model = 3;  // free-text LLM id (e.g. "claude-opus-4-8"); set iff converter is llm_ocr
}

// One derived artifact of the paper: what it was made from and how. Keyed in Manifest.records by
// the sha256 hex of its bytes, which are content-addressed in the paper's directory at a path its
// construction kind determines. Bytes that are produced again keep their key; the record then
// holds the deps and construction of the run that most recently produced them.
message Record {
  // The hashes this artifact was derived from: a Revision.hash, or the key of another record. A
  // dep's role is read from what it resolves to — a source revision, or a record's construction kind.
  repeated string deps = 1;
  google.protobuf.Timestamp created_at = 2;  // when the run that produced these bytes most recently finished
  oneof construction {
    option (buf.validate.oneof).required = true;

    RenderingConstruction rendering = 10;
  }
}

message ExternalIds {
  optional string doi = 1;
  optional string pmid = 2;
  optional string pmcid = 3;
  optional string arxiv = 4;
  optional string biorxiv = 5;
  optional string bookid = 6;  // Bookshelf accession (NBK…), from a book record's BookDocument.article_id_list
}

message Equivalence {
  repeated string edges = 1;
  string canonical_doc_id = 2;
}

message Retraction {
  optional bool retracted = 1;
  optional string source = 2;
  optional string date = 3;
}

enum AssociatedFileRole {
  ASSOCIATED_FILE_ROLE_UNSPECIFIED = 0;
  ASSOCIATED_FILE_ROLE_FIGURE = 1;
  ASSOCIATED_FILE_ROLE_SUPPLEMENTARY = 2;
}

// One file the paper's publisher lists beside the article. Append-only: a reissued file is a new entry with the same
// name and a later captured_at, never an edit, so a record whose dep is the old hash keeps resolving.
message AssociatedFile {
  AssociatedFileRole role = 1;
  string name = 2;
  optional string source_url = 3;
  optional string path = 4;  // content-addressed bytes' location (supplementary/{hex}.{ext}); absent until fetched
  string hash = 5;  // sha256 hex digest of the fetched bytes, the stem of `path`; empty until fetched
  google.protobuf.Timestamp captured_at = 6;  // when these bytes were fetched; unset until fetched
}

message Manifest {
  // Every ref names a record this manifest holds.
  option (buf.validate.message).cel = {
    id: "manifest.refs_resolve"
    message: "every ref must name a key of records"
    expression: "this.refs.all(name, this.refs[name] in this.records)"
  };
  // Every record is derived from something the manifest holds: a source revision, or another record.
  option (buf.validate.message).cel = {
    id: "manifest.deps_resolve"
    message: "every record needs a dep, and each dep must be a held revision hash, a fetched file's hash, or another record's key"
    expression: "this.records.all(k, this.records[k].deps.size() > 0 && this.records[k].deps.all(d, d != k && (d in this.records || this.sources.exists(s, s.revisions.exists(r, r.hash == d)) || this.files.exists(f, f.hash != '' && f.hash == d))))"
  };

  reserved 7;
  reserved "renderings";

  string doc_id = 1;  // uuid4, == directory name
  ExternalIds external_ids = 2;
  string claim_key = 3;  // precedence-primary external id, e.g. "doi:10.…"
  Equivalence equivalence = 4;
  Retraction retraction = 5;
  repeated Source sources = 6;  // primary-artifact lineages (pdf, xml)
  repeated AssociatedFile files = 8;  // every KNOWN supplementary file, even un-fetched (lazy fetch)
  map<string, Record> records = 9;  // key = the derived artifact's content hash (sha256 hex)
  // The current record of each kind, by name: `markdown` names the rendering a reader is served.
  // Moved by the run that produces a record it prefers to the one named; never edited by hand.
  map<string, string> refs = 10;
}

// PubMed's record for a PMID, in the one of its two kinds the index files it under: a journal
// citation, or a book NCBI hosts on its Bookshelf or a chapter of one. protovalidate requires exactly
// one kind set.
message PubmedRecord {
  oneof kind {
    option (buf.validate.oneof).required = true;

    pubmed.PubmedArticle article = 1;
    pubmed.PubmedBookArticle book_article = 2;
  }
}

// The at-rest type of a paper's `metadata.pb`: the record of the index that resolved the paper,
// whole. A Crossref or OpenAlex record is held in its mirror and as JSON text, which count as one
// index. Exactly one index is a constraint rather than a oneof (docs/design/litcache-manifest.md,
// "The bibliographic record").
message PaperMetadata {
  option (buf.validate.message).cel = {
    id: "paper_metadata.one_index"
    message: "exactly one index's record must be set"
    expression:
      "(has(this.pubmed) ? 1 : 0)"
      " + ((has(this.crossref) || has(this.crossref_json)) ? 1 : 0)"
      " + ((has(this.openalex) || has(this.openalex_json)) ? 1 : 0) == 1"
  };

  PubmedRecord pubmed = 1;
  themis.litcache.models.crossref.Work crossref = 2;
  themis.litcache.models.openalex.Work openalex = 3;
  // Crossref's work record as JSON text: the `message` object of its works response, re-serialised
  // from the parsed response with nothing dropped or renamed. The shortest is `{}`; that the text
  // parses as a JSON object is checked by `paper_metadata.check`, as no rule here can state it.
  optional string crossref_json = 4 [(buf.validate.field).string.min_len = 2];
  // OpenAlex's work record as JSON text: one element of a works response's `results`, re-serialised
  // from the parsed response with nothing dropped or renamed. Checked as `crossref_json` is.
  optional string openalex_json = 5 [(buf.validate.field).string.min_len = 2];
}

// The at-rest type `metadata.pb` moves to: a paper's metadata, and the record it was filled from
// (docs/design/litcache-manifest.md, "The bibliographic record"). A consumer takes `metadata` alone.
message SourcedMetadata {
  Metadata metadata = 1 [(buf.validate.field).required = true];
  MetadataSource source = 2 [(buf.validate.field).required = true];
}

// Holds the records the metadata is filled from, each as its index states it, kept whole so the
// metadata can be filled from them again: the record of the index that resolved the paper, and
// OpenAlex's record of the same work unless OpenAlex resolved it or holds no such work. A constraint
// rather than a oneof says which may be set together. Unrelated to the manifest's `Source`, a
// captured file, and its `Record`, a derived artifact.
message MetadataSource {
  option (buf.validate.message).cel = {
    id: "metadata_source.indexes"
    message: "a record must be set, and at most one of PubMed's and Crossref's"
    expression:
      "(has(this.pubmed) || has(this.crossref_json) || has(this.openalex_json))"
      " && !(has(this.pubmed) && has(this.crossref_json))"
  };

  // PubMed's record, typed by the proto generated from NLM's DTD.
  PubmedRecord pubmed = 1;
  // Crossref's work record as JSON text: the `message` object of its works response, re-serialised
  // from the parsed response with nothing dropped or renamed. The shortest is `{}`; that the text
  // parses as a JSON object is checked in code wherever `metadata.pb` is written or parsed, as no
  // rule here can state it.
  optional string crossref_json = 2 [(buf.validate.field).string.min_len = 2];
  // OpenAlex's work record as JSON text: one element of a works response's `results`, re-serialised
  // from the parsed response with nothing dropped or renamed. Checked as `crossref_json` is.
  optional string openalex_json = 3 [(buf.validate.field).string.min_len = 2];
}

// Themis's metadata for a paper: what a consumer reads, filled from the source record's records as fully
// as they allow, the authors from OpenAlex's where it is held (see `Author`). Text is plain; each
// identifier is in its scheme's bare form.
message Metadata {
  // The title, "" when the record states none.
  string title = 1;
  // The authors, in the record's order.
  repeated Author authors = 2;
  // The publication year, four digits; "" when the record states none.
  string year = 3 [(buf.validate.field).string.pattern = "^([0-9]{4})?$"];
  // The journal, or the book a chapter belongs to; "" when the record states none.
  string container_title = 4;
  // The abstract, its section labels kept as text ("Background: ..."); "" when the record states none.
  string abstract = 5;
  // NLM's MeSH headings for the paper, in the record's order. Empty when the record carries none:
  // Crossref states no MeSH, PubMed only for a paper NLM has indexed for MEDLINE, and OpenAlex only
  // for a work with a PMID, so empty says nothing about the paper's subject.
  repeated MeshHeading mesh_headings = 6;
  // The paper's types as NLM's Publication Types name them ("Case Reports"), in the record's order;
  // another index's single type is mapped onto them by a fixed table. Empty when none is stated or maps.
  repeated string publication_types = 7 [(buf.validate.field).repeated.items.string.min_len = 1];

  message Author {
    // A display name, "Given Family" or a collective name: OpenAlex's name for the author's profile
    // where the source holds OpenAlex's record, else the name the other record states.
    string name = 1 [(buf.validate.field).string.min_len = 1];
    // The author's ORCID iD in its bare form ("0000-0002-1825-0097"): the one OpenAlex attributes to
    // the author's profile where the source holds OpenAlex's record, else the one the other record
    // states; "" when there is none, or one whose check digit fails.
    string orcid = 2 [(buf.validate.field).string.pattern = "^([0-9]{4}-[0-9]{4}-[0-9]{4}-[0-9]{3}[0-9X])?$"];
  }

  message MeshHeading {
    MeshTerm descriptor = 1 [
      (buf.validate.field).required = true,
      (buf.validate.field).cel = {
        id: "mesh_heading.descriptor_kind"
        message: "a heading's descriptor must be a D term"
        expression: "this.ui.startsWith('D')"
      }
    ];
    // The qualifiers (subheadings) the heading narrows its descriptor by, such as genetics (Q000235).
    repeated MeshTerm qualifiers = 2 [(buf.validate.field).repeated.items.cel = {
      id: "mesh_heading.qualifier_kind"
      message: "a heading's qualifiers must be Q terms"
      expression: "this.ui.startsWith('Q')"
    }];
  }

  // A MeSH descriptor or qualifier.
  message MeshTerm {
    // NLM's unique identifier, "D" or "Q" and digits ("D001943"). A reader that shows the term names it
    // from NLM's MeSH vocabulary.
    string ui = 1 [(buf.validate.field).string.pattern = "^[DQ]([0-9]{6}|[0-9]{9})$"];
    // Whether the record marks the term a major topic of the paper. Approximate from OpenAlex, which
    // marks only descriptors.
    bool major_topic = 2;
  }
}
