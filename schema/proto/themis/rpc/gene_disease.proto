// gene_disease: the curated gene-disease entities and the gene-scoped signals, composed over ClinGen
// validity/dosage, GenCC and PanelApp under MONDO's subclass closure.
// Design: docs/design/evidence-interfaces.md.
//
// Modelled from:
//   ClinGen Gene Validity, ClinGen Dosage, GenCC and PanelApp Australia (the reference tables the
//     weekly refresh job writes): `CuratedEntity`, `GenccSubmission`, `MechanismStatement` and
//     `GeneScopedSignals` carry each source's own values — its classification string, its mode term,
//     its notes, its haploinsufficiency score.
//   EBI OLS4 MONDO subclass closure: `TermRelation`.
//   SVCv4 SM18 (the gene-disease-validity gate) and SM21 (the MDE): `GateLevel` is the ladder the gate
//     is keyed by — docs/design/evidence-interfaces.md § "is the gene-disease relationship valid, and
//     by what mechanism?".
//   This interface's own design: `DescribeGeneRequest`, `DescribeGeneResponse`, `EntityResolution`
//     and `GeneCoverage`.
//
// EVALUATION ONLY, AGAINST A DRAFT STANDARD. SVCv4 is a July 2026 pilot: its point values,
// thresholds and code names may change before publication, so the SVCv4 codes named throughout
// these comments are provisional. Nothing here is validated for clinical or diagnostic use, and a
// classification composed from these facts is not a clinical variant classification.
//
// Auth is per the service pattern (services.md): the session token arrives as x-themis-session-token
// metadata and resolves via themis.clients.auth; it is never a message field.
//
// The shared value types (Provenance, GenomicSpan): themis/evidence/models/evidence.proto. The
// framework's mode of inheritance is not here: a source's mode term is never mapped onto it
// (themis/svcv4/models/svcv4.proto).

syntax = "proto3";

package themis.rpc.gene_disease;

import "google/protobuf/struct.proto";
import "themis/evidence/models/evidence.proto";
import "themis/rpc/sandbox_options.proto";

// The unit SVCv4 classifies is the MDE — gene x phenotype x mode of inheritance x mechanism — and
// SM18 states the gate and the mechanism precondition per MDE, never per gene. So the message keeps
// the two scopes apart rather than answering for the gene and letting that read as the entity's:
//   entities[]  -> per curated record: gate_level feeds the GDV gate (Definitive/Strong -> any class;
//                  Moderate -> cap LP; Limited -> cap VUS; below -> GUS / do-not-report) and the
//                  SM18 precondition (Moderate+) for the mechanism multiplier to exceed Uncertain;
//                  inheritance_term is the source's mode, verbatim, which the analyst reads to
//                  decide which record describes the entity being classified; mechanism_statements
//                  feed the Established/Likely/Suspected/Uncertain level call.
//   resolution  -> the records on the disease term the requested MONDO id names, when the request
//                  names one.
//   gene_scoped -> the ClinGen dosage haploinsufficiency score, PanelApp's GoF veto, PanelApp's
//                  panel-level mode of inheritance and its evaluation comments. On a gene carrying
//                  both an LoF and a GoF entity (SM21 ¶9) none of these is evidence about whichever
//                  entity was chosen.
// NO source emits the 4-level Established/Likely/Suspected/Uncertain mechanism scale — the model
// makes that call from these signals plus the mechanism narrative the literature service supplies.
// Uncertain (x0) is the floor when undeterminable, not a default fired by an absent score.

// The gate level a validity classification reads as. Not the classification vocabulary: four of the
// published classifications are not gate levels, so this is the value themis.svcv4.classify takes —
// never re-derive it from the classification by hand.
enum GateLevel {
  GATE_LEVEL_UNSPECIFIED = 0;  // no entity carries it: a curated classification always maps to one of the six below
  GATE_LEVEL_DEFINITIVE = 1;
  GATE_LEVEL_STRONG = 2;
  GATE_LEVEL_MODERATE = 3;
  GATE_LEVEL_LIMITED = 4;
  GATE_LEVEL_LESS_THAN_LIMITED = 5;
  GATE_LEVEL_DISPUTED_OR_REFUTED = 6;
}

// How the curated term relates to the one the request named.
enum TermRelation {
  TERM_RELATION_UNSPECIFIED = 0;
  TERM_RELATION_SAME = 1;        // the curated term is the requested one
  TERM_RELATION_DESCENDANT = 2;  // the curated term is a MONDO subclass descendant of it
}

// Whether the gene carries a curated entity, and which of the two absences it is in when it does
// not: a gene no reference table holds and a gene they hold with no validity assertion are
// different facts about the gene, neither readable as the other.
enum GeneCoverage {
  GENE_COVERAGE_UNSPECIFIED = 0;
  GENE_COVERAGE_CURATED = 1;                 // entities is non-empty
  GENE_COVERAGE_NO_VALIDITY_ASSERTION = 2;   // a reference table carries the gene; none asserts gene-disease validity
  GENE_COVERAGE_ABSENT = 3;                  // no reference table carries the gene at all
}

// The gene to describe, and optionally the disease term to resolve against its curations.
message DescribeGeneRequest {
  reserved 3;
  reserved "inheritance";
  // "HGNC:nnnn" (required) — the key every reference table is joined on; empty is INVALID_ARGUMENT.
  string hgnc_id = 1;
  // The entity's disease term, as a MONDO curie ("MONDO:" and seven digits). Optional: unset returns
  // the gene's curated records and resolves nothing. Set, the rpc resolves it against them under
  // MONDO's own subsumption: the requested term's own curations decide wherever the gene is curated
  // for that term, and only where it is not do the curations of one subclass descendant of it
  // resolve. A free-text condition is not accepted (evidence-interfaces.md §gene_disease).
  string mondo_id = 2;
}
// What the reference tables hold for the gene, with the entity scope and the gene scope kept apart.
message DescribeGeneResponse {
  // Every gene-disease validity assertion the tables carry for the gene, one element per (source,
  // disease term, the source's mode term). Reduced across nothing and selected from by nothing: which
  // curated record describes the entity a presentation belongs to is the analyst's call (SM21), and
  // the level the gate reads is that record's, not the gene's (SM18). Empty is a real answer — see
  // `coverage`.
  repeated CuratedEntity entities = 1;
  // Set when the request named a MONDO id and the gene carries records to resolve it against: the
  // ones on the term it names, and how. A named term the curations do not settle is the rpc's
  // FAILED_PRECONDITION, never an empty field; a gene with no curated record at all is `coverage`.
  EntityResolution resolution = 2;
  GeneScopedSignals gene_scoped = 3;
  GeneCoverage coverage = 4;
  google.protobuf.Struct raw = 15;      // the per-source rows (ClinGen, GenCC, each PanelApp panel, the MONDO closure)
  repeated themis.evidence.models.Provenance provenance = 16;  // one per contributing source
}
// One source's validity assertion for one (MONDO term, the source's mode term): the record the GDV
// gate reads, once the analyst has decided it describes the entity being classified.
message CuratedEntity {
  reserved 4;
  reserved "inheritance";
  string source = 1;         // "ClinGen Gene Validity" | "GenCC"
  string disease_label = 2;  // the curator's own label for the entity
  string mondo_id = 3;       // the MONDO term curated, which the label is one alias of
  // The source's own mode of inheritance, verbatim and mapped onto nothing: ClinGen's code ("AD",
  // "XL") or the title of GenCC's HPO term ("Autosomal dominant", "X-linked recessive"), whatever
  // the term. ClinGen curates one X-linked mode where GenCC states the dominant and recessive kinds
  // apart. Where GenCC's submitters title one HPO term several ways, the first title.
  string inheritance_term = 5;
  // The source's own classification: the ClinGen set, plus GenCC's `Supportive` (below `Moderate`)
  // and its `… Evidence` spellings for the two contradicted ones. Where several of the source's
  // assertions share this record it is the strongest on the published rank — an aggregation under a
  // published vocabulary; GenCC's assertions are kept in `submissions`, and every source's rows in `raw`.
  string validity_classification = 6;
  GateLevel gate_level = 7;
  repeated GenccSubmission submissions = 8;  // GenCC only: one per submitter assertion behind this entity
  // The free-text mechanism narratives this entity's submitters supply (GenCC submitted_as_notes).
  // Entity-scoped; PanelApp's panel-level comments are in gene_scoped.mechanism_statements.
  repeated MechanismStatement mechanism_statements = 9;
}
// One GenCC submitter's own assertion behind a CuratedEntity, unreduced.
message GenccSubmission {
  string submitter = 1;
  string validity_classification = 2;  // this submitter's own classification, unreduced
  string mechanism_note = 3;           // its submitted_as_notes, empty where the submission carries none
}
// Which of the gene's curated terms the requested MONDO id names, its records, and how the two terms
// relate.
message EntityResolution {
  reserved 2, 4;
  reserved "requested_inheritance", "inheritance";
  string requested_mondo_id = 1;
  string mondo_id = 3;  // the curated term: the requested one, or a descendant of it
  TermRelation relation = 5;
  // Every record on the curated term, under every mode and from every source, so a caller reads them
  // without re-filtering `entities`, which still carries the gene's other terms. Which of them
  // describes the entity being classified, its mode above all, is the analyst's call, read off each
  // record's `inheritance_term`. Where both sources carry a mode the classifications are each
  // source's own: SM18's gate names the ClinGen gene-disease validity framework, and GenCC (which
  // aggregates a ClinGen submission of its own) fills in where ClinGen has not curated.
  repeated CuratedEntity entities = 6;
}
// Signals curated for the gene rather than for any one of its entities.
message GeneScopedSignals {
  // ClinGen dosage HI: 0-3, 30, 40 (see doc). Absent when no ClinGen dosage curation exists
  // (raw['clingen_dosage']=null disambiguates), distinct from a real 0 = "No Evidence".
  optional int32 haploinsufficiency_score = 1;
  string mode_of_pathogenicity = 2;  // PanelApp: populated only as a GoF/other exception flag; usually empty
  // PanelApp's panel-level mode ("MONOALLELIC", "BIALLELIC", …). Panel membership, not an entity's
  // mode: each curated record states its source's in entities[].inheritance_term, and the two
  // disagree on a gene with several MDEs.
  string mode_of_inheritance = 3;
  repeated MechanismStatement mechanism_statements = 4;  // PanelApp evaluation comments, per panel
  // Which reference tables carry the gene at all, whether or not they assert validity: what separates
  // GENE_COVERAGE_NO_VALIDITY_ASSERTION from GENE_COVERAGE_ABSENT.
  repeated string sources_holding_the_gene = 5;
}
// One free-text mechanism narrative, with the source and the scope it was filed under.
message MechanismStatement {
  string source = 1;   // "GenCC" on a CuratedEntity, "PanelApp Australia" on GeneScopedSignals
  string context = 2;  // GenCC: the disease title the note was filed under; PanelApp: the panel name
  string text = 3;     // the free-text mechanism narrative (GenCC submitted_as_notes / PanelApp evaluation comment)
}

service GeneDisease {
  // ClinGen validity/dosage + GenCC + PanelApp AU, keyed under MONDO's subclass closure.
  // Lists every gene-disease record curated for the gene: one element per (source, MONDO term, the
  // source's mode term) a curator asserts, with its label, its mode term verbatim, its classification
  // on the published rank, the gate level that classification reads as, its mechanism narratives and
  // its source. Where a source states one record several times — GenCC files one row per submitter —
  // they reduce to its strongest classification on the published rank, an aggregation under a fixed
  // vocabulary, with each assertion kept. Across records the rpc reduces nothing and selects nothing:
  // which record describes the entity a presentation belongs to, its mode included, is the analyst's
  // call (SM21), and the level the gate reads is that record's, not the gene's (SM18). Name the
  // entity's disease term as `mondo_id` and the rpc resolves it: the requested term's own curations
  // decide wherever the gene is curated for that term, and only where it is not do the curations of
  // a MONDO subclass descendant of it resolve. It answers with every record on that one term, under
  // every mode, and FAILED_PRECONDITION where several distinct curated terms sit under the requested
  // one or none does — never the nearest. A gene the tables do not carry and a gene they carry with no
  // validity assertion are distinct answers (`coverage`). Classification, gate level, mode term and
  // mechanism narratives are per record; the haploinsufficiency score, the gain-of-function veto and
  // PanelApp's mode of inheritance are per gene. See DescribeGeneResponse.
  rpc DescribeGene(DescribeGeneRequest) returns (DescribeGeneResponse) {
    option (themis.rpc.admits_caller) = CALLER_AGENT;
  }
}
