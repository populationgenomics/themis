// transcript: the exon table every positional judgement rests on, and the exon axis of the
// mechanism x exon-relevance matrix built over it. Design: docs/design/evidence-interfaces.md.
//
// Modelled from:
//   VariantValidator (transcript record): `GetStructureResponse.raw`; `Exon` and `TranscriptPosition`
//     re-express its alignment in genomic / n. / c. coordinates.
//   gnomAD (gene constraint, published pext regions, MANE pair): `ExonPext`, `PextTissueValue`,
//     `ManeSelectPair`, `loeuf`.
//   GTEx (isoform expression by tissue): `TranscriptExpression`.
//   SVCv4 SM18 exon relevance (docs/design/svcv4-interpretations.md § "Exon relevance: what the tiers
//     admit"): no message carries the All / Most / Few tier — `transcript_inventory`, `pext` and
//     `gtex_expression` are the measurements it is judged over.
//   This interface's own design: both request messages, `ExonMembership`, `TranscriptNamespace`,
//     `TranscriptInventoryDenominator`, `AssessExonRelevanceResponse`.
//
// EVALUATION ONLY, AGAINST A DRAFT STANDARD. SVCv4 is a July 2026 pilot: its point values,
// thresholds and code names may change before publication, so the SVCv4 codes named throughout
// these comments are provisional. Nothing here is validated for clinical or diagnostic use, and a
// classification composed from these facts is not a clinical variant classification.
//
// Auth is per the service pattern (services.md): the session token arrives as x-themis-session-token
// metadata and resolves via themis.clients.auth; it is never a message field.
//
// The shared value types (Provenance, GenomicSpan, the routing Consequence):
// themis/evidence/models/evidence.proto.

syntax = "proto3";

package themis.rpc.transcript;

import "google/protobuf/struct.proto";
import "themis/evidence/models/evidence.proto";
import "themis/rpc/sandbox_options.proto";

// ---- AssessExonRelevance: the exon axis of the mechanism x exon-relevance matrix ----------------
// Surfaces the signals for the All / Most / Few exon-relevance call (the matrix multiplier's exon
// axis, x1.0 / 0.5 / 0); the call itself is judgement-heavy and is the model's, not a lookup. Doc
// maps fields to signals:
//   in_mane_select / in_mane_plus_clinical -> MANE membership; in NEITHER forces "Few".
//   transcript_inventory -> WHICH transcripts of the gene carry the assessed exon and which lack
//                           it: the membership test SM18 writes All / Most / Few over. Read in both
//                           annotation sets, each transcript decided by an interval test on genomic
//                           coordinates — exact boundaries, NOT containment. It carries no tier:
//                           "Most" is defined against transcripts that omit the exon, and the
//                           abundance of any that do (`expression` below, in the disease-relevant
//                           tissue) is the second limb SM18 states no threshold for. Read it WITH
//                           `inventory_denominators` — a group of it means nothing without the size
//                           it is a group of.
//   pext                 -> gnomAD proportion-expressed-across-transcripts, per exon of the queried
//                           transcript (the overlapping regions' means, weighted by coverage), for
//                           the whole gene rather than the queried exon alone. Two reasons it is a
//                           PROFILE and not a scalar. (1) SM18 decides All vs Most on whether the
//                           exon is differentially excluded RELATIVE TO the rest of the gene, and an
//                           absolute value answers that for no exon: retained-intron and NMD
//                           transcripts depress every exon of a gene alike, so 0.70 can be the
//                           gene's maximum while reading as "30% of transcripts skip this exon".
//                           (2) SM18 asks the question in the disease-relevant TISSUE, and the
//                           cross-tissue mean errs both ways — ANO5 exon 4 sits at 0.04 of its gene
//                           median across tissues but 0.63 of it in skeletal muscle, so the
//                           cross-tissue figure alone condemns a healthy exon. Name tissues in the
//                           request to get per-tissue values; unnamed, each exon carries the
//                           cross-tissue mean alone, which SM18's assessment cannot be made on.
//                           An exon no pext region covers has no `mean` — which is not a pext of 0.
//                           What pext CANNOT do: establish "All". It supports "no evidence of
//                           differential exclusion", which argues against "Few" and does not
//                           separate All from Most — the half that carries the points. The rpc
//                           returns the measurement; the call stays the model's.
//                           Keyed by genomic interval, so the profile needs no transcript-id join:
//                           the spans come from the requested RefSeq transcript's own exon table.
//   loeuf                -> gnomAD gene constraint; regional-missense-constraint detail rides in raw.
//   clinvar_plp_density  -> count of >=1-star records ClinVar classifies pathogenic in the GENE, not
//                           the exon — this rpc fixes that floor, since the density is one coarse
//                           burden number (raw's `clinvar_plp_density_scope` says so too) — read it
//                           as the gene's pathogenic burden, never as this exon's. Membership is the
//                           pool's, so penetrance-qualified and risk-allele records count; the
//                           narrower set SM3's DAFT anchors on is not this. The pool is capped, so
//                           on a well-studied gene it is also a lower bound; raw carries the census
//                           (`clinvar_total_in_gene`, `clinvar_considered_in_gene`,
//                           `clinvar_pool_truncated`).
//   gtex_expression      -> per-transcript median expression, the SM18 "transcript abundance in the
//                           disease-relevant tissue" signal, as the gene's whole isoform landscape.
//                           Keyed by VERSIONED ENSEMBL transcript; the same rows reach each
//                           inventory entry they join to, on
//                           `TranscriptExpression.transcript_base`. The RefSeq spine (Variant.Normalize,
//                           GetStructure) joins to them through `pext_mane_select` and only
//                           there: no upstream here states a RefSeq/Ensembl pairing for any other
//                           transcript, and none is inferred.
message AssessExonRelevanceRequest {
  // HGNC symbol (required): it scopes every gene-level signal here, and names the transcript set
  // `transcript_inventory` is read over. Empty is INVALID_ARGUMENT, and so is a symbol
  // VariantValidator holds `transcript` under a different gene.
  string gene = 1;
  string transcript = 2;  // the chosen transcript (from Variant.Normalize) whose exon is assessed
  // The exon the variant lands in. It is validated against the transcript (an out-of-range number is
  // INVALID_ARGUMENT rather than a gap in the profile) and its genomic span is echoed in `raw`; the
  // pext profile covers every exon either way, so this names the one under assessment, not a filter.
  int32 exon = 3;
  // MANE membership from Variant.Normalize's TranscriptProjection (both required): an unset flag is
  // INVALID_ARGUMENT, and membership in neither forces "Few".
  optional bool in_mane_select = 4;
  optional bool in_mane_plus_clinical = 5;
  // GTEx tissueSiteDetailId filter, e.g. "Cells_Cultured_fibroblasts", "Nerve_Tibial" — the
  // disease-relevant tissues SM18 asks about. It selects BOTH per-tissue signals: the isoform
  // expression and the per-exon pext. Empty = every tissue for GTEx (summarised at each transcript's
  // peak) and cross-tissue means alone for pext.
  //
  // Three ways a tissue can fail to answer, each reported as itself, none collapsed into a value and
  // none silently replaced by another tissue. An id GTEx does not know is INVALID_ARGUMENT naming
  // the accepted ids — which is also how "the disease tissue is not sampled" arrives, since GTEx has
  // no retina at all (USH2A, RS1), so no tissue-level assessment exists for such a gene and the
  // caller has to say so rather than substitute one. An id GTEx knows but holds no expression row
  // for is listed in `raw.gtex_isoforms.tissues_without_rows` — including when NO requested tissue
  // has one, which is a fact about the gene and does not fail the rpc, since pext answers the same
  // request from a source GTEx's coverage does not bound. An id GTEx samples but gnomAD's pext does
  // not carry (5 of GTEx's 54: Bladder, Cervix_Ectocervix, Cervix_Endocervix, Fallopian_Tube,
  // Kidney_Medulla) is listed in `tissues_without_pext`.
  repeated string tissues = 6;
  // Return the full per-transcript x per-tissue GTEx rows in `raw` (a many-isoform gene runs to
  // megabytes). Off, `raw.gtex_isoforms` states how many rows were withheld instead.
  bool include_gtex_detail = 7;
}
// One transcript's GTEx median expression in one tissue.
message TranscriptExpression {
  string transcript = 1;  // versioned GENCODE transcript id, as GTEx states it
  string tissue = 2;      // GTEx tissueSiteDetailId
  double median_tpm = 3;  // median transcript expression, TPM
  // The accession without its version. GTEx's GENCODE snapshot and the annotation set behind
  // `transcript_inventory` version the same transcript differently, so an exact-string join drops
  // real matches; this is the key the join runs on, and both versions stay visible.
  string transcript_base = 4;
}
// How one transcript relates to the assessed exon's genomic interval. Four disjoint outcomes over
// the interval, not degrees of one thing: only SPANS_BUT_SKIPS omits an exon the transcript reaches.
enum ExonMembership {
  // Never returned: every classified record carries one of the four below.
  EXON_MEMBERSHIP_UNSPECIFIED = 0;
  // An exon at the assessed interval's exact boundaries. NOT a containment test: a transcript whose
  // exon strictly contains the assessed interval (an alternative donor AND acceptor extending it)
  // is CARRIES_A_DIFFERENT_INTERVAL, not this.
  EXON_MEMBERSHIP_CARRIES_THE_EXON = 1;
  // At least one exon overlaps the assessed interval, none at its exact boundaries: an alternative
  // acceptor or donor, which can remove most of the exon or extend past it.
  EXON_MEMBERSHIP_CARRIES_A_DIFFERENT_INTERVAL = 2;
  // No exon overlaps, and the transcript's aligned extent covers the interval: it reaches the locus
  // and splices past it.
  EXON_MEMBERSHIP_SPANS_BUT_SKIPS = 3;
  // No exon overlaps and the extent does not cover the interval: the transcript ends before the
  // locus or begins after it, lacking the exon by ending elsewhere rather than by splicing past it.
  EXON_MEMBERSHIP_DOES_NOT_REACH = 4;
}

// Which accession namespace names a transcript.
enum TranscriptNamespace {
  TRANSCRIPT_NAMESPACE_UNSPECIFIED = 0;
  TRANSCRIPT_NAMESPACE_REFSEQ = 1;   // curated RefSeq: NM_ (coding), NR_ (non-coding)
  TRANSCRIPT_NAMESPACE_ENSEMBL = 2;  // Ensembl / GENCODE: ENST
}

// One transcript of the gene, against the assessed exon's genomic interval.
message TranscriptExonMembership {
  string transcript = 1;  // versioned accession, as its annotation set states it
  // The accession without its version run — the key every join here runs on (see
  // TranscriptExpression.transcript_base), and what matches an assessed accession the annotation
  // set has since superseded.
  string accession_base = 2;
  // The annotation set this entry came from. `transcript_inventory` concatenates the sets, so group
  // by this before reading a group against the matching `inventory_denominators` entry.
  TranscriptNamespace namespace = 3;
  // Both as this annotation set flags them, which is not always what gnomAD's pext release flags
  // (see pext_mane_select).
  bool mane_select = 4;
  bool mane_plus_clinical = 5;
  bool coding = 6;  // the record carries CDS bounds; a non-coding model does not
  ExonMembership membership = 7;
  // This transcript's GTEx median expression, joined on `accession_base`. GTEx keys its rows by
  // versioned Ensembl id, so a RefSeq entry carries none — a namespace gap, never a measured zero,
  // and not what `transcripts_without_expression` reports either (that names the ENSEMBL entries
  // GTEx returned no row for). Each row's `transcript` is GTEx's own version of the accession.
  // One row per requested tissue GTEx returned one for; with no tissue requested, one row carrying
  // THIS transcript's own peak tissue — two entries can peak in different tissues, so a
  // cross-transcript comparison needs the request to name the tissue.
  repeated TranscriptExpression expression = 8;
  // Every entry whose `accession_base` is the requested transcript's — more than one where the set
  // holds several versions of it. No entry carries it when the set holds the accession at no
  // version, or when the record it holds is in `transcripts_not_classified`.
  // The assessed interval comes from the REQUESTED version's exon table while this entry is the
  // set's current record, so a superseded accession whose boundaries moved reads as
  // CARRIES_A_DIFFERENT_INTERVAL against its own successor.
  bool assessed_transcript = 9;
  // The exons of THIS transcript overlapping the assessed interval, set only for
  // CARRIES_A_DIFFERENT_INTERVAL — the bucket that spans a 3-nt alternative acceptor and a
  // transcript keeping one base of the exon. How much of the exon survives is the analyst's
  // "functionally equivalent" judgement, so the intervals are returned rather than a verdict on them.
  repeated themis.evidence.models.GenomicSpan overlapping_exons = 10;
}
// What one annotation set contributed to `transcript_inventory` — the denominator a grouping of it
// is read against, so an empty grouping cannot pass for "not computed".
message TranscriptInventoryDenominator {
  TranscriptNamespace namespace = 1;
  // How many records of the set a membership verdict was computed over; `transcripts_not_classified`
  // names the rest, and the two together are the set's whole current list. That list is every
  // "transcript variant" record the set publishes, not a curated shortlist — 377 RefSeq records
  // against 28 Ensembl ones on one measured gene, 3 against 13 on another. A ratio over it is a
  // statement about the annotation set, not about clinically relevant transcripts; which transcripts
  // are those is SM18's own admission filter and stays the analyst's.
  int32 transcripts_considered = 2;
  // Records the set holds that no verdict could be computed for: no alignment on the assessed exon's
  // chromosome, or a record whose MANE flags, CDS bounds or exon table this service could not read.
  // Neither is SM18's own exclusion of a transcript from the assessment (not functionally
  // equivalent, poorly expressed, wrong tissue) — that is the analyst's call and is not applied here.
  repeated string transcripts_not_classified = 3;
}
// A MANE Select transcript named in both namespaces, as one upstream publishes the pair.
message ManeSelectPair {
  string refseq = 1;   // versioned RefSeq accession
  string ensembl = 2;  // versioned Ensembl accession
}
// One tissue's pext value over one exon.
message PextTissueValue {
  // The GTEx tissueSiteDetailId as the request spelled it, so it joins with
  // TranscriptExpression.tissue; gnomAD keys its own pext columns in lower case.
  string tissue = 1;
  double value = 2;
}
// One exon's proportion expressed across transcripts, over its genomic span.
// Shape: gnomAD's published pext regions, re-weighted onto this transcript's exon spans
// (VariantValidator) — the only message here drawing on two upstreams.
message ExonPext {
  int32 exon = 1;  // 1-based, in the queried transcript
  // gnomAD's own published per-region cross-tissue summary, averaged over the regions covering the
  // exon and weighted by how much of it each covers. Absent when no region covers the exon at all —
  // which is not a pext of 0, and is why the field carries presence. NOT the mean of `tissues`:
  // gnomAD's summary and its per-tissue values are separately defined statistics and do not agree
  // (ANO5's first region publishes 0.8277 where its 49 tissue values average 0.7907), so compare a
  // mean against a mean and a tissue against the same tissue.
  optional double mean = 2;
  // One entry per requested tissue gnomAD carries a pext column for, weighted the same way. Empty
  // when the request named no tissue (the mean is then all there is), or when no region covers the
  // exon; a requested tissue gnomAD has no column for is in `tissues_without_pext` instead.
  repeated PextTissueValue tissues = 3;
  // How much of the exon the covering regions span, against the exon's own length. gnomAD publishes
  // pext over CODING bases, so a UTR-bearing terminal exon is measured on a fraction of itself —
  // ANO5 exon 1 is 40 bases of 448, exon 22 is 219 of 3814 — and without this its value reads as
  // strongly as a fully covered exon's in the same profile.
  int32 covered_bases = 4;
  int32 exon_bases = 5;
}
// Presence, since HasField raises on a field that carries none rather than answering false:
// `ExonPext.mean` and `loeuf` are the two SCALARS that carry it, because gnomAD can genuinely hold
// no value for either and presence is what tells that from a real 0.0. `pext_mane_select` is a
// message, so it carries presence inherently, and its absence is a fact about gnomAD rather than
// an empty accession pair — read it with HasField, never by testing `refseq` against "". The FETCHED
// scalars beside them carry none and need none — a failed gnomAD / ClinVar / GTEx lookup fails the
// whole rpc, so none of those is ever left at its default because a fact could not be established.
// Nor do the echoed `in_mane_select` / `in_mane_plus_clinical`: the request rejects an unset flag, so
// a false here is the exon's and not an unsent field's — including the false/false that forces "Few".
message AssessExonRelevanceResponse {
  bool in_mane_select = 1;
  bool in_mane_plus_clinical = 2;
  // The gene's pext profile: one entry per exon of the queried transcript, in transcript order, the
  // queried exon among them (matched on `ExonPext.exon`). Always one entry per exon — a gene gnomAD
  // holds no pext for comes back as a full profile whose every `mean` is unset, not as an empty
  // list. Compare the queried exon against the rest — within a tissue, since the ratios differ by
  // tissue — rather than against an absolute threshold.
  repeated ExonPext pext = 3;
  optional double loeuf = 4;            // absent when the gene is unconstrained-in-data, not 0.0
  // No presence: 0 is a count — the pool holds no >=1-star pathogenic record — never "not computed".
  int32 clinvar_plp_density = 5;
  // Every transcript x every requested tissue when `tissues` was set, else each transcript's peak
  // tissue; the full grid is `raw` under include_gtex_detail. EMPTY when GTEx measures none of the
  // requested tissues for this gene — read `tissues_without_expression` before concluding anything,
  // since an empty list otherwise reads as "not expressed in the disease tissue", which is the one
  // reading it must never carry.
  repeated TranscriptExpression gtex_expression = 6;
  // Requested tissues GTEx samples but gnomAD's pext data has no column for, so their absence from
  // every `ExonPext.tissues` is that and not a pext of 0. Empty when the request named no tissue,
  // and empty when gnomAD holds no pext for the gene at all — that absence is every exon's missing
  // `mean`, not a missing tissue.
  repeated string tissues_without_pext = 7;
  // Requested tissues GTEx returned no expression row for, so their absence from `gtex_expression`
  // is that and not a measured zero. Empty when the request named no tissue.
  repeated string tissues_without_expression = 8;
  // The gene's transcripts against the assessed exon, one entry per transcript a verdict was
  // computed for (`transcripts_not_classified` names the rest), RefSeq set first. Both
  // annotation sets are read and each transcript is decided by an interval test on genomic
  // coordinates, so an Ensembl model is tested in its own namespace with no crosswalk. The two sets
  // are concatenated and neither is merged into the other: group on `namespace` and read each group
  // against its own `inventory_denominators` entry.
  repeated TranscriptExonMembership transcript_inventory = 9;
  // One entry per annotation set read, whether or not it contributed a transcript.
  repeated TranscriptInventoryDenominator inventory_denominators = 10;
  // Transcripts GTEx returned expression for whose rows reached no `transcript_inventory` entry:
  // neither annotation set holds a record for the accession, the record it holds is in
  // `transcripts_not_classified`, or a set holds several versions of the accession and none is the
  // one GTEx names, so the rows belong to no single entry. Their abundance stands against no
  // membership verdict. Coverage is partial in both directions; this names one,
  // `transcripts_without_expression` the other.
  repeated string transcripts_without_structure = 11;
  // Inventory entries in the namespace GTEx keys (Ensembl) carrying no expression row of their own:
  // GTEx returned none for the accession IN THE REQUESTED TISSUES (in any tissue, when the request
  // named none), the rows went to the version GTEx names, or the set holds several versions and
  // GTEx names none of them, so the rows belong to no single entry. Their empty
  // `TranscriptExonMembership.expression` is that, never a measured zero. When the request named
  // tissues GTEx holds no row of this gene in at all, every Ensembl entry is listed;
  // `tissues_without_expression` is what tells that case apart.
  repeated string transcripts_without_expression = 12;
  // gnomAD's MANE Select pair for the gene, in both namespaces: the only RefSeq/Ensembl pairing any
  // upstream behind this rpc publishes, and so the route from the RefSeq spine to the Ensembl-keyed
  // `gtex_expression` rows. It is gnomAD's MANE release, not VariantValidator's, and the two
  // disagree — the accession flagged `mane_select` in `transcript_inventory` can be a different
  // version or a different transcript, which a caller comparing the two sources' outputs has to
  // check first. It says nothing about which transcript `pext` was measured on: pext is keyed by
  // genomic interval and needs no transcript at all. Absent when gnomAD holds no MANE Select for
  // the gene, or states only half a pair — `raw.gnomad_gene.mane_select_transcript` says which.
  ManeSelectPair pext_mane_select = 13;
  // Keyed, since a caller reads these by name:
  //   gnomad_gene              -> the gnomAD gene object (constraint, regional missense constraint),
  //                               its `pext` block removed — 49 tissue values per region is 175 kB
  //                               on NF1, and `pext` above carries the requested tissues per exon.
  //                               A tissue the request did not name is therefore not in the response
  //                               at all: ask for it, rather than mining `raw` for it.
  //   pext_regions             -> the regions gnomAD publishes, as {start, stop, mean}: the raw
  //                               genomic intervals behind `pext`, for a caller bucketing them some
  //                               other way. Cross-tissue means only; the per-tissue values are
  //                               typed, on the requested tissues.
  //   exon_genomic_start/_end  -> the queried exon's span: the interval its `pext` entry was read
  //                               on, and the one every `transcript_inventory` verdict was decided
  //                               against — what a `CARRIES_A_DIFFERENT_INTERVAL` differs from
  //   gtex_isoforms            -> {rows | rows_withheld, tissues_without_rows}
  //   clinvar_plp_density_scope / _total_in_gene / _considered_in_gene / _pool_truncated -> the
  //                               density's scope and the census behind it
  google.protobuf.Struct raw = 15;
  // gnomAD, ClinVar and GTEx one each, and VariantValidator three — the assessed
  // transcript's exon table (which every pext value and the assessed interval are read over) and
  // one gene-wide call per annotation set behind `transcript_inventory`. Each carries the alignment
  // release the table was read on, and its `query` names which of the three it is. The request's
  // MANE flags ride in, not a fetched source.
  repeated themis.evidence.models.Provenance provenance = 16;
}

// ---- GetStructure: the exon table every positional judgement rests on ---------------------------
// The transcript's exon table in all three coordinate systems (genomic, n., c.), so exon membership
// and distance-to-splice-site are read off a fact instead of reconstructed from another tool's
// incidental payload. Doc maps fields to the judgements they feed:
//   exons[].cds_start/cds_end       -> the exon's CODING c. span (absent for a wholly-UTR exon); a
//                                      5'UTR position lies outside every exon's span, so use
//                                      `position` to locate one rather than scanning these
//   position.nt_to_exon_end         -> the exonic distance to the donor site; 1 is the exon's last
//                                      base (the exonic -1 position), 2 and 3 the next two — the
//                                      splice-region window SM11 reasons over
//   position.nt_from_exon_start     -> the mirror distance to the acceptor site
//   position.intron + nt_from_intron_start / nt_to_intron_end -> +1/+2 donor and -1/-2 acceptor: the
//                                      CANONICAL_SPLICE routing check
//   exons[].frame_shift_if_skipped  -> whether losing the exon shifts the downstream reading frame
//                                      (the in-frame vs NMD fork Splice.PredictSkipOutcome then resolves)
//   mane_select / mane_plus_clinical -> the MANE-membership signal AssessExonRelevance reads
// Structure only: it says nothing about whether a variant disrupts splicing (Splice) or what the
// aberrant transcript would be (Splice.PredictSkipOutcome).
message GetStructureRequest {
  // Versioned RefSeq coding accession, e.g. "NM_001042492.3" — the bare accession, which is what
  // Variant.Normalize's `TranscriptProjection.transcript` already is. An unversioned accession, an Ensembl
  // ENST, an `NR_` (non-coding, so no c. coordinates exist), or a full HGVS fails with
  // INVALID_ARGUMENT: exon structure is accession-version-specific, so an unversioned request would
  // answer about a structure the caller did not name.
  string transcript = 1;
  string genome_build = 2;  // "GRCh38" | "GRCh37" (required); the exon genomic coordinates are on it
  // Optional: one position to locate in the table (absent = the table alone).
  oneof query_position {
    // c. coordinate: positive = in the CDS (c.3496), negative = 5'UTR (c.-20). The offset forms have
    // no integer encoding — a 3'UTR position (c.*n) and an intronic one (c.3496+1, c.3497-2) must be
    // given as `genomic_position`, which is what reports the intron and its +1/+2, -1/-2 distances.
    int32 cds_position = 3;
    // 1-based coordinate on `genome_build`; may be intronic, and the response says which intron.
    int64 genomic_position = 4;
  }
}
// One exon, in all three coordinate systems.
message Exon {
  int32 number = 1;            // 1-based in transcript order (5'->3' on the transcript, either strand)
  int64 genomic_start = 2;     // the exon's lowest genomic coordinate (ascending on both strands)
  int64 genomic_end = 3;       // its highest; on the minus strand this is the exon's 5' end
  int32 transcript_start = 4;  // n. coordinates: the exon's span in the mature transcript
  int32 transcript_end = 5;
  optional int32 cds_start = 6;  // c. coordinates; absent when the exon is wholly UTR
  optional int32 cds_end = 7;
  int32 length = 8;         // mature-transcript nt (transcript_end - transcript_start + 1)
  int32 coding_length = 9;  // nt of CDS the exon carries; 0 for a wholly-UTR exon
  // coding_length % 3 — 0 means skipping the exon preserves the downstream reading frame. This is
  // the frame arithmetic alone; whether the skip yields a PTC and whether NMD follows is
  // Splice.PredictSkipOutcome.
  int32 frame_shift_if_skipped = 10;
}
// Where a queried position sits in the table. Exactly one of `exon` / `intron` is non-zero.
message TranscriptPosition {
  int32 exon = 1;                // the exon containing the position; 0 when the position is intronic
  int32 nt_from_exon_start = 2;  // 1 = the exon's first base (acceptor-adjacent)
  int32 nt_to_exon_end = 3;      // 1 = the exon's last base — the exonic -1 donor position
  int32 intron = 4;                // the intron containing the position (intron n follows exon n); 0 when exonic
  int32 nt_from_intron_start = 5;  // 1 and 2 are the canonical +1/+2 donor bases
  int32 nt_to_intron_end = 6;      // 1 and 2 are the canonical -1/-2 acceptor bases
  optional int32 cds_position = 7;  // the position as a c. coordinate; absent when intronic or UTR
}
// The transcript's exon table in genomic / n. / c. coordinates, plus a located position if asked.
message GetStructureResponse {
  string transcript = 1;            // the versioned RefSeq accession the table is for
  string gene = 2;                  // HGNC symbol
  string genome_build = 3;
  string chromosome_accession = 4;  // e.g. "NC_000017.11" — what the genomic coordinates are on
  int32 strand = 5;                 // +1 | -1
  bool mane_select = 6;
  bool mane_plus_clinical = 7;
  int32 transcript_length = 8;      // the mature transcript, nt
  int32 cds_transcript_start = 9;   // n. position of c.1 (the initiation codon's first base)
  int32 cds_transcript_end = 10;    // n. position of the termination codon's last base
  int32 coding_length = 11;         // CDS nt, termination codon included
  repeated Exon exons = 12;
  TranscriptPosition position = 13;  // set only when the request carried a position to locate
  google.protobuf.Struct raw = 15;   // the VariantValidator transcript record (alignment cigars included)
  repeated themis.evidence.models.Provenance provenance = 16;
}

service Transcript {
  // VariantValidator transcript alignment: the exon table in genomic / n. / c. coordinates, plus
  // where a supplied position sits in it (exon or intron, and its distance to each boundary).
  // See GetStructureResponse.
  rpc GetStructure(GetStructureRequest) returns (GetStructureResponse) {
    option (themis.rpc.agent_exposed) = true;
  }
  // GTEx + gnomAD pext/constraint + ClinVar density + VariantValidator (the exon table, and the
  // gene's transcript inventory against the assessed exon) -> the exon axis of the mechanism x
  // exon-relevance matrix; the All/Most/Few call is the model's. See AssessExonRelevanceResponse.
  rpc AssessExonRelevance(AssessExonRelevanceRequest) returns (AssessExonRelevanceResponse) {
    option (themis.rpc.agent_exposed) = true;
  }
}
