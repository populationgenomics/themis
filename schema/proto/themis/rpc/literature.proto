// The `Literature` service — the literature evidence layer's read surface for the workbench,
// (docs/design/document-pane.md). It owns litcache resolution — given a canonical doc_id it names
// the GCS object for a rendering, the PDF, or an associated file, and it locates a citation's quote
// within a chosen representation (offsets in markdown; a page region in a PDF). This proto is the
// source of truth; `regen` (buf generate) emits the themis/rpc/literature stubs — the server
// subclasses the servicer base, a caller uses the stub.
//
// Two consumers: the BFF (service-to-service) calls DescribePaper/ResolveContent/Locate and serves
// the named object itself; the sandbox agent calls Validate at authoring time. The corpus is shared
// (litcache is not session-scoped yet — entitlement is a deferred non-goal, literature-evidence-layer.md),
// so the read rpcs carry no session binding. MaybeIngestPapers is the exception, stated where it is
// declared rather than here: auth is per-rpc on this service, not uniform across it.
syntax = "proto3";

package themis.rpc.literature;


// Which rendering of a paper a request concerns. Markdown is a converter's output; PDF is the
// primary artifact. Locate answers offsets for markdown and a page region for PDF.
enum Representation {
  REPRESENTATION_UNSPECIFIED = 0;
  REPRESENTATION_MARKDOWN = 1;
  REPRESENTATION_PDF = 2;
}

// The role of an associated file (mirrors litcache AssociatedFileRole): a figure referenced inline
// from the markdown, or a supplementary file opened as its own tab.
enum FileRole {
  FILE_ROLE_UNSPECIFIED = 0;
  FILE_ROLE_FIGURE = 1;
  FILE_ROLE_SUPPLEMENTARY = 2;
}

message DescribePaperRequest {
  string doc_id = 1;  // litcache canonical doc_id (UUID)
}

message FileInfo {
  string name = 1;  // the reference used in markdown (figures) and the tab label (supplementary)
  FileRole role = 2;
  string media_type = 3;
}

// What a paper offers, for the pane to pick a default representation and list its files. A paper
// with a source-XML-derived markdown prefers markdown; one whose only rendering is a lossy PDF OCR
// prefers the PDF.
message PaperInfo {
  string doc_id = 1;
  string title = 2;
  bool has_markdown = 3;
  bool markdown_from_xml = 4;  // the markdown rendering derives from source XML (high fidelity)
  bool has_pdf = 5;
  Representation default_representation = 6;
  repeated FileInfo files = 7;
}

message MarkdownSelector {}

message PdfSelector {}

message FileSelector {
  string name = 1;
}

message ResolveContentRequest {
  string doc_id = 1;
  // Which object of the paper to name. Unset is an INVALID_ARGUMENT the server adds.
  oneof selector {
    MarkdownSelector markdown = 2;
    PdfSelector pdf = 3;
    FileSelector file = 4;
  }
}

// The named GCS object. The service resolves identity → object and returns its location; it never
// returns bytes — serving the object to the browser is the BFF's concern (it holds the authz boundary).
message ContentLocation {
  string gcs_uri = 1;  // gs://bucket/object
  string media_type = 2;
}

message LocateRequest {
  string doc_id = 1;
  string quote = 2;
  Representation representation = 3;  // REPRESENTATION_UNSPECIFIED is an INVALID_ARGUMENT
}

// Unicode code-point offsets into the markdown rendering (the anchor convention comments use;
// frontend-framework.md). The client converts to UTF-16 to build a DOM Range.
message TextOffsets {
  int32 start = 1;
  int32 end = 2;
}

// A rectangle on a PDF page. PROVISIONAL coordinate space: page fractions in [0,1], origin
// top-left. The real space is anchorite's, whose coordinate contract is an open question in
// document-pane.md; only the fixture emits these, and no producer resolves a PDF quote yet.
message Rect {
  float x = 1;
  float y = 2;
  float width = 3;
  float height = 4;
}

message PdfRegion {
  int32 page = 1;  // 0-based page index
  repeated Rect rects = 2;
}

// The quote did not locate in the requested representation — a first-class outcome (the pane shows a
// warning chip), distinct from a NOT_FOUND doc_id (a broken citation).
message QuoteNotLocated {}

message LocateResponse {
  oneof result {
    TextOffsets offsets = 1;
    PdfRegion region = 2;
    QuoteNotLocated not_located = 3;
  }
}

// Whether a paper's full text (a markdown rendering) is available, being produced, or permanently
// unavailable — derived from the litcache layout, not a status store (docs/design/evidence-fulltext.md).
enum FullTextState {
  FULL_TEXT_STATE_UNSPECIFIED = 0;
  FULL_TEXT_STATE_READY = 1;  // a rendering is available; fetch it via ResolveContent
  // no rendering and no terminal marker: production has not been attempted, or has not settled. Not a
  // promise that one is underway — a paper the ladder has no rung for reads PENDING too.
  FULL_TEXT_STATE_PENDING = 2;
  FULL_TEXT_STATE_NO_FULL_TEXT = 3;  // terminal, marker-only: the ladder ran and served nothing
  FULL_TEXT_STATE_FAILED = 4;  // terminal: a conversion attempt failed permanently (no producer yet)
  FULL_TEXT_STATE_UNKNOWN_PAPER = 5;  // no such doc_id — a per-id result, never a whole-batch abort
}

message FullTextReadiness {
  string doc_id = 1;
  FullTextState state = 2;
}

message PollFullTextsRequest {
  // litcache canonical doc_ids; duplicates collapse to one readiness. More than 100 is INVALID_ARGUMENT.
  repeated string doc_ids = 1;
}

message PollFullTextsResponse {
  repeated FullTextReadiness readiness = 1;  // one per distinct requested doc_id, order not guaranteed
}

// One requested external id, the paper it names, and that paper's full-text readiness.
message PaperReadiness {
  string external_id = 1;  // echoed back exactly as supplied, scheme-qualified
  // The litcache canonical id. Empty when the id resolved to no paper — a genuine miss, reported
  // alongside FULL_TEXT_STATE_UNKNOWN_PAPER rather than as a call-level error.
  string doc_id = 2;
  FullTextState state = 3;
}

message MaybeIngestPapersRequest {
  // Scheme-qualified external ids (`doi:…`, `pmid:…`, `pmcid:…`). An unqualified id is
  // INVALID_ARGUMENT rather than guessed at. More than 100 is INVALID_ARGUMENT.
  repeated string external_ids = 1;
}

message MaybeIngestPapersResponse {
  // One per distinct requested external_id, order not guaranteed. Two ids naming one paper (a DOI
  // and its PMID) both appear, carrying the same doc_id.
  repeated PaperReadiness readiness = 1;
}

message ValidateRequest {
  string doc_id = 1;
  string quote = 2;
}

// Authoring-time answer for the agent: whether the quote locates in any representation, and which.
// `ok` is false with a `reason` when the doc_id is unknown or the quote locates nowhere. Shares the
// matcher with Locate, so what the agent validates is what the UI later resolves.
message ValidateResponse {
  bool ok = 1;
  repeated Representation located_in = 2;
  string reason = 3;
}

service Literature {
  // What representations and files a paper offers; the pane's default-representation choice.
  // An unknown doc_id is a NOT_FOUND the server adds.
  rpc DescribePaper(DescribePaperRequest) returns (PaperInfo);
  // Name the GCS object for a rendering, the PDF, or an associated file. NOT_FOUND for an unknown
  // doc_id or a selected object the paper lacks.
  rpc ResolveContent(ResolveContentRequest) returns (ContentLocation);
  // Locate a quote within a representation. NOT_FOUND for an unknown doc_id; FAILED_PRECONDITION
  // when the paper lacks the requested representation; a `not_located` result when the quote is
  // absent (not an error).
  rpc Locate(LocateRequest) returns (LocateResponse);
  // Whether a quote locates in any representation — the agent's authoring-time check.
  rpc Validate(ValidateRequest) returns (ValidateResponse);
  // Report each paper's full-text readiness (batch), derived from the litcache layout, with no side
  // effect — it produces nothing and enqueues nothing. A rendering present is READY; a terminal
  // sidecar is NO_FULL_TEXT (nothing served it) or FAILED (a conversion will not succeed on retry);
  // anything else is PENDING; an unknown doc_id is UNKNOWN_PAPER (a per-id result, never a
  // whole-batch abort). Blocking server-side is deliberately not offered: a caller with somewhere to
  // sleep (a sandbox, a browser) waits there for one round trip, where a held request would occupy a
  // serving slot for the whole wait.
  rpc PollFullTexts(PollFullTextsRequest) returns (PollFullTextsResponse);
  // Resolve external ids to papers, report each one's full-text readiness, and start production for
  // the papers that need it. An id litcache has already ingested resolves to its doc_id; one it has
  // not comes back with an empty doc_id and UNKNOWN_PAPER. It never mints — a mint claims, so an
  // unknown id would take a doc_id that names no manifest and a crosswalk claim on that DOI.
  // Resolving ids against upstream sources litcache has never seen is the shape the name still grows
  // into. `Maybe` is load-bearing either way — a call may resolve nothing and produce nothing.
  //
  // Auth departs from the read rpcs because this one spends money: a call with a paper to produce
  // resolves a session first — the token arrives as x-themis-session-token metadata and resolves via
  // themis.clients.auth, never as a message field. UNAUTHENTICATED with no token, PERMISSION_DENIED
  // on one that does not resolve. A call whose ids are all settled produces nothing and needs none.
  //
  // A crosswalk that cannot be reached is UNAVAILABLE for the whole call, never a per-id miss: an
  // outage affects the batch, and a caller reading it per-id would write papers off permanently.
  rpc MaybeIngestPapers(MaybeIngestPapersRequest) returns (MaybeIngestPapersResponse);
}
