// The `auth` service: authorization (docs/design/access-control.md). It is the sole reader of the
// deployment's ACL and of the token store, and answers from them for both paths: what a person may
// reach (GetAccess, for the web tier), and what a per-session token grants (ResolveSession, for a
// data-plane service forwarding the token a call carries). This proto is the source of truth (the
// contract); `regen` (buf generate) emits the themis/rpc/auth stubs each consumer imports — the server
// subclasses the servicer base, a caller uses the stub.
syntax = "proto3";

package themis.rpc.auth;

import "themis/rpc/sandbox_options.proto";

// The token forwarded to be resolved: a high-entropy per-session secret the auth service hashes
// before lookup.
message ResolveTokenRequest {
  // 43 characters of `[A-Za-z0-9_-]`: the unpadded base64url encoding of an HMAC-SHA256 over the
  // session id (themis/clients/auth/derive.py). Documented, not enforced on the wire — a value of
  // any other shape fails at the hash lookup.
  string session_token = 1;
}

// What a person may do in a Project. The ACL lists the people holding each role; a person may hold
// both.
enum Role {
  ROLE_UNSPECIFIED = 0;
  // Runs the Project's curation: manages its variants, assigns curators and reads the comparisons.
  ROLE_MANAGER = 1;
  // Works the worksheets assigned to them.
  ROLE_CURATOR = 2;
}

// A Project a caller may reach, as the ACL states it at the moment of the call: the one shape the
// auth service answers in, whether asked for a session's Project or for a person's. A Project is one
// dataset, so its id is also what a backend service reads on the Project's behalf.
message ProjectGrant {
  // The Project's key in the ACL: the dataset's name, a lowercase slug (`[a-z0-9][a-z0-9-]*`). The
  // site keeps it stable for the Project's lifetime, since Analyses are stored under it.
  string id = 1;
  // The person's roles in the Project, each at most once; non-empty in a GetAccess answer. Empty in a
  // SessionContext: an agent acts for its Analysis, not for a person.
  repeated Role roles = 2;
}

// The binding a resolved token grants — the Project and the Analysis whose workspace the caller may
// read and write. Project first (a Project nests Analyses).
message SessionContext {
  reserved 1;
  reserved "project_id";
  // `an_` followed by a lowercase, hyphenated UUIDv4, minted when the Analysis is created.
  string analysis_id = 2;
  // The Analysis's Project, read from the ACL at the moment of the call, so a Project removed
  // from the ACL stops being granted at the next call.
  ProjectGrant project = 3;
}

message GetAccessRequest {
    // The email address in the IAP assertion the web tier verified: a person's Google account, or a
  // service account's. Matched case-insensitively against the ACL, whose addresses are lowercase.
  string email = 1;
}

message GetAccessResponse {
  // A grant for each Project on which the person holds a role; the deployment's operator account holds
  // both roles on every Project. Empty means the person is not admitted: they reach nothing, including
  // the surfaces that need no Project.
  repeated ProjectGrant projects = 1;
}

// What a call's caller claims to be calling as, carried as the `x-themis-claim-bin` metadata on every
// data-plane call (docs/design/rpc-authorization.md). The callee verifies the calling service account
// from its ID token and trusts this claim because that account is trusted to make it; the claim is
// what the call's authorization context is hydrated from, and it is honoured only if the account has a
// `Caller` member calling as the same thing. A call carrying no claim calls as itself. A claim the
// callee cannot honour — a session-bearing `calling_as` with no token, or a field nothing resolves yet —
// is a fault on the caller's side, not a denial.
message CallerClaim {
  themis.rpc.CallingAs calling_as = 1;
  // The session token, when `calling_as` names a session. Resolved to the Project + Analysis the call is
  // scoped to; one that does not resolve is no binding, and the member is not satisfied. Shaped as
  // `ResolveTokenRequest.session_token` is.
  string session_token = 2;
}

// The auth service: what a person may reach, and what a session token grants.
service Auth {
  // What the person behind an authenticated email address may reach. Only the web tier may call it,
  // because it trusts the address it is given: the web tier authenticated the person itself and relays
  // nobody's claim. While the auth service's copy of the ACL is older than its staleness limit,
  // every call is UNAVAILABLE rather than answered from that copy.
  rpc GetAccess(GetAccessRequest) returns (GetAccessResponse) {
    option (themis.rpc.admits_caller) = CALLER_WEB;
  }
  // Resolve a session token to its binding. An invalid, revoked, or expired token, or one whose Project
  // is no longer in the ACL, is a PERMISSION_DENIED the server adds — a transport-level rejection,
  // not a modelled body. While the auth service's copy of the ACL is older than its staleness
  // limit, every call is UNAVAILABLE, as for GetAccess.
  //
  // No `admits_caller`, and not an omission: this is the rpc an admission is derived through, so it
  // cannot itself be gated on one. Its callers are the data-plane service accounts, which no
  // `Caller` member names; what may reach it is `run.invoker`.
  rpc ResolveSession(ResolveTokenRequest) returns (SessionContext);
}
