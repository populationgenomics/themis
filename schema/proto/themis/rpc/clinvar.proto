// clinvar: NCBI ClinVar — the queried allele's own record with its per-submission evidence, the
// gene's classified pool, and every record at one coding span. Design: docs/design/evidence-interfaces.md.
//
// Modelled from:
//   NCBI ClinVar E-utilities — `efetch` (the VCV record) and `esearch` -> `esummary` (the pooled
//     searches): `ClinVarRecord`, `ClinVarSubmission`, `ClinVarObservation` and `ClinVarZygosityCount`
//     carry the record's fields under ClinVar's own names and attribute tokens; `variation_archive` is
//     clinvar-proto's generated record type, whose schema this module carries a copy of
//     (clinvar_proto/clinvar.proto).
//   SVCv4 SM19 / SM3 (docs/design/svcv4-interpretations.md § "Which ClinVar classifications count as a
//     pathogenic assertion"): the membership gate `esearch_term` encodes, and the field-to-code mapping
//     in the comments; no message models an SVCv4 vocabulary.
//   This interface's own design: both request messages, the census fields (`total_in_gene`,
//     `considered_in_gene`, `pool_truncated`, `records_with_unparsed_hgvs`, `esearch_term`, and
//     `SearchCodingSpan`'s counterparts), and `CodingRegion` / `CodingCoordinate` / `CodingSpan`, which
//     model HGVS c. coordinate grammar.
//
// EVALUATION ONLY, AGAINST A DRAFT STANDARD. SVCv4 is a July 2026 pilot: its point values,
// thresholds and code names may change before publication, so the SVCv4 codes named throughout
// these comments are provisional. Nothing here is validated for clinical or diagnostic use, and a
// classification composed from these facts is not a clinical variant classification.
//
// Auth is per the service pattern (services.md): the session token arrives as x-themis-session-token
// metadata and resolves via themis.clients.auth; it is never a message field.
//
// The shared value types (Provenance, GenomicSpan, the routing Consequence):
// themis/evidence/models/evidence.proto. The c. coordinate types are this contract's own.

syntax = "proto3";

package themis.rpc.clinvar;

import "clinvar_proto/clinvar.proto";
import "google/protobuf/struct.proto";
import "themis/evidence/models/evidence.proto";
import "themis/rpc/sandbox_options.proto";

// Every service in this file is agent-callable through the hatch (sandbox-rpc-exposure.md).
option (themis.rpc.agent_exposed) = true;

// ---- DescribeVariant: the queried allele's record + the gene's classified P/LP variants ---------
// Resolves ClinVar's aggregate classification and review status so the model judges
// informative-variant eligibility over records it can weigh, not raw submissions. Two independent
// lookups, one per concern — the requested accession's own record (efetch by accession) and the
// gene's P/LP pool (esearch -> esummary). Doc maps fields to codes:
//   this_variant        -> context ONLY: the record the requested accession names, its aggregate
//                          classification and its per-submission evidence (see `submissions`).
//                          Absent when the request named no accession, which is the registry's
//                          crosswalk naming no ClinVar variation for the allele as of its last
//                          ClinVar ingest (Variant.Normalize's `clinvar_variations`) — the gene pool
//                          comes back either way, and a novel variant is the ordinary case. An
//                          accession that efetches to NO record is not an absence: the crosswalk and
//                          ClinVar disagree, which is this service's own inconsistency to reconcile,
//                          so it fails the rpc — as a symbol ClinVar files nothing under does on
//                          SearchCodingSpan. `variation_archive` is the same record whole, and two
//                          of its fields carry what this reading cannot. `variation_type` says what
//                          kind of unit the record is about: a crosswalk entry can name a haplotype
//                          or genotype the queried allele is one part of, classified as that unit.
//                          `record_type` says whether the record is classified in its own right at
//                          all, or exists only because the allele arrived inside a larger submitted
//                          set. Under either, what is held is not a classification of the allele
//                          alone.
//   classified_in_gene  -> the gene's records ClinVar classifies PATHOGENIC in aggregate, at the
//                          requested floor: the P/LP-density signal, and the pathogenic HALF of the
//                          *_INF candidate set. It is NOT the *_INF candidate set. The search is
//                          classification-scoped, and each aggregate term has its own esearch token,
//                          so the gate is the disjunction clinsig_pathogenic OR
//                          clinsig_likely_pathogenic OR clinsig_pathogenic_low_penetrance OR
//                          clinsig_likely_pathogenic_low_penetrance OR
//                          clinsig_established_risk_allele OR clinsig_likely_risk_allele
//                          [Properties] — never clinsig_uncertain_risk_allele, and never
//                          clinsig_pathogenic alone, which under-selects (~345 records registry-wide
//                          carry a qualified term and no plain one). So every benign, likely-benign
//                          and uncertain-significance record in the gene is absent from the pool BY
//                          CONSTRUCTION — and the trees score those too: a B/LB
//                          informative variant subtracts (-2.0 first B, -1.0 first LB) and a VUS one
//                          scores 0.0. So this field supports "no P/LP record at this codon" and can
//                          never support "no informative variant at this codon"; `SearchCodingSpan` is
//                          the rpc that answers the second. Per-variant ELIGIBILITY (distinct,
//                          non-circular evidence — SM19) is the model's call,
//                          never a lookup. Transcript.AssessExonRelevance counts a pool of its own at a fixed floor
//                          (see clinvar_plp_density there) — the two coincide only when this
//                          request names the same one.
//                          Membership is decided on the ACMG/ClinGen terms of the AGGREGATE germline
//                          classification — the ones "/" joins — and every one of them has to be in
//                          the pathogenic family: "Pathogenic", "Likely pathogenic",
//                          "Pathogenic/Likely pathogenic", the two low-penetrance forms
//                          ("Pathogenic, low penetrance", "Likely pathogenic, low penetrance"),
//                          "Established risk allele", "Likely risk allele". What follows a ";" is a
//                          non-ACMG assertion ("risk factor", "association") and bears on membership
//                          neither way, so "Pathogenic; risk factor" is a member and "Conflicting
//                          classifications of pathogenicity; risk factor" is not — the ACMG term
//                          there is the conflicting one. Two exclusions the family invites: an
//                          uncertain risk allele is NOT a member under either spelling ("Uncertain
//                          risk allele", "Uncertain significance/Uncertain risk allele"), and
//                          neither is "Conflicting classifications of pathogenicity" under any
//                          suffix — a substring test on "athogenic" admits the conflicting ones
//                          (measured on MYH7: a ninefold DAFT inflation, anchored on a synonymous
//                          variant). SM3's pathogenic-variants DAFT reads the same pool through a
//                          strictly narrower gate, excluding the low-penetrance and risk-allele
//                          terms — a frequency condition SM19 does not state — and applies it itself
//                          in themis.svcv4.clinvar_classification, not here.
//   review_stars        -> each record's gold-star count, mapped from its review status. The pool is
//                          filtered on `DescribeVariantRequest.review_status_floor` and on nothing else, so
//                          what arrives is what the caller asked for. The floor is in the SEARCH
//                          TERM, so it selects rather than merely trims: filtered after the bound
//                          instead, a 3-star record ranked below it would be unreachable at any
//                          floor — on a well-studied gene, exactly the record that settles the
//                          question. Which is also why re-filtering these records at a stricter
//                          floor is NOT the same answer as asking for that floor whenever
//                          `pool_truncated` is set: the stricter set reaches records this one's
//                          bound cut off. Re-filter only a complete pool; otherwise re-fetch.
//   review_status       -> the phrase behind the stars ("reviewed by expert panel" / VCEP tier): the
//                          consensus signal the agent checks first, distinct from the star count.
//   submissions         -> the per-submitter evidence *_INF eligibility and circularity rest on: who
//                          asserted what, under which criteria, from which observations —
//                          organization, its own classification and review status, assertion
//                          method, free-text comment, cited PubMed ids, and the `erepo_url` a VCEP
//                          submission carries. Star counts alone cannot answer either question
//                          (SM19), and the citations are the agent's route into the literature.
//                          Populated on `this_variant` only: the gene pool comes from a bulk
//                          esummary, which carries no submission detail.
// The pool comes back typed and its esummary payloads are not echoed: one runs ~2.3 kB, so a pool
// the transport carries typed would not survive coming back verbatim beside it. Every field the pool
// is read for is on `ClinVarRecord`, and `esearch_term` is the term that selected it.
message DescribeVariantRequest {
  // ClinVar's variation accession for the allele whose own record to fetch, e.g. "VCV001685262",
  // from Variant.Normalize's `clinvar_variations`. Optional: unset says the registry's crosswalk
  // named no ClinVar variation for the allele, and the gene pool is then the whole answer. efetch
  // takes the ZERO-PADDED accession and answers a bare numeric UID with a 200 carrying an empty
  // `<set/>`, so a value outside that shape is INVALID_ARGUMENT rather than a lookup that silently
  // comes back empty.
  //
  // An accession and not an HGVS string, because ClinVar indexes RENDERINGS and no one string spans
  // version, notation and shift at once: HOXA13 NM_000522.5:c.396_398del is VCV001685262 — Benign,
  // 1 star, two laboratories — indexed under the NM_000522.4:c.396_398delCGC spelling and titled in
  // repeat notation ("NM_000522.5(HOXA13):c.381CGC[5]"), so an exact-phrase search for the caller's own
  // string matches nothing while a neighbouring plain-notation record, NM_000522.5:c.375_377del, is a
  // DIFFERENT allele rendering the same p.Ala133del. The registry resolves the allele's identity; this
  // rpc fetches the record that identity names.
  string vcv = 1;
  string gene = 2;     // HGNC symbol (required): the gene whose classified-variant set feeds *_INF + density
  // Minimum gold stars a record needs to enter `classified_in_gene`, 0-4. The DEFAULT 0 keeps every
  // P/LP record and is not a policy: there is no floor to bake in — SVCv4 states none, and across
  // all 206 ClinGen CSpec VCEP specifications none pins review status on a frequency comparator (see
  // themis.svcv4.frequency) — and the three uses of this pool do not share one anyway: *_INF
  // eligibility is a per-submission judgement (SM19), the DAFT is a frequency maximum, and the
  // density is a burden count. A value outside 0-4 is INVALID_ARGUMENT.
  //
  // It scopes the SEARCH, not just the returned records, which is what makes it the lever against
  // `max_pool_records`: at a 3-star floor the pool is the gene's 3-star records, not whichever of
  // them survived a bound applied to the whole P/LP set. Raise the floor to reach further into a
  // well-studied gene; the bound alone cannot.
  int32 review_status_floor = 3;
  // How many matching records to fetch and filter. REQUIRED — 0 is INVALID_ARGUMENT, and so is a
  // value above 2000. There is no default because the bound is the rpc's whole cost: a ClinVar
  // esummary runs ~1.1 MB and ~10 s per 500 records (measured, July 2026), so 2000 is what fits
  // beside the allele lookup inside the 75 s deadline, and a caller that needs more of a gene
  // raises `review_status_floor` rather than this. Whether it bound is `pool_truncated`, and
  // `total_in_gene` says by how much.
  int32 max_pool_records = 4;
}
// One zygosity a submitter reported, and how many it reported at it. One observation covers a cohort
// and can mix them — HFE c.845G>A carries 5 homozygous alongside 119 heterozygous in a single block —
// so a scalar zygosity cannot represent it, and the per-zygosity count is what the recessive rules
// read.
message ClinVarZygosityCount {
  // ClinVar's ObservedData attribute token verbatim: "SingleHeterozygote" | "CompoundHeterozygote" |
  // "Homozygote" | "Hemizygote" | "VariantChromosomes" | "NumberMosaic".
  string zygosity = 1;
  // The unit follows the token: individuals under a zygosity token, CHROMOSOMES under
  // VariantChromosomes. Absent when the submitter gave no count.
  optional int32 count = 2;
}
// One person/family/cohort observation a submitter reported behind its classification. Every value is
// the submitter's own, `age` excepted — that one is rendered from ClinVar's structured elements — and
// an empty string, empty list, or absent count means the submitter stated nothing (ClinVar's "not
// provided" placeholder is normalised to that, never carried as a value).
message ClinVarObservation {
  string origin = 1;                            // "germline" | "somatic" | "de novo" | "maternal" | ...
  // "yes" | "no" | "unknown" | "not applicable"; upstream's "not provided" arrives as the empty
  // string, per the normalisation above.
  string affected_status = 2;
  repeated ClinVarZygosityCount zygosities = 3;
  // ClinVar's `VariantAlleles` attribute verbatim — the submitter's own total for the observation.
  // Named for the attribute, not for a unit: despite the name, submitters populate it with the number
  // of INDIVIDUALS, so it tracks the `zygosities` sum (124 = 5 + 119 on HFE c.845G>A) and is not an
  // allele count. Do not double it for homozygotes, and do not read it as independent of `zygosities`.
  optional int32 variant_alleles = 4;
  // Rendered from the observation's Age elements — up to two, each carrying its own unit and one of
  // the types minimum / maximum / single — as "<type>=<value><unit>", joined by ", ":
  // "minimum=35years, maximum=44years". Empty where the observation carries none.
  string age = 5;
  // ClinVar prefers the NumberMales / NumberFemales counts and files this element only where a
  // submitter gave none, so empty is not the submitter saying nothing about sex composition.
  string sex = 6;
  string collection_method = 7;                 // e.g. "clinical testing", "research", "literature only"
  repeated string descriptions = 8;             // the submitter's free-text notes; one block can carry many
  repeated string traits = 9;                   // the phenotype(s) this observation was made in
  // PMIDs cited anywhere on this observation, so a case reported once and restated by a second
  // submitter is visible (SM19 circularity). Where a submitter files several families in one
  // observation, `descriptions` and `pubmed_ids` are both flat lists — they are NOT paired.
  repeated string pubmed_ids = 10;
}
// One submitter's assertion (an SCV) on the variant: the unit *_INF eligibility and circularity are
// judged over. `assertion_method` + `comment` + `observations` are the evidence; `submitter` +
// `organization_category` are what a circularity check reads (two SCVs from one lab, or a lab
// restating a published family, are not independent).
message ClinVarSubmission {
  string scv = 1;                            // SCV accession — the submission's stable id
  string submitter = 2;                      // submitting organization name
  // "laboratory" | "clinic" | "consortium" | "patient registry" | … — unenumerated upstream
  // (xs:string), so read it as a label and not as a closed set.
  string organization_category = 3;
  // This submitter's own germline classification. Empty when it filed an observation without one
  // (a patient registry under "no classification provided"). Only germline assertions appear here —
  // an SCV classifying somatic clinical impact or oncogenicity is a different question, and its
  // tumour observations are not germline evidence.
  string classification = 4;
  string review_status = 5;                  // e.g. "criteria provided, single submitter"
  string date_evaluated = 6;                 // DateLastEvaluated, ISO date; empty when unstated
  string assertion_method = 7;               // the criteria applied, e.g. "ACMG Guidelines, 2015"
  string mode_of_inheritance = 8;
  string comment = 9;                        // the submitter's free-text evidence summary
  // The condition(s) this submission asserts against. A Trait can carry an ontology XRef and no name
  // — VCEP submissions do — and the element then carries the bare ontology id ("MONDO:0005045")
  // rather than nothing.
  repeated string conditions = 10;
  // PMIDs cited on the classification and on the submission itself; the ones cited on an individual
  // observation stay on that observation. A submitter can cite in `comment` prose ALONE, which is the
  // common case on expert-panel submissions, so an empty list is not an uncited assertion — and the
  // record's aggregate classification carries a citation set of its own besides.
  repeated string pubmed_ids = 11;
  // ClinGen Evidence Repository link, when a VCEP submitted. It arrives as a generic
  // Classification/Citation/URL identified by its host; no element marks it as the eRepo's.
  string erepo_url = 12;
  repeated ClinVarObservation observations = 13;
}
// Which of a transcript's three coordinate regions numbers a c. position. HGVS restarts at 1 in
// each, so the number alone places nothing: c.-25, c.25 and c.*25 are three different bases.
enum CodingRegion {
  CODING_REGION_UNSPECIFIED = 0;
  CODING_REGION_FIVE_PRIME_UTR = 1;   // c.-n: n bases 5' of the A of the initiation codon
  CODING_REGION_CDS = 2;              // c.n
  CODING_REGION_THREE_PRIME_UTR = 3;  // c.*n: n bases 3' of the termination codon
}
// One endpoint of a c. coordinate.
message CodingCoordinate {
  CodingRegion region = 1;
  int32 position = 2;  // the number within `region`, always positive (a 5'UTR "-" is the region, not a sign)
  // 0 for an exonic base. +n counts from the preceding exon's last base (the donor side), -n from
  // the following exon's first (the acceptor side): c.3496+1 is +1, c.3497-2 is -2.
  int32 intron_offset = 3;
}
// One CERTAIN, inclusive interval on one coding transcript: the placement key the exon and codon
// arithmetic over the classified pool runs on. That is the whole of its scope — it carries no edit,
// no allele, no uncertainty, no n. coordinate and no second reference — and an expression outside it
// is DECLINED rather than placed approximately, its record named in
// `DescribeVariantResponse.records_with_unparsed_hgvs`. Declined: a copy-number title
// ("GRCh38/hg38 17q11.2(chr17:31...)x1"), an uncertain-boundary one ("c.(?_-33)_(*1_?)del"), a
// genomic or n. rendering, and short-form repeat notation — ClinVar renders a repeat as its tract
// start plus the unit and a count ("c.571ATG[1]"), and the tract's extent does not follow from the
// string (it is reference-dependent, per the HGVS spec), so the expression is declined rather than
// placed one base wide.
//
// An insertion's endpoints BRACKET the insertion point and alter neither base — HGVS writes an
// insertion range exclusive, so end = start + 1 — which an overlap test must not read as the
// insertion covering both flanking bases.
message CodingSpan {
  // The accession the coordinates are numbered on, as the upstream wrote it. A pool of ClinVar
  // records is NOT written against one transcript, so compare this before comparing coordinates —
  // the same c. number means different bases on two transcripts of a gene.
  string transcript = 1;
  CodingCoordinate start = 2;
  // Equal to `start` for a single-base change. A deletion can cross an exon boundary, so the two
  // ends do not always fall in the same exon. Ordering and length arithmetic are per REGION: inside
  // CODING_REGION_FIVE_PRIME_UTR the position counts DOWN 5'->3' (c.-25 is upstream of c.-1), so
  // start.position <= end.position does not hold there.
  CodingCoordinate end = 3;
}
// One ClinVar record, the shape both the queried allele and every pooled record are reported in.
message ClinVarRecord {
  string clinvar_id = 1;      // VCV accession; no route in this rpc answers with an RCV
  string hgvs = 2;
  string classification = 3;  // germline classification, e.g. "Pathogenic", "Likely pathogenic"
  // Gold-star count 0-4, mapped from the record's aggregate review status; the *_INF star gate
  // filters on it. The mapping is keyed on that vocabulary as Entrez and the XSD spell it — "no
  // classification for the single variant", not the web documentation's "individual" — and every
  // "no …" status maps to 0, "no classifications from unflagged records" included, which ClinVar
  // publishes no star for.
  int32 review_stars = 4;
  // The record's asserted condition(s), for the same-phenotype *_INF check: ClinVar's aggregate
  // carries a trait SET rather than one term (up to five observed), each value verbatim as ClinVar
  // states it — its "not provided" placeholder included.
  repeated string conditions = 5;
  // Per-submitter evidence, populated for `this_variant` only: the gene pool is fetched in bulk
  // (esummary), which carries no submission detail.
  repeated ClinVarSubmission submissions = 6;
  // `hgvs` parsed into coordinates: placing the gene's classified pool — `classified_in_gene` here,
  // `records` on SearchCodingSpan — against Transcript.GetStructure's exon table is then integer
  // comparison rather than a regex over display strings. Absent where the expression falls outside
  // what `CodingSpan` places, and every such record is named in
  // `DescribeVariantResponse.records_with_unparsed_hgvs` so it cannot vanish from a per-exon tally unnoticed.
  CodingSpan coding_span = 7;
  string review_status = 8;   // the phrase behind the stars, e.g. "reviewed by expert panel"
}
// The queried allele's own record and the gene's pathogenic pool, each with the census bounding it.
message DescribeVariantResponse {
  ClinVarRecord this_variant = 1;                  // the requested accession's record; context only
  // The gene's records ClinVar classifies pathogenic in aggregate, at the requested floor: the
  // P/LP-density signal and the pathogenic HALF of the *_INF candidate set. Not the candidate set —
  // the search is classification-scoped, so no B/LB and no VUS record is here at any floor, and the
  // trees score those. `SearchCodingSpan` is the positional, all-classification census.
  repeated ClinVarRecord classified_in_gene = 2;
  // The gene pool's census, so a caller can tell a complete pool from a bounded one. A well-studied
  // gene carries thousands of P/LP variants, so `pool_truncated` is the ordinary case there and
  // `classified_in_gene` is then a PREFIX: its size is a lower bound on the gene's pathogenic
  // records and the P/LP density is not a census. The classification and star filters are re-applied
  // to the `considered_in_gene` records, so total >= considered >= len(classified_in_gene).
  // Every count here is AT THE REQUESTED FLOOR — the search carries it — so a truncated pool tells
  // the caller how much of the gene a higher floor would bring within `max_pool_records`.
  int32 total_in_gene = 3;       // every record the gene's classification + review-status term matches
  int32 considered_in_gene = 4;  // how many of those were fetched and filtered (max_pool_records bound it)
  bool pool_truncated = 5;       // considered_in_gene < total_in_gene
  // The `clinvar_id` of every record returned here whose `hgvs` named no c. span, so it carries no
  // `coding_span`. A well-studied gene's pool holds copy-number and uncertain-boundary records, and
  // dropping them from a per-exon tally silently understates that exon; they are named rather than
  // filtered out because whether one belongs in the exon is a question the coordinates cannot
  // settle. Covers `this_variant` as well as `classified_in_gene`.
  repeated string records_with_unparsed_hgvs = 6;
  // The gene-pool esearch term issued, verbatim: membership rests on a six-token classification
  // disjunction and the star floor rides in the same term, so the term is what says what the pool
  // is a pool OF.
  string esearch_term = 7;
  // The requested accession's VariationArchive whole, as efetch returned it — `this_variant` is the
  // reading of it the SVCv4 codes take, and this is everything that reading came from: the aggregate
  // classification blocks, every SCV, `variation_type` and `record_type`. ClinVar's unit here is the
  // VARIATION, which can be a haplotype or genotype the queried allele is only one part of rather
  // than the allele alone. The E-utilities envelope is unwrapped; this is its single child.
  .clinvar.VariationArchiveType variation_archive = 15;
  // One per request issued, so each carries its own `query`: the accession's efetch and the gene
  // pool's search. Both share a `source`, so do not de-duplicate on it.
  repeated themis.evidence.models.Provenance provenance = 16;
}

// ---- SearchCodingSpan: every classification at one c. span, for the *_INF benign/VUS arms --------
// The positional census `DescribeVariant` cannot give. `DescribeVariantResponse.classified_in_gene` is
// classification-scoped — pathogenic only, by the search term — so it supports "no P/LP record at
// this codon" and never "no informative variant at this codon", which is the question the trees ask:
// every *_INF rule scores a B/LB informative variant (-2.0 first B, -1.0 first LB) and a VUS one
// (0.0) alongside its pathogenic arm.
//
// THE SPAN, NOT THE GENE, IS THE UNIT, because that is what the rules key on: SM19's *_INF codes ask
// about the same CODON (MIS_INF) or the same EXON (NUL_INF, SPL_INF), never about the gene. A
// gene-wide all-classification pool would be wrong-shaped twice over — it answers a question no rule
// asks, and where it matters most it is unfetchable (LDLR alone carries 2304 pathogenic records at
// floor 0, before any other classification), so a bound would cut it to a prefix that says nothing
// about any one codon. Span-scoped, the census is complete and small: 3 records at SCN2A codon 370,
// 17 across a 51-nt TRDN exon (measured, August 2026).
//
// HOW THE SPAN IS SEARCHED, since it decides what lands in it. ClinVar's Entrez index has no c.
// coordinate to search on — `einfo` lists `[Base Position]` and no transcript-relative field — so the
// c. range is projected through the transcript's own exon table onto genomic coordinates and the
// search runs on those, scoped to the gene the table names. That index is GRCh38, which is why the
// rpc carries no genome build and pins GRCh38: the exon table has to be read on the assembly the
// search is indexed by, and the RECORDS are the same set on either build anyway.
//
// `[Base Position]` holds a record's two ENDPOINTS and not the bases between them (measured: a 6-nt
// deletion answers a search at its first and last base and at neither base in between), so a
// coordinate range alone would miss precisely the record that CONTAINS the span — a deletion
// beginning before a codon and ending after it, which is an informative variant at that codon — and
// miss it as an empty census. A second clause therefore searches a 1000-nt-wider window for records
// at least as long as the span, and every hit is then measured against the span, so what comes back
// is the records that genuinely meet it. The residual, stated because no clause reaches it: a record
// longer than that window and extending past it on BOTH sides — a copy-number record, whose extent
// no c. range expresses and whose per-exon reading is `Transcript.AssessExonRelevance`'s.
//
// Three further consequences the caller reads the result under: a record whose title is written on a
// DIFFERENT transcript of the gene is IN (its `coding_span.transcript` says so, and its c. numbers
// are that transcript's, not the requested one's); a c. range crossing an exon boundary maps to one
// genomic interval that spans the intervening intron, so the census is then a superset of the exonic
// bases asked about (`searched_span` is what actually ran, and each record's
// `coding_span.intron_offset` places it); and a record ClinVar annotates to a neighbouring gene
// alone is OUT.
//
// Doc maps fields to codes:
//   records            -> every record in the span, of EVERY germline classification, each with its
//                         `classification`, `review_stars`, `review_status`, `conditions` and
//                         `coding_span`: the *_INF candidate set at that position, both arms.
//                         ELIGIBILITY stays the model's (SM19) — `submissions` is empty here as it
//                         is on `classified_in_gene`, so a candidate that has to be weighed is
//                         re-asked of `DescribeVariant` under its own accession. A record ClinVar
//                         carries with no germline classification at all is present with an empty
//                         `classification` rather than dropped: it is in the span, and it is not an
//                         informative variant. Usually that is a NoClassification record — ClinVar's
//                         fourth classification kind, an evidence_only submission — and less often a
//                         somatic- or oncogenicity-only one.
//   total_in_span / considered_in_span / span_truncated -> the census, read as DescribeVariantResponse's.
// An EMPTY `records` is the finding — most codons carry no ClinVar record — and it comes back as an
// empty list. It is checked apart from the one other thing that produces an empty search: a symbol
// ClinVar files nothing under, where the exon table and ClinVar disagree about the gene's name and
// the search would be empty at any coordinates. That is this service's own inconsistency to
// reconcile, not an answer, so it fails the rpc rather than arriving as the finding.
message SearchCodingSpanRequest {
  // Versioned RefSeq coding accession (required), e.g. "NM_001042492.3" — the transcript the c.
  // coordinates below are numbered on and whose exon table projects them, exactly as
  // GetStructureRequest takes it. An unversioned accession, an Ensembl ENST, an `NR_` or a
  // full HGVS is INVALID_ARGUMENT.
  string transcript = 1;
  // The span's first and last c. coordinate on `transcript`, both REQUIRED and both inclusive:
  // positive = in the CDS (c.3496), negative = 5'UTR (c.-20), and 0 is INVALID_ARGUMENT because c.
  // numbering has no 0 — which is also how an unset field is caught. `cds_end` must not precede
  // `cds_start`. A codon is its three bases (1108, 1110); an exon is that exon's `cds_start`/`cds_end`
  // from Transcript.GetStructure.
  //
  // The offset forms have no integer encoding, exactly as on GetStructureRequest: a 3'UTR
  // position (c.*n) and an intronic one (c.3496+1, c.3497-2) cannot be given, so a wholly-3'UTR exon
  // cannot be asked about this way. Records AT those positions still land in the span whenever the
  // genomic interval reaches them. A signed int rather than an HGVS string is what leaves those forms
  // unrepresentable instead of runtime-rejected, and it is the encoding GetStructureRequest takes.
  int32 cds_start = 2;
  int32 cds_end = 3;
  // How many matching records to fetch and summarise. REQUIRED — 0 is INVALID_ARGUMENT, and so is a
  // value above 500. Lower than DescribeVariantRequest.max_pool_records because the other leg is different:
  // the exon table comes from VariantValidator, which self-extends to 60 s, so what is left of the
  // rpc's own budget is one esummary page and not four. The bound is a guard rather than a lever
  // either way — a codon or an exon holds tens of records, not thousands, so `span_truncated` set
  // says the span is wider than a rule's unit.
  int32 max_records = 4;
}
// Every germline classification in the requested c. span, with its census and the interval searched.
message SearchCodingSpanResponse {
  repeated ClinVarRecord records = 1;
  int32 total_in_span = 2;       // every record the span's term matches
  int32 considered_in_span = 3;  // how many of those were fetched (max_records bound it)
  bool span_truncated = 4;       // considered_in_span < total_in_span
  // The `clinvar_id` of every returned record whose `hgvs` named no c. span, read as
  // DescribeVariantResponse.records_with_unparsed_hgvs. A span census holds these too — a copy-number record
  // overlapping the exon is titled cytogenetically — and dropping them would understate the span.
  repeated string records_with_unparsed_hgvs = 5;
  string transcript = 6;            // echoed: the accession the requested c. coordinates were read on
  string gene = 7;                  // HGNC symbol the exon table names for `transcript`; the search is scoped to it
  string chromosome_accession = 8;  // the GRCh38 accession `searched_span` is on, e.g. "NC_000002.12"
  // The GRCh38 interval the ClinVar search actually ran on, ascending on both strands: the requested
  // c. endpoints projected through the exon table. Read it before reading the census — it is what
  // says whether an intron came along with a boundary-crossing range.
  themis.evidence.models.GenomicSpan searched_span = 9;
  // The ClinVar esearch term issued, verbatim: two clauses, since `[Base Position]` holds only a
  // record's endpoints, and the wider window's length bound rides in the same term — so the term is
  // what says which records could have landed in the span at all. Their esummary payloads are not
  // echoed, for the reason DescribeVariantResponse's are not.
  string esearch_term = 10;
  // The VariantValidator transcript record the c. -> genomic projection ran through, for replay:
  // `searched_span` is what the projection produced.
  google.protobuf.Struct variantvalidator_transcript = 15;
  repeated themis.evidence.models.Provenance provenance = 16;  // VariantValidator (the exon table) + NCBI ClinVar
}

service ClinVar {
  // NCBI ClinVar, keyed on the variation accession Variant.Normalize's crosswalk named. The
  // accession's own record with its per-submission evidence, and the gene's records ClinVar
  // classifies pathogenic at the requested review-status floor -> the P/LP density and the pathogenic
  // half of the *_INF candidate set (eligibility is the model's, SM19). The gene pool is P/LP by
  // construction, so the benign and VUS arms of the *_INF rules are SearchCodingSpan's, not this
  // rpc's. See DescribeVariantResponse.
  rpc DescribeVariant(DescribeVariantRequest) returns (DescribeVariantResponse);
  // VariantValidator (the exon table) -> NCBI ClinVar. Every germline record ClinVar holds at
  // one c. span of one transcript, of every classification, with its review stars and c. coordinates
  // -> the *_INF candidate set at a codon or an exon, benign and VUS arms included. See
  // SearchCodingSpanResponse.
  rpc SearchCodingSpan(SearchCodingSpanRequest) returns (SearchCodingSpanResponse);
}
